<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>JIWU吉物躺著賺後台</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#f3f3f3;
--card:#fff;
--soft:#f7f7f7;
--soft2:#eee;
--border:#e2e2e2;
--text:#555;
--muted:#999;
--main:#A68C73;
--main2:#A68C73;
--green:#8fa98b;
--red:#c9827d;
--blue:#8ca7b2
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden
}
body{
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif
}
.loginScreen{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:#fff
}
.loginCard{
width:min(440px,100%);
text-align:center
}
.loginLogo{
display:block;
width:50%;
height:auto;
margin:0 auto 24px
}
.loginForm{
width:min(360px,100%);
margin:auto
}
.loginForm input:not([type="checkbox"]){
display:block;
width:100%;
min-width:0;
padding:12px 20px;
border-radius:999px;
text-align:center
}
.loginRemember{display:flex;align-items:center;justify-content:center;gap:7px;margin:12px 0 0;color:#666;font-size:14px;cursor:pointer}.loginRemember input{width:16px;height:16px;margin:0}
.loginError{
min-height:22px;
margin:10px 0 0;
color:var(--red);
font-size:14px
}
.protectedShell{display:none}
body.isAuthenticated .loginScreen{display:none}
body.isAuthenticated .protectedShell{display:block}
button,input,select{font:inherit}
button{cursor:pointer}
input[type=number]{
appearance:textfield;
-moz-appearance:textfield
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
-webkit-appearance:none;
margin:0
}
.top{
position:relative;
height:58px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:800;
color:#555
}
.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:62px;
background:rgba(255,255,255,.97);
display:flex;
border-top:1px solid var(--border);
z-index:1000
}
.nav button,
.nav a{
flex:1;
border:0;
background:none;
color:#999;
font-weight:700;
font-size:16px
}
.nav a{
display:flex;
align-items:center;
justify-content:center;
text-decoration:none
}
.nav button.active{
color:var(--main);
background:transparent;
box-shadow:inset 0 3px 0 var(--main)
}
.nav button.isRefreshing{opacity:.55}
.page{
width:100%;
max-width:1700px;
height:calc(100dvh - 120px);
margin:auto;
padding:14px
}
.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap
}
input,select{
border:1px solid #ddd;
background:#fff;
color:var(--text);
border-radius:9px;
padding:9px 11px;
outline:none
}
input:focus,select:focus{
border-color:#aaa
}
select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background-image:none!important;
field-sizing:content;
width:auto;
text-align:center;
text-align-last:center;
padding-left:10px;
padding-right:10px
}
.btn{
border:0;
border-radius:9px;
padding:9px 14px;
background:var(--main);
color:#fff;
font-weight:700
}
.btn.light{
background:#e9e9e9;
color:#666
}
.btn.green{
background:var(--green)
}
.btn.red{
background:var(--red)
}
.mobileShortcut{
display:none
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
box-shadow:0 2px 9px rgba(0,0,0,.035);
overflow:hidden
}
.cardHead{
min-height:46px;
padding:11px 15px;
background:#f8f8f8;
border-bottom:1px solid var(--border);
font-weight:700;
display:flex;
justify-content:space-between;
align-items:center
}
.empty,.loading{
text-align:center;
padding:30px;
color:#aaa
}
.total{
font-size:25px;
font-weight:800
}
.tag{
display:inline-block;
padding:4px 8px;
border-radius:6px;
background:#eee;
color:#666;
font-size:12px;
font-weight:700
}
.tag.green{
background:#e0e9dd;
color:#62745d
}
.tag.red{
background:#f2dddd;
color:#9a625d
}
.tag.blue{
background:#e1e9ed;
color:#627983
}
.check{
width:17px;
height:17px;
accent-color:var(--main)
}
.customerLink,
.groupLink{
border:0;
background:none;
padding:0;
color:#A68C73;
font-weight:400;
text-decoration:none;
text-align:left
}
.customerLink{
font-size:13px
}
.groupLink{
font-size:14px
}
.tableWrap{
width:100%;
overflow:auto
}
table{
border-collapse:collapse;
width:100%;
table-layout:fixed
}
th,td{
padding:8px 7px;
border-bottom:1px solid #eee;
text-align:left;
vertical-align:middle;
word-break:break-word;
overflow-wrap:anywhere
}
th{
background:#f5f5f5;
color:#777;
font-weight:700
}
tr:hover td{
background:#fafafa
}
/* 店面 */
.storePage{
height:100%;
display:grid;
grid-template-columns:minmax(0,1.5fr) minmax(320px,.75fr);
grid-template-rows:auto minmax(0,1fr);
gap:12px
}
.storeManual{
grid-column:1;
grid-row:1
}
.storeMain{
min-height:0;
display:flex;
flex-direction:column;
grid-column:1;
grid-row:2
}
.storeCheckout{
min-height:0;
display:flex;
flex-direction:column;
grid-column:2;
grid-row:1/3
}
.storeMainBody{
padding:12px;
min-height:0;
display:flex;
flex-direction:column
}
.storeSearch{
display:flex;
gap:6px;
flex-shrink:0
}
.storeSearch input{
flex:1;
min-width:0
}
.cart{
flex:1;
min-height:0;
overflow-y:auto;
margin-top:8px;
padding-right:3px
}
.cartItem{
display:flex;
align-items:center;
gap:10px;
padding:9px 2px;
border-bottom:1px solid #eee
}
.cartName{
flex:1;
min-width:0
}
.cartSub{
color:#999;
font-size:12px;
margin-top:3px
}
.qty{
display:flex;
align-items:center;
gap:5px;
flex-shrink:0
}
.qty button{
width:28px;
height:28px;
border:0;
border-radius:6px;
background:#eee;
color:#666
}
.cartItem .removeCartButton{
background:#E78790!important;
color:#fff!important
}
.manualBox{
display:grid;
grid-template-columns:1fr 130px auto;
gap:8px;
padding:10px
}
.checkoutBody{
padding:14px;
min-height:0;
overflow:auto
}
.salesperson{
display:flex;
gap:7px
}
.salesperson button{
flex:1;
border:1px solid #ddd;
background:#fff;
color:#777;
border-radius:8px;
padding:8px
}
.salesperson button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.payment{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px
}
.payment button{
border:1px solid #ddd;
background:#fff;
color:#666;
border-radius:8px;
padding:8px 4px
}
.payment button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.checkoutTotalRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
min-height:32px
}
.checkoutTotalRow .total{min-width:0}
.changeText{
margin-top:0;
text-align:right;
white-space:nowrap;
font-size:16px;
font-weight:700
}
.checkoutActions{
margin-top:12px;
display:grid;
grid-template-columns:4fr 1fr;
gap:7px
}
.checkoutActions .btn.green,
.checkoutActions .acButton{width:100%;height:44px}
.acButton{
display:block;
background:#E78790!important
}
.checkoutQuick{
display:flex;
gap:7px;
align-items:stretch
}
.checkoutQuick input{min-width:0;flex:1}
.checkoutQuick input{text-align:left}
.manualBox input[data-money-input]{text-align:center}
.checkoutQuick .salesperson{flex:1;min-width:0}
.storeAddIcon{display:none}
/* 線上 */
.onlinePage{
height:100%;
display:flex;
flex-direction:column;
gap:10px
}
.onlineToolbar{
flex-shrink:0;
display:flex;
gap:8px
}
.onlineToolbar input,
.onlineToolbar select,
.onlineToolbar button{height:44px}
.onlineToolbar input{
flex:1;
min-width:0
}
.onlineResult{
min-height:0;
flex:1;
overflow:auto
}
.onlineTable{
min-width:900px
}
.onlineTable th:nth-child(1){width:5%}
.onlineTable th:nth-child(2){width:12%}
.onlineTable th:nth-child(3){width:9%}
.onlineTable th:nth-child(4){width:9%}
.onlineTable th:nth-child(5){width:20%}
.onlineTable th:nth-child(6){width:20%}
.onlineTable th:nth-child(7){width:8%}
.onlineTable th:nth-child(8){width:8%}
.onlineTable th:nth-child(9){width:8%}
.onlineTable th:nth-child(10){width:8%}
.groupSummary{
font-size:16px;
font-weight:400
}
.customerNameTitle{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;border:0;padding:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.customerMessageButton{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;background:transparent;padding:2px 4px;font-size:16px;cursor:pointer;line-height:1.2}
.customerMessageButton:disabled{opacity:.5;cursor:wait}
.customerNameEditIcon{display:block;width:1em;height:1em;object-fit:contain;align-self:center;flex:0 0 1em}
.faceOrderHead{background:var(--green);color:#fff}
.faceOrderSection{margin:12px 0}
.faceOrderHead.faceStockHead{background:#D9C0FA}
.faceOrderHead.facePreorderHead{background:#FDD365}
.faceOrderHead.faceCargoHead{background:#9BB4A8}
.faceOrderHead.faceRestockHead{background:#7E88A0}
.groupCards{
padding:12px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
align-items:stretch
}
.orderCards,.onlineResult .orderCards{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.groupCard{
height:240px;
min-width:0;
border:1px solid var(--border);
border-radius:12px;
background:#fff;
overflow:hidden;
display:flex;
flex-direction:column;
position:relative
}
.groupCardCustomer{
padding:10px 13px;
background:#f7f7f7;
border-bottom:1px solid #eee;
flex-shrink:0;
font-size:14px;
display:flex;
justify-content:flex-start;
gap:8px;
align-items:center
}
.groupCardCustomer .groupCardTotal{margin-left:auto}
.groupCardItems{
flex:1;
min-height:0;
overflow-y:auto;
padding:3px 13px
}
.groupCardItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:7px 0;
border-bottom:1px solid #f0f0f0;
font-size:13px
}
.groupCardItem.opened{background:#f1f1f1}
.groupCardItem .check{flex-shrink:0}
.groupCardItem:last-child{
border-bottom:0
}
.groupCardItemName{
flex:1;
min-width:0;
word-break:break-word
}
.groupCardItemDeposit{color:#e53935}
.groupCardItemPrice{
white-space:nowrap
}
.groupCardNote{padding:7px 0;color:#8b8077;font-size:12px;line-height:1.4;word-break:break-word}
.orderAddButton{position:static;z-index:2;width:18px;height:18px;flex:0 0 18px;border:0;border-radius:50%;padding:0;background:var(--main);color:#fff;font-size:16px;line-height:17px;font-weight:400}
.orderAddButton:hover{filter:brightness(.94)}
.orderItemDate{white-space:nowrap}
.groupCardBottom{
padding:9px 13px;
border-top:1px solid #eee;
display:flex;
justify-content:space-between;
gap:10px;
font-size:12px;
color:#888;
flex-shrink:0
}
.groupCardBottom strong{
color:#555;
font-size:13px
}
.groupCardMeta{
padding:7px 13px;
border-top:1px solid #eee;
display:flex;
flex-wrap:nowrap;
white-space:nowrap;
justify-content:flex-start;
align-items:center;
gap:8px;
font-size:12px;
color:#777;
flex-shrink:0
}
.groupCardMeta>*{flex-shrink:0}
.groupCardMeta{container-type:inline-size;container-name:orderMeta}
.orderDeposit{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.orderDepositLabel{white-space:nowrap}
.orderAddRemittance{border:0;background:#eee;color:#666;border-radius:7px;padding:3px 6px;font:inherit;cursor:pointer;white-space:nowrap}
.remittanceFormRows{display:grid;gap:12px}.remittanceFirstRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.remittanceFormRows input,.remittanceFormRows select{display:block;width:100%;min-width:0;box-sizing:border-box}
.orderDepositInput::placeholder{color:transparent}
@container orderMeta (max-width:520px){
.orderDeposit.hasDepositInput .orderDepositLabel{display:none}
.orderDeposit.hasDepositInput .orderDepositInput::placeholder{color:#999;opacity:1}
}
.groupCardMeta>*:first-child{margin-right:auto}
.orderMetaDate.isHidden+*{margin-left:auto}
.orderMetaDate.isHidden{display:none}
.reconcileButton{padding:4px 9px;font-size:12px;white-space:nowrap}
.reconcileButton.isDone{background:#FFBCD5;color:#fff}
.groupCardMeta input{
width:66px;
flex:0 0 66px;
padding:4px 6px;
border-radius:6px;
font-size:12px;
text-align:center
}
.orderLast5{white-space:nowrap}
.orderLast5 input:disabled{background:#f2f2f2;color:#aaa}
.groupCardTotal{white-space:nowrap;color:#555;font-size:13px}
.faceToFaceTag,.faceToggle{
border:1px dashed #CBC3BC;
border-radius:5px;
padding:2px 5px;
font-size:10px;
background:transparent;
color:#CBC3BC
}
.faceToFaceTag.active,.faceToggle.active{
background:var(--green);
color:#fff;
border-color:var(--green)
}
.orderPayment{
width:62px;
flex:0 0 62px;
padding:4px 3px;
border-radius:6px;
font-size:12px
}
.onlineIconButton{
width:42px;
min-width:42px;
padding:0;
background-repeat:no-repeat!important;
background-position:center!important;
background-size:50%!important;
color:transparent!important
}
.onlineSearchButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922205838_23cab617.png')!important}
.onlineRefreshButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922204703_5dd34c41.png')!important}
.onlineAddButton{width:42px;min-width:42px;padding:0;font-size:24px}
.cargoTag{
width:18px;
height:18px;
padding:0!important;
border-radius:4px!important;
font-size:11px!important;
line-height:18px;
text-align:center;
color:#fff!important;
flex-shrink:0;cursor:pointer;border:0;width:auto;min-width:18px;padding:0 3px!important;font-size:10px!important
}
/* 出貨 */
.shipPage{
height:100%;
overflow:auto
}
.shipItem{
padding:10px 15px;
border-top:1px solid #eee;
display:flex;
gap:12px;
align-items:center
}
.shipCardHead{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.shipCardHead strong{margin-right:auto}
.shipCopyActions{display:inline-flex;gap:4px;flex-shrink:0}
.shipCopyActions .shipCopyButton{padding:3px 6px;font-size:12px;line-height:1.2;border-radius:5px;min-width:26px}
.shipPacked,.shipPacked .cardHead,.shipPacked .shipItem,.shipPacked .shipCardTotals{
background:#ededed
}
.shipPacked .shipProductName,.shipPacked .shipProductPrice,.shipPacked .shipCardTotals strong{color:#999}
.shipCompleteButton,.shipDeleteButton{padding:4px 10px;font-size:12px}
.shipCompleteButton[aria-pressed="true"]{background:#b9b9b9}
.shipOrderDate{width:48px;flex-shrink:0;color:#777}
.shipProductName{flex:1;min-width:0}
.shipProductPrice{white-space:nowrap}
.shipCardTotals{
display:flex;
gap:12px;
align-items:center;
justify-content:flex-end;
padding:10px 15px;
border-top:1px solid #eee;
font-size:13px;
flex-wrap:wrap
}
.shipCardTotals strong{color:#E24C60;font-size:15px}
.shipOrderCard{position:relative}
.shipDeleteButton{background:#E24C60;color:#fff}
.shipSwipeDelete{display:none}
@media(max-width:850px){
.shipCardTotals .shipDeleteButton{display:none}
.shipOrderCard.showShipDelete{padding-right:76px}
.shipOrderCard.showShipDelete>.shipSwipeDelete{display:block;position:absolute;right:0;top:0;bottom:0;width:70px;border:0;border-radius:0;background:#E24C60;color:#fff;font-weight:bold}
}
.shipSummary{
margin-bottom:10px
}
.shipSelected{
padding:12px
}
.shipSelectedRow{
display:flex;
justify-content:space-between;
gap:10px;
padding:7px 0;
border-bottom:1px solid #eee
}
.shipSelectedName{
flex:1;
min-width:0
}
.shipSelectedPrice{
white-space:nowrap
}
.shipTotalBox{
padding:12px;
background:#fafafa;
border-top:1px solid #eee
}
.shipTotalLine{
display:flex;
justify-content:space-between;
padding:3px 0
}
.shipBalance{
font-size:20px;
font-weight:800;
margin-top:5px
}
.topActions{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
display:flex;
align-items:center;
gap:6px
}
.topActions .btn{
height:26px;
min-height:0;
padding:2px 9px;
font-size:13px;
line-height:20px;
border-radius:6px
}
.topHomeButton,.topFaceButton,.topRefreshButton,.topStoreToggle,.topDetailsButton{display:none}
.topHomeButton{background:#E78790!important;color:#fff!important}
.topFaceButton{background:var(--green)!important;color:#fff!important}
body[data-page="store"] .topStoreToggle{display:block}
body[data-page="online"] .topHomeButton,body[data-page="online"] .topFaceButton,body[data-page="online"] .topDetailsButton{display:inline-flex;align-items:center}
.topDetailsButton{background:#8b8077!important;color:#fff!important}
body[data-page="ship"] .topRefreshButton{display:block}
.topActions .topRefreshButton{
width:26px;
min-width:26px;
padding:0;
background-size:75%!important
}
.storeSalesPage{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.storeSalesToolbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.storeSalesToolbar input{flex:1;min-width:0}
.storeSalesToolbar button{height:38px;flex-shrink:0}
.storeSalesToolbar>strong{margin-right:auto}
.storeSalesMonthSummary{flex-shrink:0;min-height:20px;color:#777;font-size:13px;font-weight:700;padding:0 3px}
.storeSalesMonthSummary[hidden]{display:none}
.storeSalesWarning{flex-shrink:0;text-align:center}
.storeSalesWarning .salesHint{margin:6px 0 0;text-align:center}
#storeSalesResult{flex:1;min-height:0;overflow:auto}
.salesDayCard{margin-bottom:12px}
.salesDayCard summary{cursor:pointer;padding:12px;list-style:none}
.salesDayCard summary::-webkit-details-marker{display:none}
.salesDayHeading{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.salesDayTotals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.salesDayTotals>span{padding:0 10px;text-align:center;border-right:1px solid #ddd;font-size:13px}
.salesDayTotals>span:first-child{padding-left:0}
.salesDayTotals>span:last-child{border:0;padding-right:0}
.salesDayTotals b{display:block;font-size:18px;margin-top:4px}
.salesHint{font-size:12px;color:#888;margin:6px 0 10px}
.salesDetailRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #eee}
.salesTime{font-size:12px;color:#999;flex:0 0 38px;width:38px;white-space:nowrap;font-variant-numeric:tabular-nums}
.salesProduct{flex:1;min-width:0;overflow-wrap:anywhere}
.salesProduct small{display:block;color:#999;font-size:12px;margin-top:4px}
.salesHiddenFields{display:block;color:#999;font-size:10px;line-height:1.3;margin-top:2px;font-weight:400}
.salesDayCard{margin-bottom:0}
.salesCards{padding:0}
.salesCount{margin-left:auto;color:#999;font-size:12px}
.salesPurchase{border-bottom:1px solid #eee;padding:5px 0}
.salesPurchase:last-child{border-bottom:0}
.salesPurchaseMeta{display:flex;gap:8px;color:#999;font-size:11px;padding:2px 0}
.salesPurchaseMeta>span:last-child{margin-left:auto}
.salesDetailRow{padding:5px 0;border:0;font-size:13px;min-height:30px}
.salesFooter{display:block;padding:8px 10px}
.salesFooter .salesDayTotals{width:100%;font-size:11px}
.salesFooter .salesDayTotals>span{font-size:11px;padding:0 5px}
.salesFooter .salesDayTotals b{font-size:14px}
.salesCash{color:#F8C043!important}
.salesFooter .salesHint{margin:5px 0 0}
#storeSalesResult{display:block;min-height:0;overflow:auto}
#storeSalesResult>.salesHint{flex-shrink:0}

function jiwuClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  // Convert each measurement separately so slash-separated sizes keep their pairing.
  return text.replace(/(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?(?:\s*[×xX、,]\s*(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?)*/gi, block => block.replace(/着丈/g,'長').replace(/身幅|身巾/g,'寬').replace(/肩幅/g,'肩').replace(/袖丈/g,'袖').replace(/cm|公分|[×xX、,:：\s]/gi,''));
}
function jiwuExtractClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  const rows = [...text.matchAll(/(?:^|[\s【\[(])((?:XX|X)?[SML]|\dXL)(?:サイズ)?[\s】\]):：]*(着丈\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm))?(?:\s*[×xX、,]?\s*(?:身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*cm)?)+)/g)];
  return rows.length ? rows.map(r=>r[1]).join('/')+'/'+rows.map(r=>jiwuClothingSize(r[2]).replace(/\s+/g,'')).join('/') : '';
}

function launchCardSize(value){
 const text=jiwuClothingSize(value),parts=text.split(/[／/]/).map(part=>part.trim());
 const sizes=[];
 for(const part of parts){
  if(!/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|FREE|F)$/i.test(part))break;
  sizes.push(part.toUpperCase());
 }
 // Only shorten presentation; never replace the product's stored size.
 return sizes.length? sizes.join('/') : text;
}

async function launchPost(action,params){

 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:authToken,...params}),signal:controller.signal});const d=await r.json();if(d.ok===false){if(d.error==='登入已失效，請重新登入')showLogin();throw new Error(d.error);}return d;}
 catch(e){if(e.name==='AbortError')throw new Error('連線逾時，請重新載入確認是否已儲存，再重試');throw e;}finally{clearTimeout(timer);}
}
async function launchFillFromInventory(){

 await launchRun(async()=>{
  const data=await launchPost('launchFillFromInventory',{items:JSON.stringify(launchCurrent.items.map(item=>({id:item.id,code:item.code})))});
  const matches=new Map((data.matches||[]).map(item=>[String(item.id),item]));
  if(!matches.size){launchNotice('商品庫存沒有找到相同貨號');return;}
  launchPushUndo();let changed=0;
  launchCurrent.items.forEach(item=>{const found=matches.get(String(item.id));if(!found)return;if(found.price!==''&&item.price!==found.price){item.price=found.price;changed++;}if(found.size!==''&&item.size!==found.size){item.size=found.size;changed++;}});
  if(changed)launchMark();
  launchNotice(`已用貨號帶入 ${matches.size} 項庫存商品的售價／尺寸${changed?'，請按 SAVE 儲存':''}`);
 });
}

async function launchLoadGroup(id,ticket=++launchLoad){
 const cached=readBackendSnapshot('launchGroup_'+id);
 if(cached&&document.body.dataset.page==='launch'){launchCurrent=cached;launchStatus=cached.status;launchRenderEditor();}

 try{const detail=await api('launchGet',{id});if(ticket!==launchLoad||document.body.dataset.page!=='launch'||launchDirty||launchPendingSaves)return;launchCurrent=detail.group;saveBackendSnapshot('launchGroup_'+id,detail.group);launchPanelIndex=0;launchUndoStack=[];launchStatus=launchCurrent.status;sessionStorage.setItem(LAUNCH_STATUS_KEY,launchStatus);launchRenderEditor();}catch(e){if(cached){launchCompletionToast('目前顯示上次資料，連線恢復後可重新整理',true);return;}if(ticket===launchLoad&&document.body.dataset.page==='launch')document.getElementById('app').innerHTML=`<div class="launchPage"><p>${esc(e.message)}</p><button class="btn" onclick="renderLaunch()">重試</button></div>`;}
}

function launchGroupTitle(name,canvas=true){
 let text=String(name||'').trim();
 if(/^\d{4}\s*收單\s*⛔(?:️)?/.test(text))text=text.replace(/^(\d{4})\s*收單\s*⛔(?:️)?\s*/,'$1收單⛔️ ');
 else text=text.replace(/^(\d{4})(?!\s)/,'$1 ');
 return canvas?text.replace(/⛔(?:️)?/g,''):text;
}

function launchBannerSettings(panel){return {zoom:Math.max(1,Math.min(3,Number(panel?.imageScale)||1)),x:Math.max(0,Math.min(100,Number(panel?.imageX)===Number(panel?.imageX)?Number(panel.imageX):50)),y:Math.max(0,Math.min(100,Number(panel?.imageY)===Number(panel?.imageY)?Number(panel.imageY):50))};}

const launchSubmittedSignatures=new Map(),launchSavedRevisions=new Map(),launchFailedSaves=new Map();
function launchSaveSignature(group){return JSON.stringify({...group,revision:undefined});}
function launchHasUnsentChanges(){return launchDirty&&(!launchCurrent||launchSubmittedSignatures.get(launchCurrent.id)!==launchSaveSignature(launchCurrent));}
function launchCompletionToast(text,error=false){
 let toast=document.getElementById('launchCompletionToast');
 if(!toast){toast=document.createElement('div');toast.id='launchCompletionToast';toast.setAttribute('role','status');document.body.appendChild(toast);}
 toast.textContent=text;toast.classList.toggle('isError',error);toast.hidden=false;
 clearTimeout(launchToastTimer);launchToastTimer=setTimeout(()=>toast.hidden=true,error?5000:2000);
}
function launchSaveClick(){
 if(!launchCurrent?.name.trim()){launchCompletionToast('請輸入團名',true);return;}
 const snapshot=structuredClone(launchCurrent),id=snapshot.id;
 const signature=launchSaveSignature;
 const savedSignature=signature(snapshot);
 launchSubmittedSignatures.set(id,savedSignature);
 if(!launchPendingSaves||!launchSavedRevisions.has(id))launchSavedRevisions.set(id,snapshot.revision);
 const before=launchUndoStack.at(-1)?.group,parts=[];
 if(before){
  for(const [key,label] of [['items','商品資料'],['panels','首圖／卡片排版'],['ads','廣告'],['name','團名'],['canvasTitle','畫布標題'],['footer','底部文字'],['shipDate','出荷日期'],['domesticShipping','境內運']])if(JSON.stringify(before[key])!==JSON.stringify(snapshot[key]))parts.push(label);
 }
 const completed=parts.length?parts.join('、'):'畫布修改';
 launchPendingSaves++;
 launchSaveTail=launchSaveTail.then(async()=>{
  snapshot.revision=launchSavedRevisions.get(id);
  const d=await launchPost('launchSave',{group:snapshot});
  launchSavedRevisions.set(id,d.group.revision);launchFailedSaves.delete(id);
  saveBackendSnapshot('launchGroup_'+id,d.group);launchClearListCache();
  if(launchCurrent?.id===id){
   launchCurrent.revision=d.group.revision;
   if(signature(launchCurrent)===savedSignature){launchDirty=false;const b=document.getElementById('launchSave');if(b)b.textContent='SAVE';document.querySelectorAll('[data-launch-save]').forEach(x=>x.textContent='SAVE');}
  }
  launchCompletionToast('已完成：'+completed);
 }).catch(error=>{launchFailedSaves.set(id,snapshot);launchSubmittedSignatures.delete(id);if(launchCurrent?.id===id)launchDirty=true;launchCompletionToast('儲存失敗：'+error.message+'，修改仍保留，請重新儲存',true);}).finally(()=>launchPendingSaves--);
 return launchSaveTail;
}

function launchDialog(content){
 document.getElementById('launchDialog')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<dialog id="launchDialog" class="launchDialog">${content}</dialog>`);
 const dialog=document.getElementById('launchDialog');
 dialog.addEventListener('click',event=>{
   if(event.target!==dialog)return;
   const box=dialog.getBoundingClientRect();
   const outside=event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom;
   if(!outside)return;
   // 點遮罩與按 SAVE 一樣：表單會先跑原有驗證，再由各視窗自己的儲存流程關閉。
   const form=dialog.querySelector('form');
   if(form){form.requestSubmit();return;}
   const allProductsSave=dialog.querySelector('[onclick="launchAllSave()"]');
   if(allProductsSave){allProductsSave.click();return;}
   dialog.close();
 });
 dialog.showModal();
}

async function launchBannerColors(dataUrl){return await new Promise(resolve=>{const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas'),side=80;canvas.width=side;canvas.height=side;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,side,side);const bins=new Map();for(let y=0;y<side;y+=4)for(let x=0;x<side;x+=4){const p=ctx.getImageData(x,y,1,1).data;if(p[3]<200||Math.max(p[0],p[1],p[2])-Math.min(p[0],p[1],p[2])<24)continue;const q=[p[0],p[1],p[2]].map(v=>Math.min(255,Math.round(v/32)*32));const key=q.map(v=>v.toString(16).padStart(2,'0')).join('');bins.set(key,(bins.get(key)||0)+1);}const colors=[...bins.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([key])=>'#'+key);resolve([...new Set(colors)].slice(0,5));}catch(_){resolve([]);}};image.onerror=()=>resolve([]);image.src=dataUrl;});}

function launchApplyCustomColor(input){

const hex=raw.length===3?[...raw].map(c=>c+c).join(''):raw;
launchSetMainColor('#'+hex.toUpperCase());
}

function purchaseDateParts(date){const m=String(date||'').trim().match(/^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})/);return m?{year:Number(m[1])||Number(new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'Asia/Taipei'}).format(new Date())),month:Number(m[2]),day:Number(m[3])}:null;}
function purchaseDateLabel(date){const d=purchaseDateParts(date);return d?`${d.month}/${d.day}`:String(date||'');}
function purchaseDateSortKey(date){const d=purchaseDateParts(date);return d?d.year*10000+d.month*100+d.day:0;}

function parsePurchaseText(text){
 text=String(text||'').normalize('NFKC');
 const number=(text.match(/(?:ご注文番号|注文番号|注文ID|オーダー番号|Order\s*(?:number|no\.?|#)|訂單編號)\s*[:：#]?\s*([A-Za-z0-9][A-Za-z0-9_-]*)/)||[])[1]||'';
 const d=text.match(/(?:ご注文日|注文日|訂購日期)\s*[:：]\s*(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})/);
 const date=d?`${d[1]}-${d[2].padStart(2,'0')}-${d[3].padStart(2,'0')}`:'';
 const items=[];let last=0;const re=/(\d{8,14})\s+[¥￥]\s*([\d,]+)\s+(\d+)\s+[¥￥]\s*([\d,]+)/g;let m;
 while((m=re.exec(text))){const prefix=text.slice(last,m.index).trim().split(/\r?\n/).filter(x=>x.trim());const originalName=(prefix.pop()||'').trim();items.push({code:m[1],originalName,name:'',quantity:Number(m[3]),price:Number(m[2].replace(/,/g,'')),total:Number(m[4].replace(/,/g,'')),candidates:[],choice:''});last=re.lastIndex;}
 if(!items.length)throw new Error('沒有辨識到商品，請貼上包含商品コード、金額、数量與合計金額的訂單');
 return {number,date,items};
}

function purchaseChoose(i,value){const x=purchaseDraft.items[i];x.choice=value;const c=value===''?{}:x.candidates[Number(value)];Object.assign(x,{name:'',source:'',group:'',role:'',url:'',image:''},c);}
function purchaseDailyTotals(orders){
 const days=new Map();
 orders.forEach(order=>{
  if(!days.has(order.date))days.set(order.date,{date:order.date,numbers:new Set(),products:new Map()});
  const day=days.get(order.date);day.numbers.add(order.number);
  (order.items||[]).forEach(item=>{
   const code=String(item.code||'').normalize('NFKC').replace(/\s+/g,'');
   // 無貨號的舊資料逐項保留，避免把不同商品合在一起。
   const key=code||Symbol();
   if(!day.products.has(key))day.products.set(key,{code,names:new Set(),quantity:0,total:0,image:'',numbers:new Set()});
   const product=day.products.get(key);product.names.add(purchaseProductName(item));if(!product.image&&/^https?:\/\//i.test(item.image||''))product.image=item.image;
   product.quantity+=Number(item.quantity)||0;product.total+=Number(item.total)||0;product.numbers.add(order.number);
  });
 });
 return [...days.values()].sort((a,b)=>purchaseDateSortKey(a.date)-purchaseDateSortKey(b.date)).map(day=>({date:day.date,orderCount:day.numbers.size,items:[...day.products.values()].map(x=>({...x,names:[...x.names],numbers:[...x.numbers]}))}));
}

async function purchaseLoadImages(){
 const ticket=++purchaseImageTicket;
 const items=purchaseFilteredOrders().filter(o=>o.date===purchaseSelectedDate).flatMap(o=>o.items),codes=[...new Set(items.map(x=>x.code).filter(Boolean))];
 try{for(let start=0;start<codes.length;start+=100){const response=await api('purchaseMatch',{codes:JSON.stringify(codes.slice(start,start+100))});if(ticket!==purchaseImageTicket)return;
  items.forEach(item=>{const candidates=response.matches?.[item.code];if(!candidates)return;for(const source of ['最新開團','商品庫存','已收單']){let rows=candidates.filter(c=>c.source===source&&/^https?:\/\//i.test(c.image||''));const exact=rows.filter(c=>(item.url&&c.url===item.url)||(item.group&&c.group===item.group&&c.role===(item.role||'')));if(exact.length)rows=exact;const images=[...new Set(rows.map(c=>c.image.trim()))];if(images.length===1){item.image=images[0];break;}}});
 }
 if(ticket===purchaseImageTicket&&document.body.dataset.page==='purchase'){
  // 只更新統計圖片，不重建輸入欄、卡片或編輯視窗。
  document.querySelectorAll('.purchaseProductCard[data-code]').forEach(card=>{const item=items.find(x=>x.code===card.dataset.code&&x.image);if(!item)return;let img=card.querySelector('img');if(!img){img=document.createElement('img');img.loading='lazy';img.alt=purchaseProductName(item);card.prepend(img);}img.hidden=false;img.src=item.image;const placeholder=card.querySelector('.purchaseNoImage');if(placeholder)placeholder.hidden=true;img.onerror=()=>{img.hidden=true;if(placeholder)placeholder.hidden=false;};});
 }
 }catch(_){/* 訂單已顯示；圖片失敗保留原圖，下次重新載入可重試。 */}
}

async function loadStoreCart(){
if(!salesperson){
storeCart=[];
renderCart();

}
if(storeCartLoading||cartPendingWrites||cartUnsaved||cartOperationBusy)return;
const requestUser=salesperson;
const requestRevision=cartRevision;
storeCartLoading=true;

const d=await api(
'storeCart',
{salesperson:requestUser}
);

}

}finally{
storeCartLoading=false;

}
}

async function saveStoreCart(){
if(!salesperson)return;
const user=salesperson;

const items=JSON.stringify(storeCart.map(x=>({code:x.code||'',name:x.name||'',price:Number(x.price||0),qty:Number(x.qty||1),manual:!!x.manual,note:x.note||''})));

const request=cartWriteQueue.then(()=>api('storeCartSet',{salesperson:user,items}));

}catch(e){

function inventoryHeaderIndex(names){
if(names.includes('庫存'))names=[...names,'庫存量','商品庫存'];

const keys=names.map(x=>String(x).normalize('NFKC').replace(/[\s_　-]/g,'').toLowerCase());
return inventoryHeaders.findIndex(h=>keys.includes(String(h||'').normalize('NFKC').replace(/[\s_　-]/g,'').toLowerCase()));
}
function inventoryValue(item,names,preferDisplay=true){
const i=inventoryHeaderIndex(names);if(i<0)return '';
const display=item.display&&item.display[i];
return preferDisplay&&display!==''&&display!=null?display:(item.values?item.values[i]:'');
}
function inventoryImageUrl(item){
if(item.image&&/^https?:\/\//i.test(String(item.image)))return String(item.image);
const i=inventoryHeaderIndex(['圖片','商品圖片','圖片網址','圖片連結','商品圖','照片','photo','image','img']);
let value=i>=0?String(item.display?.[i]||item.values?.[i]||'').trim():'';

if(!value){const match=formula.match(/(?:IMAGE|HYPERLINK)\s*\(\s*["']([^"']+)/i);if(match)value=match[1];}
if(/^https?:\/\//i.test(value))return value;
return '';
}

function inventoryCellState(item,names){const value=String(inventoryValue(item,names,false)??'').trim().toLowerCase();if(value==='x')return 'x';const n=Number(value.replace(/,/g,''));return Number.isFinite(n)?n:null;}

function resizeInventoryCards(){
const grid=document.getElementById('inventoryGrid');
if(!grid)return;
const width=grid.clientWidth;
if(!width)return;
const styles=getComputedStyle(grid);
const gap=Number.parseFloat(styles.columnGap)||0;
const mobile=matchMedia('(max-width:850px)').matches;
const columns=mobile?4:Math.max(1,Math.floor((width+gap)/(112+gap)));
const cardWidth=(width-gap*(columns-1))/columns;
grid.style.setProperty('--inventory-card-height',Math.max(1,Math.round(cardWidth/.65))+'px');
}

function inventoryTouchStart(event){if(event.target.closest('button,a,input'))return;const t=event.touches[0];inventoryTouchX=t.clientX;inventoryTouchY=t.clientY;inventoryTouchTimer=setTimeout(()=>{inventoryTouchActive=true;inventoryDraggedRow=Number(event.currentTarget.dataset.row);event.currentTarget.classList.add('dragging');navigator.vibrate?.(30);},450);}
function inventoryTouchMove(event){const t=event.touches[0];if(!inventoryTouchActive&&Math.hypot(t.clientX-inventoryTouchX,t.clientY-inventoryTouchY)>10){clearTimeout(inventoryTouchTimer);return;}if(!inventoryTouchActive)return;event.preventDefault();const card=document.elementFromPoint(t.clientX,t.clientY)?.closest('.inventoryCard');if(card)markInventoryInsert(card,inventoryInsertSide(card,t.clientY));}
function inventoryTouchEnd(event){clearTimeout(inventoryTouchTimer);if(!inventoryTouchActive)return;const t=event.changedTouches[0],card=document.elementFromPoint(t.clientX,t.clientY)?.closest('.inventoryCard'),target=Number(card?.dataset.row||0),side=card?.dataset.insertSide||'after',source=inventoryDraggedRow;inventoryTouchActive=false;inventoryDragEnd();if(source&&target&&source!==target)reorderInventoryRows(source,target,side);}
function reorderInventoryRows(source,target,side='after'){const from=inventoryRows.findIndex(item=>Number(item.row)===Number(source));if(from<0||source===target)return;const [moved]=inventoryRows.splice(from,1);const targetIndex=inventoryRows.findIndex(item=>Number(item.row)===Number(target));if(targetIndex<0){inventoryRows.splice(from,0,moved);return;}const insertIndex=targetIndex+(side==='after'?1:0);inventoryRows.splice(insertIndex,0,moved);if(insertIndex===from)return;inventoryPendingMoves.push([Number(source),Number(target),side==='before'?'b':'a']);inventoryOrderDirty=true;const button=document.getElementById('inventorySaveOrderButton');if(button)button.classList.add('isVisible');renderInventoryContent();}
async function saveInventoryOrder(){if(inventoryProductSaves.size)await Promise.allSettled([...inventoryProductSaves.values()]);if(!inventoryOrderDirty||!inventoryPendingMoves.length)return;const button=document.getElementById('inventorySaveOrderButton');if(button){button.disabled=true;button.textContent='儲存中…';}const moves=inventoryPendingMoves.map(([source,target,side])=>source.toString(36)+'_'+target.toString(36)+'_'+side).join(',');const rowSlots=inventoryRows.map(item=>Number(item.row)).filter(row=>Number.isInteger(row)&&row>=2).sort((a,b)=>a-b);try{await api('reorderInventory',{moves});inventoryRows.forEach((item,index)=>{if(rowSlots[index])item.row=rowSlots[index];});inventoryOrderDirty=false;inventoryPendingMoves=[];inventoryLoadedAt=Date.now();prepareInventoryRows();saveInventorySessionCache();renderInventoryContent();const current=document.getElementById('inventorySaveOrderButton');if(current){current.classList.remove('isVisible');current.disabled=false;current.textContent='儲存排序';}}catch(e){alert('排序儲存失敗：'+e.message);if(button){button.disabled=false;button.textContent='儲存排序';}}}

function toHalfWidthDigits(value){return String(value==null?'':value).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));}
function normalizeMoneyInput(input){
if(!input)return '';
const start=input.selectionStart;
const before=input.value;
const value=toHalfWidthDigits(before).replace(/[．。]/g,'.').replace(/[－−]/g,'-');
if(value!==before){input.value=value;if(start!=null)input.setSelectionRange(start+(value.length-before.length),start+(value.length-before.length));}
return value;
}

async function updateSalesAfterCheckout(delta){
// 先用結帳 API 已回傳的新增列即時更新畫面，避免再等全表查詢。
storeSalesLoadedAt=0;
if(delta&&delta.items&&delta.items.length){
if(storeSalesData){
let day=storeSalesData.days.find(item=>item.date===delta.date);
if(!day){day={date:delta.date,total:0,cash:0,transfer:0,other:0,items:[]};storeSalesData.days.push(day);}
const known=new Set(day.items.map(item=>item.row));
delta.items.forEach(item=>{if(known.has(item.row))return;day.items.push(item);const pickup=['面交','自取'].includes(String(item.name||'').trim());if(!pickup)day.total+=item.amount;if(pickup||item.payment==='💰'||item.payment==='現金')day.cash+=item.amount;else if(/^(中信|LB|LP|IPASS|轉帳|匯款)/i.test(item.payment||''))day.transfer+=item.amount;else day.other+=item.amount;});
if(document.body.dataset.page==='store'&&(isDesktopStore()||storeView==='sales'))drawStoreSales();
}else if(document.body.dataset.page==='store'&&(isDesktopStore()||storeView==='sales')){
renderStoreSales(true);
}
}

function formatStoreSalesDate(date){
const match=String(date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(!match)return String(date||'');
const weekday=['日','一','二','三','四','五','六'][new Date(Number(match[1]),Number(match[2])-1,Number(match[3])).getDay()];
return match[2]+'/'+match[3]+'('+weekday+')';
}
function drawStoreSales(target=null){

const isDateQuery=/^(\d{2}|\d{4})$/.test(searchText);
const query=isDateQuery?searchText:'';
const nameQuery=isDateQuery?'':searchText.normalize('NFKC').toLowerCase();
const year=storeSalesData.today.slice(0,4);
let days=[...(storeSalesData.days||[])].sort((a,b)=>a.date.localeCompare(b.date));
// Count each recorded work date once, before applying date or product filters.
const workDayAnchor='2026-09-25';
const workDates=[...new Set((storeSalesData.days||[]).filter(day=>day.items?.length).map(day=>day.date).concat(workDayAnchor))].sort();
const anchorIndex=workDates.indexOf(workDayAnchor);
const workDayNumbers=new Map(workDates.map((date,index)=>[date,130+index-anchorIndex]));
if(query){
if(!/^(\d{2}|\d{4})$/.test(query)){if(summary)summary.hidden=true;result.innerHTML='<div class="empty">輸入兩碼月份或四碼日期，例如 09、0911</div>';return;}
const month=Number(query.slice(0,2));
const day=query.length===4?Number(query.slice(2)):0;
const lastDay=new Date(Number(year),month,0).getDate();
if(month<1||month>12||(query.length===4&&(day<1||day>lastDay))){if(summary)summary.hidden=true;result.innerHTML='<div class="empty">請輸入有效的月份或日期</div>';return;}
days=days.filter(d=>d.date.startsWith(year+'-')&&(query.length===2?d.date.slice(5,7)===query:d.date.slice(5).replace('-','')===query));
if(!days.length&&query.length===4)days=[{date:year+'-'+query.slice(0,2)+'-'+query.slice(2),total:0,cash:0,transfer:0,other:0,items:[]}];
}
if(nameQuery)days=days.filter(day=>day.items.some(item=>String(item.name||'').normalize('NFKC').toLowerCase().includes(nameQuery)));
const deploymentWarning=storeSalesData.schema==='store-sales-v2'?'':'<p class="salesHint">目前後端尚未提供合併付款分組，請更新 Code.gs 並將網頁應用程式部署為新版本，再重新整理。</p>';
const warning=storeSalesData.undated?`<p class="salesHint">${storeSalesData.undated} 筆資料缺少可辨識的日期，未列入統計。</p>`:'';
if(summary){
if(query.length===2){summary.textContent=query+'月營業額 $'+money(days.reduce((sum,item)=>sum+Number(item.total||0),0));summary.hidden=false;}
else if(!query){summary.textContent=year+'年總營業額 $'+money(days.reduce((sum,item)=>sum+Number(item.total||0),0));summary.hidden=false;}
else{summary.textContent='';summary.hidden=true;}
}
if(warningBox)warningBox.innerHTML=deploymentWarning+warning;
result.innerHTML=(days.length?'<div class="groupCards salesCards '+(query.length===4?'salesSingle':'salesMulti')+'">'+days.map(day=>{
const orders=new Map();
const visibleItems=day.items.filter(item=>!nameQuery||String(item.name||'').normalize('NFKC').toLowerCase().includes(nameQuery));
visibleItems.sort((a,b)=>a.time.localeCompare(b.time)||a.row-b.row).forEach(item=>{
const key=item.orderId||'row-'+item.row;
if(!orders.has(key))orders.set(key,[]);
orders.get(key).push(item);
});
return `<div class="groupCard salesDayCard" data-sales-date="${esc(day.date)}">
<div class="groupCardCustomer"><strong>${esc(formatStoreSalesDate(day.date))}</strong><button type="button" class="rainToggle" data-rain-date="${esc(day.date)}" aria-label="切換${esc(day.date)}下雨標記" aria-pressed="${isRainyDay(day.date)}" onclick="toggleRainDay('${esc(day.date)}')">⛆</button>${day.items.length&&workDayNumbers.has(day.date)?`<span class="storeWorkDay">Day${workDayNumbers.get(day.date)}</span>`:''}${day.other?`<span class="salesOther">其他／未填：$${money(day.other)}（已含於總金額）</span>`:''}<span class="salesCount">${visibleItems.length} 筆商品</span></div>
<div class="groupCardItems salesDayItems">${orders.size?[...orders.values()].map(renderSalesPurchase).join(''):`<div class="empty">${nameQuery?'沒有符合商品名稱的銷售紀錄':'當日尚無銷售紀錄'}</div>`}</div>
<div class="groupCardMeta salesFooter"><div class="salesDayTotals"><span>總金額 <b>$${money(day.total)}</b></span><span>現金 <b class="salesCash">$${money(day.cash)}</b></span><span>轉帳 <b>$${money(day.transfer)}</b></span></div></div>
</div>`;
}).join('')+'</div>':'<div class="empty">沒有符合的銷售紀錄</div>');
}

function quantityOffer(item){
const price=Math.round(Number(item.price||0)*100),qty=Math.max(0,Math.floor(Number(item.qty)||0));
const size=Number(item.offerQty),offer=Math.round(Number(item.offerTotal)*100);
const enabled=!item.manual&&Number.isInteger(size)&&size>=2&&item.offerTotal!==''&&item.offerTotal!=null&&Number.isFinite(offer)&&offer>=0&&offer<price*size;
// Missing offerTotal must never enter arithmetic (0 * NaN is still NaN).
if(!enabled)return {total:qty*price/100,groups:0,size:0,offer:0,saving:0};
const groups=Math.floor(qty/size),remainder=qty-groups*size;
return {total:(groups*offer+remainder*price)/100,groups,size:enabled?size:0,offer:offer/100,saving:(qty*price-groups*offer-remainder*price)/100};
}

 note:x.note||''

),

);

);

['received','last5','storeNote','barcode'].forEach(id=>{const input=document.getElementById(id);if(input)input.value='';});

function allocateOrderEditDeposit(items,originalDeposits,originalFirstRow){
const amount=value=>String(value??'').replace(/,/g,'').split(/\r?\n/).reduce((sum,line)=>sum+(Number(line.trim())||0),0);
const first=items.find(item=>Number(item.row)===Number(originalFirstRow));
if(items.length<2||!first||first.deposit==null||String(first.deposit).trim()===''||amount(first.deposit)===amount(originalDeposits[0]))return;
const originalTotal=originalDeposits.reduce((sum,value)=>sum+amount(value),0);
const remaining=Math.round((originalTotal-items.reduce((sum,item)=>sum+amount(item.deposit),0))*100)/100;
if(remaining<=0)return;
const empty=items.find(item=>item!==first&&item.deposit!=null&&String(item.deposit).trim()==='');
if(!empty)throw new Error('剩餘訂金 $'+remaining+' 需要一個訂金空白的商品列');
empty.deposit=String(remaining);
}

function applyOnlineEditJob(source,job){
const keys=new Set(job.keys);
if(job.delete)return source.filter(row=>!keys.has(row.editKey));
const kept=new Map(job.items.map(item=>[item.key,item]));
const template=source.find(row=>keys.has(row.editKey));if(!template)return source;
const header=names=>findHeader(onlineHeaders,names);
const nh=header(['名稱','商品名稱','品名','商品']),ph=header(['售價','價格']),sh=header(['運費']),dh=header(['訂金']),bh=header(['備註','備註欄']);
const face=String(template.data[bh]||'').split('｜').some(v=>v.trim()==='面交');
const note=job.note.split('｜').map(v=>v.trim()).filter(v=>v&&v!=='面交').join('｜');
const fullNote=face?(note?note+'｜面交':'面交'):note;
const update=(row,item)=>{if(nh)row.data[nh]=item.name;if(ph)row.data[ph]=item.price;if(sh)row.data[sh]=item.shipping;if(dh&&item.deposit!==undefined)row.data[dh]=item.deposit;if(bh)row.data[bh]=fullNote;return row;};
const lastKey=source.filter(row=>keys.has(row.editKey)).at(-1)?.editKey;
const additions=job.items.filter(item=>!keys.has(item.key)).map(item=>update({...structuredClone(template),row:-(++onlineEditKey),editKey:item.key},item));
const out=[];source.forEach(row=>{if(keys.has(row.editKey)){const item=kept.get(row.editKey);if(item)out.push(update(structuredClone(row),item));if(row.editKey===lastKey)out.push(...additions);}else out.push(row);});return out;
}
function renderPendingOnlineEdits(){

refreshCargoViewKeepingScroll();
}
let onlineEditWorkerRunning=false;
async function processOnlineEditQueue(){
if(onlineEditWorkerRunning)return;onlineEditWorkerRunning=true;
try{while(onlineEditQueue.length){
const job=onlineEditQueue[0];
try{
const selected=onlineEditBase.filter(row=>job.keys.includes(row.editKey));
if(selected.length!==job.keys.length)throw new Error('原訂單商品已變動');
const rows=selected.map(row=>Number(row.row));
const items=job.items.map(item=>({...item,row:onlineEditBase.find(row=>row.editKey===item.key)?.row||0}));
const result=await launchPost(job.delete?'deleteOnlineOrder':'editOnlineOrder',{rows:JSON.stringify(rows),...(job.delete?{}:{items:JSON.stringify(items),note:job.note})});
const server=result.online||await api('online',{compact:'0',fresh:'1'});
const last=Math.max(...rows),added=items.filter(item=>!item.row),kept=new Set(items.filter(item=>item.row).map(item=>Number(item.row)));
const removed=rows.filter(row=>!kept.has(row)).sort((a,b)=>a-b);
const newPosition=row=>row+(row>last?added.length:0)-removed.filter(deleted=>deleted<row).length;
const keyByRow=new Map(onlineEditBase.filter(row=>!removed.includes(Number(row.row))).map(row=>[newPosition(Number(row.row)),row.editKey]));
added.forEach((item,i)=>keyByRow.set(last+1+i-removed.length,item.key));
onlineHeaders=server.headers;onlineEditBase=server.rows.map(row=>({...row,editKey:keyByRow.get(Number(row.row))||'edit-'+(++onlineEditKey)}));
}catch(e){alert((job.delete?'訂單刪除失敗':'訂單儲存失敗')+'，這筆畫面已還原：'+e.message);}
onlineEditQueue.shift();onlineMutationRevision++;renderPendingOnlineEdits();
}}
finally{onlineEditWorkerRunning=false;onlineOrderEditPending=false;onlineRows=onlineEditBase||onlineRows;onlineLoadedAt=Date.now();saveOnlineSessionCache();}
}

async function loadOnline(force=false,background=false){
try{
// 手動重新整理等待既有請求結束，確保舊回應不會蓋掉新資料。
if(onlineLoadPromise){
  if(force){
    try{await onlineLoadPromise;}catch(_){}
    return loadOnline(true,background);
  }
  await onlineLoadPromise;
  return;
}
if(!force&&onlineLoadedAt&&Date.now()-onlineLoadedAt<ONLINE_CACHE_MS){
  return;
}
const request=(async()=>{
  const revision=onlineMutationRevision;
  const d=await api('online',{compact:'1',fresh:force?'1':'0'});
  if(revision!==onlineMutationRevision||pendingRestockRows.size||onlineOrderEditPending)return;
  const headers=d.headers||[];
  const rows=d.format==='online-matrix-v1'
    ?(d.rows||[]).map((r,i)=>({row:r[0],data:Object.fromEntries(headers.map((h,i)=>[h,r[i+1]])),orderMergeKey:(d.mergeKeys||[])[i]||'',depositMergeKey:(d.mergeKeys||[])[i]||''}))
    :(d.rows||[]);
  onlineRows=rows;
  onlineHeaders=headers;
  onlineLoadedAt=Date.now();
  saveOnlineSessionCache();
  if(document.getElementById('onlineResult')){
    applyOnlineFilter();
  }
})();
onlineLoadPromise=request;
try{await request;}finally{
  if(onlineLoadPromise===request)onlineLoadPromise=null;
}
}catch(e){
const res=document.getElementById('onlineResult');
if(res&&!background){
  if(!onlineLoadedAt){
    res.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }else{
    alert('更新失敗，目前保留上次資料：'+e.message);
  }
}
}
}

function bindOnlineSearchInput(input){
let composing=false,timer=null,pasting=false;
const cancel=()=>{clearTimeout(timer);timer=null;};
const schedule=delay=>{
cancel();
if(composing)return;
timer=setTimeout(()=>{timer=null;if(input.isConnected&&!composing)searchOnline();},delay);
};
input.addEventListener('compositionstart',()=>{composing=true;cancel();});
input.addEventListener('compositionend',()=>{composing=false;schedule(250);});
input.addEventListener('paste',()=>{pasting=true;schedule(0);});
input.addEventListener('input',event=>{
if(composing||event.isComposing){cancel();return;}
const pasted=pasting||event.inputType==='insertFromPaste';pasting=false;
schedule(pasted?0:250);
});
input.addEventListener('keydown',event=>{
if(event.key==='Enter'&&!composing&&!event.isComposing&&event.keyCode!==229){event.preventDefault();cancel();searchOnline();}
});
}

function faceToFaceOrderSection(order){
const categories=order.items.map(row=>{

const category=cargoCategory(cargo);
if(category==='補貨登記')return '補貨登記';
if(category==='受注'||/^\d{1,2}月$/.test(cargo))return '受注';
if(category==='預訂'||category==='已訂購'||isOrderPurchased(row))return '預訂';
return '現貨';
});
// 面交訂單只要含現貨，整筆訂單就放在現貨區。
if(categories.includes('現貨'))return '現貨';
if(categories.includes('補貨登記'))return '補貨登記';

return '現貨';
}
function isOrderPurchased(row){

}

function cargoCategory(cargo){
cargo=String(cargo||'').trim();
if(
cargo==='補貨登記'||
cargo==='SOLD OUT'||
cargo==='S☹LD OUT'||
cargo==='補登'||/^補登\d+$/.test(cargo)
)return '補貨登記';

function cargoDisplay(row){
const raw=String(getOnlineData(row,['貨況'])||'').trim();
const status=getOrderStatus(row);
const statusRaw=getOnlineData(row,['狀態','訂購狀態','已訂購','購買','訂購']);
const category=cargoCategory(raw);
if(isOpenedRow(row))return {text:'完',color:'#555',opened:true};
if(status==='未訂購'||statusRaw===false)return {text:'未',color:'#E78790'};
if(status==='已訂購'||isTruthy(status))return {text:'訂',color:'#FBB550'};
if(category==='預訂'){
return isTruthy(status)||status==='已訂購'
?{text:'訂',color:'#FBB550'}
:{text:'未',color:'#E78790'}
}
if(/^\d{1,2}月$/.test(raw)){
return {text:raw.replace('月','').padStart(2,'0'),color:'#85C2D0'}
}
if(category==='補貨登記')return {text:raw.match(/^補登(\d+)$/)?'補'+raw.match(/^補登(\d+)$/)[1]:'補',color:'#7E88A0'};
if(category==='現貨')return {text:'現',color:'#DABBD8'};
return {text:raw,color:'#8ca7b2'}
}

try{

pendingRestockRows.delete(rowNumber);onlineMutationRevision++;checkbox.disabled=false;

try{

try{await navigator.clipboard.writeText(text);showShipCopyNotice('已複製');return;}catch(_){}
}
const ta=document.createElement('textarea');
ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();
let copied=false;
try{copied=document.execCommand('copy');}finally{ta.remove();}

showShipCopyNotice('已複製');

Object.entries(draft).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value;});
const codeBox=document.getElementById('last5Box');
if(codeBox)codeBox.style.display=['中信','LB'].includes(payment)?'block':'none';
document.querySelectorAll('.payment button').forEach(button=>button.classList.toggle('active',button.textContent===payment));
calcChange();
});
/* =========================================================
   啟動
========================================================= */
let backendPreloadRunning=false;
async function preloadBackendPages(){
 if(backendPreloadRunning||!authToken||!navigator.onLine)return;
 backendPreloadRunning=true;
 const tasks=[()=>loadOnline(false,true),()=>loadInventory(false),
  async()=>{const revision=shipRevision,data=await api('ship');if(revision!==shipRevision||shipPendingWrites)return;shipDataCache=data;shipLoadedAt=Date.now();saveBackendSnapshot('ship',data);if(document.body.dataset.page==='ship')drawShip(data);},
  async()=>{const data=await api('storeSales');saveBackendSnapshot('storeSales',data);if(!storeSalesData){storeSalesData=data;storeSalesLoadedAt=Date.now();}},
  ...launchStates.map(status=>async()=>{const data=await api('launchList',{status});launchSaveListCache(status,data.groups||[]);}),
  async()=>{const data=await api('launchAuxSheet',{kind:'group-work'});saveBackendSnapshot('launchAux_group-work',data);}];
 let next=0;
 const worker=async()=>{while(next<tasks.length&&authToken){const task=tasks[next++];try{await task();}catch(_){}}};
 try{await Promise.all([worker(),worker()]);}finally{backendPreloadRunning=false;}
}
window.addEventListener('online',()=>{preloadBackendPages();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&appStarted)preloadBackendPages();});
function startApp(){
if(appStarted)return;
appStarted=true;
document.body.classList.add('isAuthenticated');
detectSalesperson();
const savedTab=sessionStorage.getItem('jiwu_current_tab')||'launch';
const targetBtn=document.getElementById('btn-'+savedTab)||document.getElementById('btn-store');
tab(savedTab,targetBtn);
setTimeout(preloadBackendPages,0);
}
function showLogin(){
authToken='';
appStarted=false;
sessionStorage.removeItem(AUTH_TOKEN_KEY);
localStorage.removeItem(AUTH_PERSISTENT_TOKEN_KEY);
document.body.classList.remove('isAuthenticated');
const input=document.getElementById('loginPassword');
const error=document.getElementById('loginError');
if(error)error.textContent='登入已失效，請重新登入';
if(input)setTimeout(()=>input.focus(),0);
}
function warmAuth(){
if(authToken||authWarmupPromise)return authWarmupPromise;
authWarmupPromise=api('authWarmup').catch(()=>null).finally(()=>{authWarmupPromise=null;});
return authWarmupPromise;
}
async function login(event){
event.preventDefault();
const input=document.getElementById('loginPassword');
const error=document.getElementById('loginError');
const remember=document.getElementById('loginRemember')?.checked===true;
input.disabled=true;
error.textContent='驗證中…';
try{
const result=await api('authLogin',{password:input.value,trusted:remember});
authToken=result.token;
if(remember){localStorage.setItem(AUTH_PERSISTENT_TOKEN_KEY,authToken);sessionStorage.removeItem(AUTH_TOKEN_KEY);}else{sessionStorage.setItem(AUTH_TOKEN_KEY,authToken);localStorage.removeItem(AUTH_PERSISTENT_TOKEN_KEY);}
input.value='';
error.textContent='';
startApp();
}catch(e){
authToken='';
sessionStorage.removeItem(AUTH_TOKEN_KEY);
localStorage.removeItem(AUTH_PERSISTENT_TOKEN_KEY);
error.textContent=e.message==='密碼錯誤'?'密碼錯誤，請重新輸入':e.message;
input.select();
}finally{input.disabled=false;input.focus();}
}
async function restoreLogin(){
if(!authToken)return;
try{
await api('authCheck');
startApp();
}catch(_){
authToken='';
sessionStorage.removeItem(AUTH_TOKEN_KEY);
localStorage.removeItem(AUTH_PERSISTENT_TOKEN_KEY);
}
}
if(!authToken)setTimeout(warmAuth,0);
restoreLogin();
</script>
