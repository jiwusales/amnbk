function jiwuClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  // Convert each measurement separately so slash-separated sizes keep their pairing.
  return text.replace(/(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?(?:\s*[×xX、,]\s*(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?)*/gi, block => block.replace(/着丈/g,'長').replace(/身幅|身巾/g,'寬').replace(/肩幅/g,'肩').replace(/袖丈/g,'袖').replace(/cm|公分|[×xX、,:：\s]/gi,''));
}
function jiwuExtractClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  const rows = [...text.matchAll(/(?:^|[\s【\[(])((?:XX|X)?[SML]|\dXL)(?:サイズ)?[\s】\]):：]*(着丈\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm))?(?:\s*[×xX、,]?\s*(?:身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*cm)?)+)/g)];
  return rows.length ? rows.map(r=>r[1]).join('/')+'/'+rows.map(r=>jiwuClothingSize(r[2]).replace(/\s+/g,'')).join('/') : '';
}

// Returns complete physical groups only; [] means ambiguous/nonphysical text.
// Axis-internal spaces are not option separators (H400 × W390 × D180 is one group).
// Convert only explicit physical units; unitless numbers remain unchanged.
function jiwuSizeToMillimeters(value){
 // Stored unitless physical measurements use millimeters. Large items use centimeters.
 function normalize(value){
 const original=String(value??''),text=original.normalize('NFKC').trim().replace(/(?:厘米|公分)/g,'cm').replace(/(?:毫米|公厘)/g,'mm').replace(/\(\s*(cm|mm)\s*\)/gi,'$1').replace(/^(?:約|约)\s*/,''),number='\\d+(?:\\.\\d+)?';
 if(!/(?:cm|mm)/i.test(text))return original;
 const mm=(n,unit)=>String(Number((Number(n)*(unit.toLowerCase()==='cm'?10:1)).toFixed(3)));
 const diameter=text.match(new RegExp('^(?:直径|直徑|ø|φ)\\s*(?:約\\s*)?('+number+')\\s*(cm|mm)$','i'));
 if(diameter)return 'ø'+mm(diameter[1],diameter[2]);
 const groups=jiwuPhysicalSizeGroups(text);if(groups.length>1)return groups.map(group=>jiwuSizeToMillimeters(group)).join(' ');
 const token='[HWD]?\\s*'+number+'\\s*(?:cm|mm)?';
 if(new RegExp('^'+token+'(?:\\s*[x×]\\s*'+token+'){1,2}$','i').test(text)){
  const units=[...text.matchAll(/cm|mm/gi)];if(!units.length)return original;const fallback=units[units.length-1][0];
  return text.split(/[x×]/i).map(part=>{const match=part.match(new RegExp('^[HWD]?\\s*('+number+')\\s*(cm|mm)?$','i'));return mm(match[1],match[2]||fallback);}).join('x');
 }
 const scalar=text.match(new RegExp('^([HWD]?)\\s*('+number+')\\s*(cm|mm)$','i'));
 return scalar?scalar[1]+mm(scalar[2],scalar[3]):original;
}
 const result=normalize(value),text=String(result??'').trim();
 const physical=text.match(/^([HWDø]?)(\d+(?:\.\d+)?(?:x\d+(?:\.\d+)?){0,2})$/i);
 if(!physical)return result;
 const dimensions=physical[2].split(/x/i).map(Number);
 if(!dimensions.some(n=>n>=1000))return result;
 return physical[1]+dimensions.map(n=>String(Number((n/10).toFixed(4)))).join('x')+'公分';
}
function jiwuPhysicalSizeGroups(sizeValue) {
  const text=String(sizeValue??'').normalize('NFKC').trim();if(!text)return [];
  const axes='(?:長|寬|肩|袖|高|深|厚|着丈|身幅|身巾|肩幅|袖丈)',amount='\\d+(?:\\.\\d+)?',unit='(?:cm|mm|公分)?';
  const axisToken=new RegExp('('+axes+')\\s*[:：]?\\s*'+amount+'\\s*'+unit,'gi');
  const xBody='(?:[HWD]?\\s*'+amount+'\\s*'+unit+'\\s*[x×]\\s*){1,2}[HWD]?\\s*'+amount+'\\s*'+unit;
  const singleX=new RegExp('^'+xBody+'$','i'),singleScalar=new RegExp('^'+amount+'\\s*(?:cm|mm|公分)$','i');
  const one=value=>singleX.test(value)||singleScalar.test(value);
  if(text.includes('/')){const parts=text.split('/').map(value=>value.trim());if(parts.every(Boolean)){const groups=parts.flatMap(value=>jiwuPhysicalSizeGroups(value));if(groups.length===parts.length)return groups;}return [];}
  if(one(text))return [text];
  const tokens=[...text.matchAll(axisToken)];
  if(tokens.length&&tokens.map(token=>token[0]).join('').replace(/\s+/g,'')===text.replace(/\s+/g,'')){
    const first=tokens[0][1],groups=[],seen=new Set();let current='';
    for(const token of tokens){const axis=token[1];if(axis===first&&current){groups.push(current);current='';seen.clear();}if(seen.has(axis))return [];seen.add(axis);current+=token[0].replace(/\s+/g,'');}
    if(current)groups.push(current);return groups;
  }
  const groupPattern=new RegExp('^(?:'+xBody+'|'+amount+'\\s*(?:cm|mm|公分))(?=$|\\s)','i');
  const groups=[];let rest=text;
  while(rest){const match=rest.match(groupPattern);if(!match)return [];groups.push(match[0].trim());rest=rest.slice(match[0].length).trim();}
  return groups;
}

// Shared conservative projection; never changes name/role/SKU/ID/price.
// inferFormat=false permits a client explicitly sending format:'' to clear it.
function jiwuSplitProductSpec(sizeValue, formatValue, inferFormat = true) {
  const normalizeFormat=value=>String(value??'').normalize('NFKC').trim().replace(/\bBOX\s+([1-9]\d*(?:入|款)?)(?=$|[\s/])/gi,'BOX$1').replace(/(單抽|单抽|抱盒)\s+([1-9]\d*(?:入|款))(?=$|[\s/])/g,'$1$2').replace(/[\s/]+/g,' ').trim();
  const originalSize=String(sizeValue??'').trim(),explicitFormat=normalizeFormat(formatValue);
  const normalized=originalSize.normalize('NFKC'),parts=normalized.split('/').map(value=>value.trim()),optionParts=normalizeFormat(originalSize).split(' ');
  const clothing=value=>/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|F|FREE|SML)$/i.test(value);
  const option=value=>clothing(value)||/^(?:(?:單抽|单抽|抱盒)(?:\s*[1-9]\d*(?:入|款))?|BOX(?:\s*[1-9]\d*(?:入|款)?)?|針式|针式|夾式|夹式|針|针|夾|夹)$/i.test(value);
  if(optionParts.length&&optionParts.every(value=>value&&option(value))){
    return {format:explicitFormat||(inferFormat?optionParts.join(' '):''),size:''};
  }
  let labels=0;while(labels<parts.length&&clothing(parts[labels]))labels++;
  const measures=jiwuPhysicalSizeGroups(parts.slice(labels).join('/'));
  if(labels>0&&measures.length===labels){
    return {format:explicitFormat||(inferFormat?parts.slice(0,labels).join(' '):''),size:measures.join(' ')};
  }
  const physicalGroups=jiwuPhysicalSizeGroups(originalSize);
  return {format:explicitFormat,size:physicalGroups.length?physicalGroups.join(' '):originalSize};
}

function launchProductSpec(item){const spec=jiwuSplitProductSpec(item?.size,item?.format),compact=jiwuCompactProductSize(spec.size,item||{}),groups=jiwuPhysicalSizeGroups(spec.size);return {format:spec.format,size:compact!==null?compact:groups.length>1?groups.map(jiwuClothingSize).join(' '):jiwuClothingSize(spec.size)};}

 // Only physical measurements belong to the size line.
 return parts.filter(part=>/\d/.test(part)&&(/(?:[HWDΦφø直徑長寬高厚深縦横丈幅巾肩袖]|\d\s*[×xX*]\s*\d|\d\s*(?:cm|mm|公分|毫米|公厘))/i.test(part)||/^(?:[AB](?:10|[0-9])|\d+(?:\.\d+)?)$/i.test(part))).join('/');
}

async function launchFillFromInventory(){
 if(!launchCurrent)return;
 await launchRun(async()=>{
  const data=await launchPost('launchFillFromInventory',{items:JSON.stringify(launchCurrent.items.map(item=>({id:item.id,code:item.code})))});
  const matches=new Map((data.matches||[]).map(item=>[String(item.id),item]));
  if(!matches.size){launchNotice('商品庫存沒有找到相同貨號');return;}
  launchPushUndo();let changed=0;
  launchCurrent.items.forEach(item=>{const found=matches.get(String(item.id));if(!found)return;if(found.price!==''&&item.price!==found.price){item.price=found.price;changed++;}if(found.format!=null&&found.format!==''&&item.format!==found.format){item.format=found.format;changed++;}if(found.size!==''&&item.size!==found.size){item.size=found.size;changed++;}});
  if(changed)launchMark();
  launchNotice(`已用貨號帶入 ${matches.size} 項庫存商品的售價／尺寸${changed?'，請按 SAVE 儲存':''}`);
 });
}

}

 let matches=products.filter(product=>ids.includes(String(product.id||'')));

 if(!matches.length)matches=products.filter(product=>launchSummaryProductNames(product).some(name=>normalize(name)===normalize(item.name)));

}

 };

  const queued=inventoryObserveQueuedWrites(),saved=await Promise.allSettled([...inventoryProductSaves.values()]),finished=await queued;
  if(publishSnapshot.length&&[...saved,...finished].some(result=>result.status==='rejected'))throw new Error('商品資料尚未儲存完成，請確認後再上架');
  const moves=inventoryResolvedPendingMoves().map(([source,target,side])=>source.toString(36)+'_'+target.toString(36)+'_'+side).join(',');
  const publishIds=JSON.stringify(publishSnapshot);
  if(inventoryOrderSaveRequest?.moves!==moves||inventoryOrderSaveRequest?.publishIds!==publishIds)inventoryOrderSaveRequest=backendPrepareWrite('reorderInventory',{moves,publishIds,requestId:crypto.randomUUID()});
  saveInventorySessionCache();
  const result=await api('reorderInventory',inventoryOrderSaveRequest);
  if(result.orderMode!=='rank'||!Array.isArray(result.orderIds))throw new Error('排序回應不完整，請重新載入確認儲存結果');
  if(publishSnapshot.length&&(!Array.isArray(result.publishedIds)||!Array.isArray(result.pendingPublishIds)))throw new Error('上架回應不完整，請重新載入確認儲存結果');
  const positions=new Map(result.orderIds.map((id,index)=>[String(id),index]));
  inventoryRows.sort((a,b)=>(positions.get(String(a.itemId))??Infinity)-(positions.get(String(b.itemId))??Infinity));
  if(Array.isArray(result.pendingPublishIds))inventorySetPendingPublish(result.pendingPublishIds);
  inventoryRetainUnpublishedDraftOrder();inventoryOrderSaveRequest=null;inventoryLoadedAt=Date.now();if(!inventoryOrderDirty)inventoryClearSortDraft();
  prepareInventoryRows();saveInventorySessionCache();renderInventoryContent();
  const known=new Set(inventoryRows.map(item=>String(item.itemId??'')));
  if(publishSnapshot.length||inventoryPendingPublishIds.some(id=>!known.has(id)))await loadInventory(true,true);
 }catch(e){alert(jiwuErrorText(e,'system'));}
 finally{inventoryOrderSaving=false;const current=document.getElementById('inventorySaveOrderButton');if(current)current.disabled=false;inventoryRefreshOrderSaveButton();}
}

function formatStoreSalesDate(date){

}

function quantityOffer(item){
const price=Math.round(Number(item.price||0)*100),qty=Math.max(0,Math.floor(Number(item.qty)||0));
const size=Number(item.offerQty),offer=Math.round(Number(item.offerTotal)*100);
const enabled=!item.manual&&Number.isInteger(size)&&size>=2&&item.offerTotal!==''&&item.offerTotal!=null&&Number.isFinite(offer)&&offer>=0&&offer<price*size;
// Missing offerTotal must never enter arithmetic (0 * NaN is still NaN).
if(!enabled)return {total:qty*price/100,groups:0,size:0,offer:0,saving:0};
const groups=Math.floor(qty/size),remainder=qty-groups*size;
return {total:(groups*offer+remainder*price)/100,groups,size:enabled?size:0,offer:offer/100,saving:(qty*price-groups*offer-remainder*price)/100};
}
function cartQuantityOffers(items){
 const pools=new Map();
 const results=items.map(item=>{const offer=quantityOffer(item),qty=Math.max(0,Math.floor(Number(item.qty)||0));
  if(!offer.size)return {...offer,offset:0,pooledQty:qty};
  const key=JSON.stringify([Math.round(Number(item.price)*100),offer.size,Math.round(offer.offer*100)]);
  if(!pools.has(key))pools.set(key,{qty:0,entries:[],item});
  const pool=pools.get(key),result={...offer,offset:pool.qty,pooledQty:0};pool.entries.push({result,qty});pool.qty+=qty;return result;
 });
 pools.forEach(pool=>{const offer=quantityOffer({...pool.item,qty:pool.qty}),price=Math.round(Number(pool.item.price)*100),cents=Math.round(offer.offer*100),base=Math.floor(cents/offer.size),extra=cents%offer.size,discounted=offer.groups*offer.size;
  const prefix=n=>{const d=Math.min(n,discounted);return Math.floor(d/offer.size)*cents+(d%offer.size)*base+Math.min(d%offer.size,extra)+(n-d)*price;};
  pool.entries.forEach(({result,qty})=>{const total=prefix(result.offset+qty)-prefix(result.offset);Object.assign(result,{total:total/100,saving:(qty*price-total)/100,groups:offer.groups,pooledQty:pool.qty});});
 });return results;
}
function cartOfferTotal(items){return cartQuantityOffers(items).reduce((sum,offer)=>sum+Math.round(offer.total*100),0)/100;}

function manualOnlineSuggest(input,event){
 const row=input.closest('.manualOnlineItem');if(!row)return;
 // Safari may update the committed text after compositionend.
 if(event?.type==='compositionend'){setTimeout(()=>{if(input.isConnected&&document.activeElement===input)manualOnlineSuggest(input,{type:'compositioncommit'});},0);return;}
 const query=input.value.trim(),group=(row.querySelector('.manualOnlineGroup')?.value||'').trim(),mode=input.classList.contains('manualOnlineGroup')?'group':'product',key=JSON.stringify([mode,query,group]);
 // Search the current Chinese text during composition without resetting an identical lookup.
 if(event?.isComposing&&row._suggestInput===input&&row._suggestKey===key)return;
 row._suggestInput=input;row._suggestKey=key;
 clearTimeout(row._suggestTimer);row._suggestTicket=(row._suggestTicket||0)+1;
 let box=row.querySelector('.manualOnlineProductSuggestions');if(!box){box=document.createElement('div');box.className='manualOnlineProductSuggestions';row.appendChild(box);}
 box.replaceChildren();box.hidden=true;
 const editing=row.classList.contains('orderEditItem'),price=row.querySelector(editing?'.orderEditPrice':'.manualOnlinePrice');
 if(!editing&&event?.type==='input'&&price.dataset.suggested!==undefined){if(price.value===price.dataset.suggested){price.value='';updateManualOnlineTotal();}delete price.dataset.suggested;}
 if(!query)return;
 const ticket=row._suggestTicket;
 row._suggestTimer=setTimeout(async()=>{
  const current=()=>row.isConnected&&ticket===row._suggestTicket&&document.activeElement===input&&input.value.trim()===query&&(row.querySelector('.manualOnlineGroup')?.value||'').trim()===group;
  try{const data=await api('manualOrderSuggestions',{mode,query,group});
   if(!current())return;
   const normalize=value=>String(value??'').normalize('NFKC').trim().toLocaleLowerCase().replace(/\s+/g,' ');
   for(const item of data.suggestions||[]){if(mode==='product'&&group&&normalize(item.group)!==normalize(group))continue;const button=document.createElement('button');button.type='button';button.textContent=mode==='group'?item.group:item.label+' · '+(item.price==null?'售價未填':'$'+money(item.price))+(item.group?'｜'+item.group:'')+'（'+item.source+'）';
    let press=null,picked=false;
    button.addEventListener('pointerdown',e=>{if(e.button!==0)return;press={id:e.pointerId,x:e.clientX,y:e.clientY};e.preventDefault();});
    button.addEventListener('pointercancel',()=>{press=null;});
    button.addEventListener('pointerup',e=>{const start=press;press=null;if(!start||start.id!==e.pointerId||Math.hypot(e.clientX-start.x,e.clientY-start.y)>10)return;e.preventDefault();choose();});
    const choose=()=>{if(picked)return;picked=true;clearTimeout(row._suggestTimer);row._suggestTicket++;box.hidden=true;
     if(mode==='group'){input.value=item.group;row.querySelector(editing?'.orderEditName':'.manualOnlineName').focus();}
     else{row.querySelector(editing?'.orderEditName':'.manualOnlineName').value=item.label;if(item.group&&!editing)row.querySelector('.manualOnlineGroup').value=item.group;
      if(item.price!=null&&(!price.value||(!editing&&price.value===price.dataset.suggested))){price.value=String(item.price);price.dataset.suggested=price.value;updateManualOnlineTotal();}
      price.focus();}
    };button.onclick=choose;box.appendChild(button);
   }box.hidden=!box.childElementCount;
  }catch(error){if(current()){box.textContent='資料暫時逃跑ㄌ，小法師捕捉中請稍等(๑⁼̴̀д⁼̴́๑)';box.hidden=false;}}
 },220);
}

function orderEditDateTime(value,original,clock){
 const text=String(value||'').normalize('NFKC').trim(),match=text.match(/^(\d{1,2})\/(\d{1,2})$/)||text.match(/^(\d{2})(\d{2})$/);
 if(!match)throw Error('日期請輸入月/日，例如 10/18');
 const year=Number(original?.slice(0,4)||new Date(Date.now()+8*3600000).getUTCFullYear()),month=Number(match[1]),day=Number(match[2]);
 const date=new Date(Date.UTC(year,month-1,day));
 if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)throw Error('請輸入有效的月/日');
 let suffix=original?.slice(10)||'T00:00:00';
 if(clock!==undefined){
  const text=String(clock).normalize('NFKC').trim(),time=/^\d{4}$/.test(text)?text.slice(0,2)+':'+text.slice(2):text;
  if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('時間請輸入四位數字（24小時制），例如 0930 或 2036');
  if(time!==original?.slice(11,16))suffix=`T${time}:00`;
 }
 return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}${suffix}`;
}

function allocateOrderEditDeposit(items,originalDeposits,originalFirstRow){
const amount=value=>String(value??'').replace(/,/g,'').split(/\r?\n/).reduce((sum,line)=>sum+(Number(line.trim())||0),0);
const first=items.find(item=>Number(item.row)===Number(originalFirstRow));
if(items.length<2||!first||first.deposit==null||String(first.deposit).trim()===''||amount(first.deposit)===amount(originalDeposits[0]))return;
const originalTotal=originalDeposits.reduce((sum,value)=>sum+amount(value),0);
const remaining=Math.round((originalTotal-items.reduce((sum,item)=>sum+amount(item.deposit),0))*100)/100;
if(remaining<=0)return;
const empty=items.find(item=>item!==first&&item.deposit!=null&&String(item.deposit).trim()==='');
if(!empty)throw new Error('剩餘訂金 $'+remaining+' 需要一個訂金空白的商品列');
empty.deposit=String(remaining);
}

function applyOnlineEditJob(source,job){
const keys=new Set(job.keys);
if(job.delete)return source.filter(row=>!keys.has(row.editKey));

const template=source.find(row=>keys.has(row.editKey));if(!template)return source;
const header=names=>findHeader(onlineHeaders,names);
const gh=header(['團名','團組','團']),nh=header(['名稱','商品名稱','品名','商品']),ph=header(['售價','價格']),sh=header(['運費']),dh=header(['訂金']),bh=header(['備註','備註欄']);
const face=String(template.data[bh]||'').split('｜').some(v=>v.trim()==='面交');
const note=job.note.split('｜').map(v=>v.trim()).filter(v=>v&&v!=='面交').join('｜');
const fullNote=face?(note?note+'｜面交':'面交'):note;
const paymentHeader=header(['付款方式','支付方式','付款','收款方式']),last5Header=header(['後五碼','匯款後五碼']);
const timeHeader=header(['購買時間','時間']);
const update=(row,item)=>{if(job.source!==undefined){const sourceHeader=header(['來源','通路','平台']);if(sourceHeader)row.data[sourceHeader]=job.source;}if(job.mergeOrders)row.data['合併訂單ID']='pending-'+job.progressId;if(job.orderTime!==undefined){row.orderTime=job.orderTime;if(timeHeader)row.data[timeHeader]=job.orderTime;}if(job.payment!==undefined){if(paymentHeader)row.data[paymentHeader]=job.payment;if(last5Header)row.data[last5Header]=['寶中信','中信','國泰'].includes(job.payment)?job.payment+job.last5:['LB','花LB'].includes(job.payment)?job.payment+' '+job.last5:job.payment;}const changed=key=>!Array.isArray(item.changedFields)||item.changedFields.includes(key);if(gh&&item.group!==undefined&&changed('group'))row.data[gh]=item.group;if(nh&&changed('name'))row.data[nh]=item.name;if(ph&&changed('price'))row.data[ph]=item.price;if(sh&&changed('shipping'))row.data[sh]=item.shipping;if(dh&&item.deposit!==undefined&&changed('deposit'))row.data[dh]=item.deposit;if(bh&&job.noteChanged!==false)row.data[bh]=fullNote;return row;};
const lastKey=source.filter(row=>keys.has(row.editKey)).at(-1)?.editKey;
const additions=job.items.filter(item=>!keys.has(item.key)).map(item=>update({...structuredClone(template),row:-(++onlineEditKey),editKey:item.key},item));
const out=[];source.forEach(row=>{if(keys.has(row.editKey)){const item=kept.get(row.editKey);if(item)out.push(update(structuredClone(row),item));if(row.editKey===lastKey)out.push(...additions);}else out.push(row);});return out;
}

const keyByRow=new Map(onlineEditBase.filter(row=>!removed.includes(Number(row.row))).map(row=>[newPosition(Number(row.row)),row.editKey]));
added.forEach((item,i)=>keyByRow.set(last+1+i-removed.length,item.key));

onlineHeaders=server.headers;onlineEditBase=server.rows.map(row=>({...row,editKey:keyById.get(String(row.itemId))||keyByRow.get(Number(row.row))||'edit-'+(++onlineEditKey)}));
if(job.progressId)launchMoveProgress(job.progressId,job.progressName,'完成','',job.delete?'刪除訂單':'儲存訂單');
if(result.stockRestorePending?.length)launchCompletionToast('商品已刪除；'+result.stockRestorePending.map(item=>'庫存「'+item.stockMarker+'」已保留，'+item.quantity+' 件待確認還原（'+item.sku+'）').join('；'),true);
}catch(e){if(job.progressId)launchMoveProgress(job.progressId,job.progressName,'失敗',e.message+'（這筆畫面已還原）',job.delete?'刪除訂單':'儲存訂單');else alert((job.delete?'訂單刪除失敗':'訂單儲存失敗')+'，這筆畫面已還原：'+e.message);}
onlineEditQueue.shift();onlineMutationRevision++;renderPendingOnlineEdits();
}}
finally{onlineEditWorkerRunning=false;onlineOrderEditPending=false;onlineRows=onlineEditBase||onlineRows;onlineLoadedAt=Date.now();saveOnlineSessionCache();}
}

function normalizeManualOrderDate(value){

if(!match)throw new Error('日期請輸入 3/3 或 0303');

return month+'/'+day;
}

function bindOnlineSearchInput(input){

const cancel=()=>{generation++;clearTimeout(timer);timer=null;};
const run=(ticket,refresh=false)=>afterInputPaint(()=>{if(ticket===generation&&input.isConnected&&!composing)searchOnline(refresh);});

function groupOnlineOrders(rows){

rows.forEach((row,index)=>{
 const customer=String(getCustomerName(row)||'').trim();
 const day=onlineOrderDay(onlineRowOrderTime(row));
 const key=String(index);parent.set(key,key);keys.set(row,key);
 if(!customer)return;

 const manual=String(getOnlineData(row,['合併訂單ID'])||'');
 const tokens=[...(manual?[JSON.stringify([customer,'manual',manual])]:[]),...(day?[JSON.stringify([customer,'day',day])]:[]),...(merge?[JSON.stringify([customer,'merge',merge])]:[])];
 tokens.forEach(token=>{if(identities.has(token))parent.set(root(key),root(identities.get(token)));else identities.set(token,key);});
});
const orders=new Map();
rows.forEach(row=>{
 const key=root(keys.get(row));
 if(!orders.has(key))orders.set(key,{customer:String(getCustomerName(row)||'未填姓名').trim(),time:String(getOnlineData(row,['時間','購買時間'])||'').trim(),items:[],depositMergeKey:''});

});
return orders;
}

if(last5.toLowerCase()==='ipass')return 'ipass';
const note=String(getOnlineData(row,['備註','備註欄'])||'').trim();
if(note.includes('面交'))return '面交';
return ''
}
function needsLast5(rows){
return rows.some(row=>{
const method=getPaymentMethod(row).toUpperCase();
return method.includes('中信')||['LB','花LB','國泰'].includes(method)
})
}
function normalizePayment(v){
const value=String(v||'').trim().toLowerCase();
if(value==='現金'||value==='💰')return '現金';
if(value==='國泰')return '國泰';
if(value==='寶中信')return '寶中信';
if(value==='中信')return '中信';
if(value==='花lb')return '花LB';
if(value==='lb')return 'LB';
if(value==='lp')return 'LP';
if(value==='ipass')return 'ipass';
if(value==='面交')return '面交';
return ''
}
function orderCardPaymentText(last5,payment){
 if(payment==='現金')return '💰';
 if(['LP','ipass'].includes(payment))return payment;
 return String(last5||'').split(/\r?\n/).map(value=>value.trim()).filter(value=>value&&!/^(?:LB|寶中信|花LB|中信|國泰)\s*$/i.test(value)).map(value=>value==='現金'?'💰':value).join('\n');
}
function paymentLast5Value(v){
return String(v||'').replace(/^(?:寶中信|花LB|中信|LB|國泰)\s*/i,'').trim()
}
function onlineMonthNumber(v){
const s=String(v||'').trim();
let m=s.match(/^\d{4}[-\/](\d{1,2})[-\/]/);
if(m)return Number(m[1]);
m=s.match(/^(\d{1,2})[-\/](\d{1,2})/);
if(m)return Number(m[1]);
const d=new Date(s);
return Number.isNaN(d.getTime())?0:d.getMonth()+1
}
function onlineSummaryTitle(){
if(isStarredView)return '✱ 標記訂單';
if(isFaceToFaceView)return '要面交';
if(onlineCargo==='現貨')return '待出貨';
if(onlineCargo)return onlineCargo;
if(onlineSearchText)return onlineSearchText;
return '全部'
}
function applyOnlineFilter(){
syncOnlineBackButton();
let rows=[...onlineRows];
if(isStarredView){const included=new Set([...groupOnlineOrders(rows).values()].filter(order=>order.items.some(isStarredOrderRow)).flatMap(order=>order.items));showOrderCards(rows.filter(row=>included.has(row)),'✱ 標記訂單');return;}
if(isFaceToFaceView){showOrderCards(rows.filter(row=>isFaceToFace(row)&&!isOpenedRow(row)),'要面交');return;}
if(onlineSearchText){
const key=onlineSearchText.toLowerCase();
const monthQuery=key.normalize('NFKC').trim();
const chineseMonths=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const monthMatch=monthQuery.match(/^(\d{1,2})\s*月$/);
const chineseMonthMatch=monthQuery.match(/^([一二三四五六七八九十]+)\s*月$/);
const wantedMonth=monthMatch?Number(monthMatch[1]):chineseMonthMatch?chineseMonths.indexOf(chineseMonthMatch[1])+1:0;
const searchDate=/^[0-9０-９\s/.-]+$/.test(key)?toHalfWidthDigits(key).replace(/\D/g,''):'';
const searchDigits=/^(?:(?:寶中信|花LB|中信|LB|國泰)\s*)?[0-9０-９]+$/i.test(onlineSearchText.trim())?toHalfWidthDigits(onlineSearchText).replace(/\D/g,''):'';
rows=rows.filter(x=>{
const customer=
String(
getOnlineData(
x,
[
'顧客名稱',
'客戶名稱',
'客人名稱',
'姓名'
]
)||''
).toLowerCase();
const group=
String(
getOnlineData(
x,
[
'團名',
'團組',
'團'
]
)||''
).toLowerCase();
const productName=String(getOnlineData(x,['名稱','商品名稱','品名','商品'])||'').toLowerCase();
const time=String(
getOnlineData(x,['時間','購買時間'])||''
);
if(wantedMonth){
return onlineMonthNumber(time)===wantedMonth;
}
const dateKey=time.replace(/\D/g,'');
const last5Source=String(getLast5(x)||getPaymentMethod(x)||'');
const last5=toHalfWidthDigits(last5Source).replace(/\D/g,'');
return(
customer.includes(key)||
productName.includes(key)||
group.includes(key)||
onlineSourceMatches(x,key)||
(searchDate.length>=3&&dateKey.includes(searchDate))||
(searchDigits.length>0&&last5.includes(searchDigits))
);
});
}
if(onlineCargo){
// 依商品目前顯示的分類判斷；混合訂單可同時出現在各個有商品的分類。
const includedRows=new Set();
groupOnlineOrders(onlineRows).forEach(({items})=>{
const include=items.some(row=>{
const tag=cargoDisplay(row).text;
if(onlineCargo==='現貨')return tag==='現';
if(onlineCargo==='未訂購')return tag==='未';
if(onlineCargo==='已訂購')return tag==='訂';
if(onlineCargo==='受注')return /^(0[1-9]|1[0-2])$/.test(tag);
if(onlineCargo==='補貨登記')return /^補\d*$/.test(tag);
if(onlineCargo==='已開單')return tag==='完';
if(onlineCargo==='未開單')return tag==='現'||tag==='訂';
return tag===onlineCargo;
});
if(include)items.forEach(row=>includedRows.add(Number(row.row)));
});
rows=rows.filter(row=>includedRows.has(Number(row.row)));
}
if(onlineSearchText){
const matchedRows=new Set(rows);
const completeRows=new Set();
groupOnlineOrders(onlineRows).forEach(({items})=>{
if(items.some(row=>matchedRows.has(row)))items.forEach(row=>completeRows.add(row));
});
rows=onlineRows.filter(row=>completeRows.has(row));
}
showOnlineRows(rows)
}
function onlineSourceMatches(row,query){
 const data=row?.data||{},normalize=value=>String(value??'').normalize('NFKC').trim().toLowerCase();
 const source=normalize(['來源','通路','平台'].map(name=>data[name]).find(value=>String(value??'').trim()));
 const key=normalize(query);if(!source||!key)return false;
 const aliases=[['ig','哀居','instagram'],['脆','@','threads','脆(@)']];
 return source.includes(key)||aliases.some(group=>group.includes(source)&&group.includes(key));
}

function customerIdentity(name,rows){
 return `<span class="customerIdentity"><span class="customerIdentityName">${esc(name)}</span></span>`;
}
function getCustomerName(row){
return getOnlineData(
row,
[
'顧客名稱',
'客戶名稱',
'客人名稱',
'姓名'
]
)
}
function getGroupName(row){
return getOnlineData(
row,
[
'團名',
'團組',
'團'
]
)
}
function getLast5(row){
return getOnlineData(
row,
[
'後五碼',
'匯款後五碼'
]
)
}
function showOnlineRows(rows){
const res=document.getElementById('onlineResult');
if(!res)return;
if(!rows.length){
res.innerHTML='<div class="empty">沒有符合的資料</div>';
return
}
showOrderCards(rows,onlineSummaryTitle());
return;
let totalSum=0;
rows.forEach(x=>{
const p=
Number(
getOnlineData(
x,
['售價','價格']
)||0
);
totalSum+=p;
});
const title=
onlineSearchText
?`
<div class="cardHead">
<span>${esc(onlineSearchText)}</span>
<span>
${rows.length} 筆｜
總金額 $${money(totalSum)}
</span>
</div>
`
:'';
res.innerHTML=`
<div class="card">
${title}
<div class="tableWrap">
<table class="onlineTable">
<thead>
<tr>
<th>出貨</th>
<th>顧客名稱</th>
<th>時間</th>
<th>貨況</th>
<th>團名</th>
<th>名稱</th>
<th>售價</th>
<th>運費</th>
<th>訂金</th>
<th aria-label="後五碼"></th>
</tr>
</thead>
<tbody>
${rows.map(x=>{
const customer=getCustomerName(x);
const time=
getOnlineData(
x,
[
'時間',
'購買時間'
]
);
const rawCargo=
getOnlineData(
x,
[
'貨況',
'狀態'
]
);
const cargo=cargoCategory(rawCargo);
const cargoText=cargoLabel(rawCargo);
const group=getGroupName(x);
const name=
getOnlineData(
x,
[
'名稱',
'商品名稱'
]
);
const price=
getOnlineData(
x,
[
'售價',
'價格'
]
);
const shipping=
getOnlineData(
x,
['運費']
);
const deposit=
getOnlineData(
x,
['訂金']
);
const last5=getLast5(x);
return `
<tr>
<td>
<input
class="check shipCheck"
type="checkbox"
value="${esc(x.row)}" ${isOpenedRow(x)?'disabled':''}>
</td>
<td>
${
customer
?
`<button
class="customerLink"
onclick='openCustomer(${JSON.stringify(String(customer))})'>
${customerIdentity(customer,[x])}
</button>`
:''
}
</td>
<td>
${esc(formatOnlineTime(time))}
</td>
<td>
${
cargo
?
`<span
class="tag ${
cargo==='現貨'
?'green'
:cargo==='補貨登記'
?'red'
:'blue'
}">
${esc(cargoText)}
</span>`
:''
}
</td>
<td>
${
group
?
`<button
class="groupLink"
onclick='openGroup(${JSON.stringify(String(group))})'>
${esc(group)}
</button>`
:''
}
</td>
<td>
${esc(name)}
</td>
<td>
${price===''?'':money(price)}
</td>
<td>
${shipping===''?'':money(shipping)}
</td>
<td>
${deposit===''?'':money(deposit)}
</td>
<td>
${esc(last5)}
</td>
</tr>
`;
}).join('')}
</tbody>
</table>
</div>
<div style="padding:12px">
<button

let onlineCardLayoutObserver=null,onlineCardVisibilityObserver=null,onlineCardLayoutRoot=null;
const onlineCardSlots=new Map(),onlineCardRecords=new Map();
function resetOnlineCardLayout(){
onlineCardLayoutObserver?.disconnect();onlineCardVisibilityObserver?.disconnect();
onlineCardLayoutObserver=null;onlineCardVisibilityObserver=null;onlineCardLayoutRoot=null;onlineCardSlots.clear();onlineCardRecords.clear();
}
function onlineScrollPosition(node){
const item=onlineCardRecords.get(node.closest?.('.groupCard'));
return !node.isConnected&&item&&node.matches('.groupCardItems')?{top:item.top,left:item.left}:{top:node.scrollTop,left:node.scrollLeft};
}
function onlineRestoreScroll(node,top,left){
const item=onlineCardRecords.get(node.closest?.('.groupCard'));
if(item&&node.matches('.groupCardItems')){item.top=top;item.left=left;}
node.scrollTop=top;node.scrollLeft=left;
}
// 離開畫面的整張卡保留原節點；勾選、背景作業及卡內捲動仍使用同一筆資料。
function onlineQueryAll(selector,root=document){
const found=[...root.querySelectorAll(selector)];
if(onlineCardLayoutRoot?.isConnected&&(root===document||root===onlineCardLayoutRoot||root.contains(onlineCardLayoutRoot))){
 const nodes=new Set(found.filter(node=>!onlineCardRecords.has(node.closest('.groupCard'))));
 for(const item of onlineCardSlots.values()){
  if(item.card.matches(selector))nodes.add(item.card);
  item.card.querySelectorAll(selector).forEach(node=>nodes.add(node));
 }
 return [...nodes];
}
return found;
}
function prepareOnlineCardLayout(root){
resetOnlineCardLayout();
const cards=[...root.querySelectorAll('.orderCards>.groupCard')];
if(cards.length<=80||typeof ResizeObserver!=='function'||typeof IntersectionObserver!=='function')return;
onlineCardLayoutRoot=root;
const byCard=new Map();
const mount=item=>{
 if(item.card.parentElement===item.slot)return;
 item.slot.style.height='';item.slot.append(item.card);
 const list=item.card.querySelector('.groupCardItems');if(list){list.scrollTop=item.top;list.scrollLeft=item.left;}
};
const update=item=>{
 if(item.visible){mount(item);return;}
 if(!item.height||item.card.contains(document.activeElement)||item.card.parentElement!==item.slot)return;
 const list=item.card.querySelector('.groupCardItems');if(list){item.top=list.scrollTop;item.left=list.scrollLeft;}
 item.slot.style.height=item.height+'px';item.card.remove();
};
let width=0;
const observer=new ResizeObserver(entries=>{
 if(onlineCardLayoutObserver!==observer||!root.isConnected)return;
 for(const entry of entries){
  if(entry.target===root){
   const next=entry.contentRect.width;
   if(width&&next>0&&Math.abs(next-width)>1){for(const item of onlineCardSlots.values()){item.height=0;mount(item);}}
   if(next>0)width=next;
   continue;
  }
  const item=byCard.get(entry.target);
  if(!item||!item.card.isConnected||entry.contentRect.height<=0)continue;
  item.height=entry.borderBoxSize?.[0]?.blockSize||entry.contentRect.height+2;
  update(item);
 }
});
const visibility=new IntersectionObserver(entries=>{
 if(onlineCardVisibilityObserver!==visibility||!root.isConnected)return;
 for(const entry of entries){const item=onlineCardSlots.get(entry.target);if(item){item.visible=entry.isIntersecting;update(item);}}
},{root,rootMargin:'600px 0px'});
onlineCardLayoutObserver=observer;onlineCardVisibilityObserver=visibility;
cards.forEach(card=>{
 const slot=document.createElement('div');slot.className='onlineCardSlot';
 card.replaceWith(slot);slot.append(card);
 const item={slot,card,visible:true,height:0,top:0,left:0};onlineCardSlots.set(slot,item);onlineCardRecords.set(card,item);byCard.set(card,item);
 observer.observe(card);visibility.observe(slot);
});
observer.observe(root);
}

async function login(event){

<script id="host-connection-script">
(()=>{
 const icon=document.getElementById('hostConnectionStatus');
 const nativeFetch=window.fetch.bind(window);
 let recovering=false,timer=null,controller=null,delay=10000,epoch=0;
 function paint(connected){icon.classList.toggle('connected',connected);const label=connected?'主機已連線':recovering?'主機連線中斷':'尚未確認連線';icon.title=label;icon.setAttribute('aria-label',label);}
 function clearTimer(){if(timer!==null)clearTimeout(timer);timer=null;}
 function connected(){recovering=false;epoch++;clearTimer();controller?.abort();controller=null;delay=10000;paint(true);}
 function schedule(){
  if(!recovering||timer!==null||controller||document.hidden||!navigator.onLine)return;
  timer=setTimeout(()=>{timer=null;void probe();},delay);
 }
 function disconnected(){if(!recovering){recovering=true;delay=10000;}paint(false);schedule();}
 async function probe(){
  if(!recovering||controller||document.hidden||!navigator.onLine)return;
  const ticket=epoch,own=new AbortController();controller=own;
  const timeout=setTimeout(()=>own.abort(),8000);
  try{
   const response=await nativeFetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'authWarmup'}),cache:'no-store',signal:own.signal});
   const data=await response.json();
   if(ticket!==epoch)return;
   if(response.ok&&data.ok===true&&data.configured===true&&navigator.onLine){connected();return;}
  }catch{}finally{
   clearTimeout(timeout);
   if(controller===own)controller=null;
   if(ticket===epoch&&recovering){delay=Math.min(delay*2,60000);schedule();}
  }
 }
 window.jiwuHostConnectionResult=function(response,data){
  if(response.ok){
   if(data?.ok===true){if(navigator.onLine)connected();else disconnected();}
   else if(/主機離線|host offline|connector.*offline|relay.*timeout|Mac API unavailable/i.test(data?.error||''))disconnected();
  }
 };
 window.fetch=async function(input,options){
  const url=typeof input==='string'?input:input?.url||String(input);
  if(new URL(url,location.href).href!==new URL(API_URL,location.href).href)return nativeFetch(input,options);
  try{
   const response=await nativeFetch(input,options);
   if([502,503,504].includes(response.status))disconnected();
   return response;
  }catch(error){if(error?.name!=='AbortError')disconnected();throw error;}
 };
 window.addEventListener('offline',()=>{clearTimer();disconnected();});
 window.addEventListener('online',()=>{if(recovering){clearTimer();void probe();}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimer();else if(recovering){clearTimer();void probe();}});
 paint(false);
})();
</script>

<script id="launch-stock-preorder-runtime-20261102">
const launchCatalogReferenceCache=new Map();
function launchCatalogReferenceKey(group){return JSON.stringify([group.id,group.status,group.name]);}
function launchCatalogReferenceIdentity(p){
 const code=String(p.code||'').trim()||(String(p.url||'').match(/\/(\d{13})(?:[-.]|\/|$)/)||[])[1]||'';
 return code?'code:'+code:p.id?'id:'+p.id:'name:'+String(launchDisplayName(p)||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
}
function launchCatalogReferenceText(item){
 const entry=launchCurrent&&launchCatalogReferenceCache.get(launchCatalogReferenceKey(launchCurrent));
 if(!entry?.counts)return entry?.error?'—':'…';
 const row=entry.counts.get(launchCatalogReferenceIdentity(item)),difference=row?row.ordered-row.needed:0;
 return difference===0?'0':'('+(difference>0?'+':'')+difference+')';
}
function launchPaintCatalogReferences(group,entry){
 if(!launchCurrent||launchCatalogReferenceKey(launchCurrent)!==launchCatalogReferenceKey(group))return;
 if(entry.rows){
  const products=launchCurrent.items||[],summary=launchBuildOrderSummary(launchCurrent,entry.rows,entry.headers);
  const result=launchPurchaseReconciliation(launchCurrent,summary,products,entry.orders,true);
  entry.counts=new Map(result.entries.map(row=>[row.key,row]));
 }
 document.querySelectorAll('[data-launch-preorder-reference]').forEach(node=>{
  const item=launchCurrent.items[Number(node.dataset.launchPreorderReference)];if(!item||(String(item.preorderQuantity??'')!==''&&Number(item.preorderQuantity)!==0))return;
  node.textContent=launchCatalogReferenceText(item);node.classList.toggle('isPositiveReference',/^\(\+/.test(node.textContent));
  node.title=entry.error?'參考差額暫時無法讀取，重新整理可重試':'購買量減喊單量，僅供參考；點擊輸入預購數量';
 });
}
async function launchLoadCatalogReferences(group){
 const key=launchCatalogReferenceKey(group);let entry=launchCatalogReferenceCache.get(key);
 if(entry?.pending){await entry.pending;launchPaintCatalogReferences(group,entry);return;}
 if(entry&&!entry.error&&Date.now()-entry.loadedAt<30000){launchPaintCatalogReferences(group,entry);return;}
 entry={loadedAt:0};launchCatalogReferenceCache.set(key,entry);
 entry.pending=(async()=>{
  try{
   const [online,purchases]=await Promise.all([api('online',{compact:'0',fresh:'1'}),api('purchaseOrders')]);
   const headers=online.headers||[];entry.headers=headers;entry.rows=online.format==='online-matrix-v1'?(online.rows||[]).map(r=>({row:r[0],data:Object.fromEntries(headers.map((h,i)=>[h,r[i+1]]))})):(online.rows||[]);entry.orders=purchases.orders||[];entry.loadedAt=Date.now();
  }catch(error){entry.error=true;}finally{entry.pending=null;}
 })();
 await entry.pending;launchPaintCatalogReferences(group,entry);
}
function launchCatalogQuantityGroup(item,index,kind){
 const stock=kind==='stock',label=stock?'現貨':'預購',value=(stock?item.stockQuantity:item.preorderQuantity)??'',reference=!stock&&(String(value)===''||Number(value)===0);

 return `<span class="inventoryStockGroup" style="gap:0" data-launch-quantity-group="${kind}"><button type="button" class="inventoryStockButton inventoryStockLabel" onclick="launchBeginQuantityEdit(${index},'${kind}',this)" title="點擊修改${label}數量">${label}</button><button type="button" class="inventoryStockButton${reference?' launchPreorderReference'+(/^\(\+/.test(String(shown))?' isPositiveReference':''):''}" ${reference?'data-launch-preorder-reference="'+index+'"':''} onclick="launchBeginQuantityEdit(${index},'${kind}',this)" title="${reference?'購買量減喊單量，僅供參考；點擊輸入預購數量':'點擊修改'+label+'數量'}">${esc(shown)}</button></span>`;
}

function launchCatalogQuantities(item,index){
 return `<div class="inventoryStockLine launchCatalogQuantities">${launchCatalogQuantityGroup(item,index,'stock')}<span aria-hidden="true">｜</span>${launchCatalogQuantityGroup(item,index,'preorder')}</div>`;
}
function launchBeginQuantityEdit(index,kind,button){
 const group=launchCurrent,item=group?.items[index];if(!item||!['stock','preorder'].includes(kind))return;

 input.className='inventoryStockInput';input.type='text';input.inputMode='numeric';input.value=String(current===''?(stock?0:''):current);input.placeholder='0';input.setAttribute('aria-label','修改'+(stock?'現貨':'預購')+'數量');input.setAttribute('data-launch-'+kind,String(index));
 button.closest('.inventoryStockGroup').replaceWith(input);input.focus();input.select();let finished=false;
 const restore=()=>{if(input.isConnected&&launchCurrent?.id===group.id&&launchCurrent.items[index]?.id===item.id)input.outerHTML=launchCatalogQuantityGroup(launchCurrent.items[index],index,kind);};
 const finish=async save=>{
  if(finished)return;finished=true;
  if(!save){restore();return;}
  if(launchCurrent?.id!==group.id||launchCurrent.items[index]?.id!==item.id){restore();return;}
  input.value=toHalfWidthDigits(input.value).trim();
  if(input.value!==''&&(!/^\d+$/.test(input.value)||!Number.isSafeInteger(Number(input.value)))){alert((stock?'現貨':'預購')+'請輸入非負整數或留白');restore();return;}
  const unchanged=Number(input.value)===Number(current);
  if(unchanged&&!(Number(input.value)>0&&item.stockOut)){restore();return;}
  try{await (stock?launchSetProductQuantity:launchSetProductPreorderQuantity)(index,input);}finally{restore();}
 };
 input.addEventListener('blur',()=>finish(true));input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();input.blur();}else if(event.key==='Escape'){event.preventDefault();finish(false);}});
}
async function launchSetProductPreorderQuantity(index,input){
 const group=launchCurrent,item=group?.items[index];if(!group||!item||input.disabled)return;
 const raw=input.value.trim(),previous=item.preorderQuantity??'';
 if(raw!==''&&(!/^\d+$/.test(raw)||!Number.isSafeInteger(Number(raw)))){input.value=previous;alert('預購請輸入非負整數或留白');return;}
 input.disabled=true;
 try{
  const result=await launchPost('launchSetInventoryAvailability',{groupId:group.id,groupStatus:group.status,itemId:item.id,preorderQuantity:raw});

  if(result.out===false){item.stockOut=false;if(launchCurrent?.id===group.id)document.querySelectorAll('.launchCatalogCard').forEach(card=>{const control=card.querySelector('[data-launch-preorder]');if(control&&launchCurrent.items[Number(control.dataset.launchPreorder)]?.id===item.id)card.querySelector('.launchStockToggle')?.classList.remove('isShortage');});}
  if(launchCurrent?.id===group.id){const current=launchCurrent.items.find(p=>p.id===item.id);if(current)current.preorderQuantity=value;
   document.querySelectorAll('[data-launch-preorder]').forEach(control=>{if(launchCurrent.items[Number(control.dataset.launchPreorder)]?.id===item.id)control.value=value;});
  }
  input.value=value;
 }catch(error){input.value=previous;alert(jiwuErrorText(error,'system'));}
 finally{input.disabled=false;}
}

<script id="launch-catalog-price-edit-20261103">
function launchEditCatalogPrice(index,button){
 const group=launchCurrent,item=group?.items[index];if(!item||button.querySelector('input'))return;
 const input=document.createElement('input');input.type='text';input.inputMode='decimal';input.className='launchCatalogPriceInput';input.value=String(item.price??'');input.setAttribute('aria-label','修改 '+launchDisplayName(item)+' 售價');
 let finished=false;
 const restore=()=>{if(!input.isConnected)return;button.textContent='$'+String(item.price??'');};
 const finish=cancel=>{
  if(finished)return;if(launchCurrent!==group||group.items[index]!==item){finished=true;restore();return;}
  const raw=toHalfWidthDigits(input.value).trim(),number=raw===''?null:launchNumber(raw);
  if(!cancel&&raw!==''&&(!/^\d+(?:\.\d+)?$/.test(raw)||number===null||number<0)){input.setCustomValidity('請輸入有效售價');input.reportValidity();input.focus();return;}
  finished=true;const value=raw===''?'':String(Math.ceil(number));
  if(!cancel&&value!==String(item.price??'')){launchPushUndo();launchApplyProductPrice(item,value);launchMark();launchSaveProductCard();}
  restore();document.querySelectorAll('[data-launch-catalog-price]').forEach(node=>{const p=group.items[Number(node.dataset.launchCatalogPrice)];if(p&&!node.querySelector('input'))node.textContent='$'+String(p.price??'');});
 };
 input.addEventListener('click',event=>event.stopPropagation());input.addEventListener('input',()=>input.setCustomValidity(''));input.addEventListener('blur',()=>finish(false));input.addEventListener('keydown',event=>{event.stopPropagation();if(event.key==='Enter'&&!event.isComposing){event.preventDefault();finish(false);}else if(event.key==='Escape'){event.preventDefault();finish(true);}});
 button.replaceChildren(input);input.focus();input.select();
}

function launchCommitDirectPrice(index,input){

 input.setCustomValidity('');const value=raw===''?'':String(Math.ceil(number));
 if(value!==String(item.price??'')){launchPushUndo();launchApplyProductPrice(item,value);launchMark();launchSaveProductCard();}
 document.querySelectorAll('[data-launch-direct-price]').forEach(node=>{const p=launchCurrent.items[Number(node.dataset.launchDirectPrice)];if(p)node.value=String(p.price??'');});launchPaintCatalogSuggestedPrices();return true;
}
function launchDirectPriceKey(event,index,input){
 event.stopPropagation();if(event.isComposing)return;
 if(event.key==='Enter'){event.preventDefault();if(launchCommitDirectPrice(index,input))input.blur();}

}
