<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>JIWU吉物躺著賺後台</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#f3f3f3;
--card:#fff;
--soft:#f7f7f7;
--soft2:#eee;
--border:#e2e2e2;
--text:#555;
--muted:#999;
--main:#A68C73;
--main2:#A68C73;
--green:#8fa98b;
--red:#c9827d;
--blue:#8ca7b2
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden
}
body{
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif
}
.loginScreen{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:#fff
}
.loginCard{
width:min(440px,100%);
text-align:center
}
.loginLogo{
display:block;
width:50%;
height:auto;
margin:0 auto 24px
}
.loginForm{
width:min(360px,100%);
margin:auto
}
.loginForm input{
display:block;
width:100%;
min-width:0;
padding:12px 20px;
border-radius:999px;
text-align:center
}
.loginError{
min-height:22px;
margin:10px 0 0;
color:var(--red);
font-size:14px
}
.protectedShell{display:none}
body.isAuthenticated .loginScreen{display:none}
body.isAuthenticated .protectedShell{display:block}
button,input,select{font:inherit}
button{cursor:pointer}
input[type=number]{
appearance:textfield;
-moz-appearance:textfield
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
-webkit-appearance:none;
margin:0
}
.top{
position:relative;
height:58px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:800;
color:#555
}
.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:62px;
background:rgba(255,255,255,.97);
display:flex;
border-top:1px solid var(--border);
z-index:1000
}
.nav button,
.nav a{
flex:1;
border:0;
background:none;
color:#999;
font-weight:700;
font-size:16px
}
.nav a{
display:flex;
align-items:center;
justify-content:center;
text-decoration:none
}
.nav button.active{
color:var(--main);
background:transparent;
box-shadow:inset 0 3px 0 var(--main)
}
.nav button.isRefreshing{opacity:.55}
.page{
width:100%;
max-width:1700px;
height:calc(100dvh - 120px);
margin:auto;
padding:14px
}
.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap
}
input,select{
border:1px solid #ddd;
background:#fff;
color:var(--text);
border-radius:9px;
padding:9px 11px;
outline:none
}
input:focus,select:focus{
border-color:#aaa
}
select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background-image:none!important;
field-sizing:content;
width:auto;
text-align:center;
text-align-last:center;
padding-left:10px;
padding-right:10px
}
.btn{
border:0;
border-radius:9px;
padding:9px 14px;
background:var(--main);
color:#fff;
font-weight:700
}
.btn.light{
background:#e9e9e9;
color:#666
}
.btn.green{
background:var(--green)
}
.btn.red{
background:var(--red)
}
.mobileShortcut{
display:none
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
box-shadow:0 2px 9px rgba(0,0,0,.035);
overflow:hidden
}
.cardHead{
min-height:46px;
padding:11px 15px;
background:#f8f8f8;
border-bottom:1px solid var(--border);
font-weight:700;
display:flex;
justify-content:space-between;
align-items:center
}
.empty,.loading{
text-align:center;
padding:30px;
color:#aaa
}
.total{
font-size:25px;
font-weight:800
}
.tag{
display:inline-block;
padding:4px 8px;
border-radius:6px;
background:#eee;
color:#666;
font-size:12px;
font-weight:700
}
.tag.green{
background:#e0e9dd;
color:#62745d
}
.tag.red{
background:#f2dddd;
color:#9a625d
}
.tag.blue{
background:#e1e9ed;
color:#627983
}
.check{
width:17px;
height:17px;
accent-color:var(--main)
}
.customerLink,
.groupLink{
border:0;
background:none;
padding:0;
color:#A68C73;
font-weight:400;
text-decoration:none;
text-align:left
}
.customerLink{
font-size:13px
}
.groupLink{
font-size:14px
}
.tableWrap{
width:100%;
overflow:auto
}
table{
border-collapse:collapse;
width:100%;
table-layout:fixed
}
th,td{
padding:8px 7px;
border-bottom:1px solid #eee;
text-align:left;
vertical-align:middle;
word-break:break-word;
overflow-wrap:anywhere
}
th{
background:#f5f5f5;
color:#777;
font-weight:700
}
tr:hover td{
background:#fafafa
}
/* 店面 */
.storePage{
height:100%;
display:grid;
grid-template-columns:minmax(0,1.5fr) minmax(320px,.75fr);
grid-template-rows:auto minmax(0,1fr);
gap:12px
}
.storeManual{
grid-column:1;
grid-row:1
}
.storeMain{
min-height:0;
display:flex;
flex-direction:column;
grid-column:1;
grid-row:2
}
.storeCheckout{
min-height:0;
display:flex;
flex-direction:column;
grid-column:2;
grid-row:1/3
}
.storeMainBody{
padding:12px;
min-height:0;
display:flex;
flex-direction:column
}
.storeSearch{
display:flex;
gap:6px;
flex-shrink:0
}
.storeSearch input{
flex:1;
min-width:0
}
.cart{
flex:1;
min-height:0;
overflow-y:auto;
margin-top:8px;
padding-right:3px
}
.cartItem{
display:flex;
align-items:center;
gap:10px;
padding:9px 2px;
border-bottom:1px solid #eee
}
.cartName{
flex:1;
min-width:0
}
.cartSub{
color:#999;
font-size:12px;
margin-top:3px
}
.qty{
display:flex;
align-items:center;
gap:5px;
flex-shrink:0
}
.qty button{
width:28px;
height:28px;
border:0;
border-radius:6px;
background:#eee;
color:#666
}
.cartItem .removeCartButton{
background:#E78790!important;
color:#fff!important
}
.manualBox{
display:grid;
grid-template-columns:1fr 130px auto;
gap:8px;
padding:10px
}
.checkoutBody{
padding:14px;
min-height:0;
overflow:auto
}
.salesperson{
display:flex;
gap:7px
}
.salesperson button{
flex:1;
border:1px solid #ddd;
background:#fff;
color:#777;
border-radius:8px;
padding:8px
}
.salesperson button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.payment{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px
}
.payment button{
border:1px solid #ddd;
background:#fff;
color:#666;
border-radius:8px;
padding:8px 4px
}
.payment button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.checkoutTotalRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
min-height:32px
}
.checkoutTotalRow .total{min-width:0}
.changeText{
margin-top:0;
text-align:right;
white-space:nowrap;
font-size:16px;
font-weight:700
}
.checkoutActions{
margin-top:12px;
display:grid;
grid-template-columns:4fr 1fr;
gap:7px
}
.checkoutActions .btn.green,
.checkoutActions .acButton{width:100%;height:44px}
.acButton{
display:block;
background:#E78790!important
}
.checkoutQuick{
display:flex;
gap:7px;
align-items:stretch
}
.checkoutQuick input{min-width:0;flex:1}
.checkoutQuick input{text-align:left}
.manualBox input[data-money-input]{text-align:center}
.checkoutQuick .salesperson{flex:1;min-width:0}
.storeAddIcon{display:none}
/* 線上 */
.onlinePage{
height:100%;
display:flex;
flex-direction:column;
gap:10px
}
.onlineToolbar{
flex-shrink:0;
display:flex;
gap:8px
}
.onlineToolbar input,
.onlineToolbar select,
.onlineToolbar button{height:44px}
.onlineToolbar input{
flex:1;
min-width:0
}
.onlineResult{
min-height:0;
flex:1;
overflow:auto
}
.onlineTable{
min-width:900px
}
.onlineTable th:nth-child(1){width:5%}
.onlineTable th:nth-child(2){width:12%}
.onlineTable th:nth-child(3){width:9%}
.onlineTable th:nth-child(4){width:9%}
.onlineTable th:nth-child(5){width:20%}
.onlineTable th:nth-child(6){width:20%}
.onlineTable th:nth-child(7){width:8%}
.onlineTable th:nth-child(8){width:8%}
.onlineTable th:nth-child(9){width:8%}
.onlineTable th:nth-child(10){width:8%}
.groupSummary{
font-size:16px;
font-weight:400
}
.customerNameTitle{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;border:0;padding:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.customerNameEditIcon{display:block;width:1em;height:1em;object-fit:contain;align-self:center;flex:0 0 1em}
.faceOrderHead{background:var(--green);color:#fff}
.faceOrderSection{margin:12px 0}
.faceOrderHead.faceStockHead{background:#D9C0FA}
.faceOrderHead.facePreorderHead{background:#FDD365}
.faceOrderHead.faceCargoHead{background:#9BB4A8}
.faceOrderHead.faceRestockHead{background:#7E88A0}
.groupCards{
padding:12px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
align-items:stretch
}
.orderCards,.onlineResult .orderCards{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.groupCard{
height:240px;
min-width:0;
border:1px solid var(--border);
border-radius:12px;
background:#fff;
overflow:hidden;
display:flex;
flex-direction:column;
position:relative
}
.groupCardCustomer{
padding:10px 13px;
background:#f7f7f7;
border-bottom:1px solid #eee;
flex-shrink:0;
font-size:14px;
display:flex;
justify-content:flex-start;
gap:8px;
align-items:center
}
.groupCardCustomer .groupCardTotal{margin-left:auto}
.groupCardItems{
flex:1;
min-height:0;
overflow-y:auto;
padding:3px 13px
}
.groupCardItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:7px 0;
border-bottom:1px solid #f0f0f0;
font-size:13px
}
.groupCardItem.opened{background:#f1f1f1}
.groupCardItem .check{flex-shrink:0}
.groupCardItem:last-child{
border-bottom:0
}
.groupCardItemName{
flex:1;
min-width:0;
word-break:break-word
}
.groupCardItemPrice{
white-space:nowrap
}
.groupCardNote{padding:7px 0;color:#8b8077;font-size:12px;line-height:1.4;word-break:break-word}
.orderAddButton{position:static;z-index:2;width:18px;height:18px;flex:0 0 18px;border:0;border-radius:50%;padding:0;background:var(--main);color:#fff;font-size:16px;line-height:17px;font-weight:400}
.orderAddButton:hover{filter:brightness(.94)}
.orderItemDate{white-space:nowrap}
.groupCardBottom{
padding:9px 13px;
border-top:1px solid #eee;
display:flex;
justify-content:space-between;
gap:10px;
font-size:12px;
color:#888;
flex-shrink:0
}
.groupCardBottom strong{
color:#555;
font-size:13px
}
.groupCardMeta{
padding:7px 13px;
border-top:1px solid #eee;
display:flex;
flex-wrap:nowrap;
white-space:nowrap;
justify-content:flex-start;
align-items:center;
gap:8px;
font-size:12px;
color:#777;
flex-shrink:0
}
.groupCardMeta>*{flex-shrink:0}
.groupCardMeta{container-type:inline-size;container-name:orderMeta}
.orderDeposit{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.orderDepositLabel{white-space:nowrap}
.orderDepositInput::placeholder{color:transparent}
@container orderMeta (max-width:520px){
.orderDeposit.hasDepositInput .orderDepositLabel{display:none}
.orderDeposit.hasDepositInput .orderDepositInput::placeholder{color:#999;opacity:1}
}
.groupCardMeta>*:first-child{margin-right:auto}
.orderMetaDate.isHidden+*{margin-left:auto}
.orderMetaDate.isHidden{display:none}
.reconcileButton{padding:4px 9px;font-size:12px;white-space:nowrap}
.reconcileButton.isDone{background:#FFBCD5;color:#fff}
.groupCardMeta input{
width:66px;
flex:0 0 66px;
padding:4px 6px;
border-radius:6px;
font-size:12px;
text-align:center
}
.orderLast5{white-space:nowrap}
.orderLast5 input:disabled{background:#f2f2f2;color:#aaa}
.groupCardTotal{white-space:nowrap;color:#555;font-size:13px}
.faceToFaceTag,.faceToggle{
border:1px dashed #CBC3BC;
border-radius:5px;
padding:2px 5px;
font-size:10px;
background:transparent;
color:#CBC3BC
}
.faceToFaceTag.active,.faceToggle.active{
background:var(--green);
color:#fff;
border-color:var(--green)
}
.orderPayment{
width:62px;
flex:0 0 62px;
padding:4px 3px;
border-radius:6px;
font-size:12px
}
.onlineIconButton{
width:42px;
min-width:42px;
padding:0;
background-repeat:no-repeat!important;
background-position:center!important;
background-size:50%!important;
color:transparent!important
}
.onlineSearchButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922205838_23cab617.png')!important}
.onlineRefreshButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922204703_5dd34c41.png')!important}
.onlineAddButton{width:42px;min-width:42px;padding:0;font-size:24px}
.cargoTag{
width:18px;
height:18px;
padding:0!important;
border-radius:4px!important;
font-size:11px!important;
line-height:18px;
text-align:center;
color:#fff!important;
flex-shrink:0;cursor:pointer;border:0;width:auto;min-width:18px;padding:0 3px!important;font-size:10px!important
}
/* 出貨 */
.shipPage{
height:100%;
overflow:auto
}
.shipItem{
padding:10px 15px;
border-top:1px solid #eee;
display:flex;
gap:12px;
align-items:center
}
.shipCardHead{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.shipCardHead strong{margin-right:auto}
.shipCopyButton{
width:1.2em;height:1.2em;min-width:1.2em;padding:0;
font-size:inherit;line-height:1;flex-shrink:0;border-radius:0;
background:transparent!important
}
.shipCopyButton img{display:block;width:100%;height:100%;object-fit:contain}
.shipPacked,.shipPacked .cardHead,.shipPacked .shipItem,.shipPacked .shipCardTotals{
background:#ededed
}
.shipPacked .shipProductName,.shipPacked .shipProductPrice,.shipPacked .shipCardTotals strong{color:#999}
.shipCompleteButton{padding:4px 10px;font-size:12px}
.shipCompleteButton[aria-pressed="true"]{background:#b9b9b9}
.shipOrderDate{width:48px;flex-shrink:0;color:#777}
.shipProductName{flex:1;min-width:0}
.shipProductPrice{white-space:nowrap}
.shipCardTotals{
display:flex;
gap:12px;
align-items:center;
justify-content:flex-end;
padding:10px 15px;
border-top:1px solid #eee;
font-size:13px;
flex-wrap:wrap
}
.shipCardTotals strong{color:#E24C60;font-size:15px}
.shipSummary{
margin-bottom:10px
}
.shipSelected{
padding:12px
}
.shipSelectedRow{
display:flex;
justify-content:space-between;
gap:10px;
padding:7px 0;
border-bottom:1px solid #eee
}
.shipSelectedName{
flex:1;
min-width:0
}
.shipSelectedPrice{
white-space:nowrap
}
.shipTotalBox{
padding:12px;
background:#fafafa;
border-top:1px solid #eee
}
.shipTotalLine{
display:flex;
justify-content:space-between;
padding:3px 0
}
.shipBalance{
font-size:20px;
font-weight:800;
margin-top:5px
}
.topActions{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
display:flex;
align-items:center;
gap:6px
}
.topActions .btn{
height:26px;
min-height:0;
padding:2px 9px;
font-size:13px;
line-height:20px;
border-radius:6px
}
.topHomeButton,.topFaceButton,.topRefreshButton,.topStoreToggle,.topDetailsButton{display:none}
.topHomeButton{background:#E78790!important;color:#fff!important}
.topFaceButton{background:var(--green)!important;color:#fff!important}
body[data-page="store"] .topStoreToggle{display:block}
body[data-page="online"] .topHomeButton,body[data-page="online"] .topFaceButton,body[data-page="online"] .topDetailsButton{display:inline-flex;align-items:center}
.topDetailsButton{background:#8b8077!important;color:#fff!important}
body[data-page="ship"] .topRefreshButton{display:block}
.topActions .topRefreshButton{
width:26px;
min-width:26px;
padding:0;
background-size:75%!important
}
.storeSalesPage{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.storeSalesToolbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.storeSalesToolbar input{flex:1;min-width:0}
.storeSalesToolbar button{height:38px;flex-shrink:0}
.storeSalesToolbar>strong{margin-right:auto}
.storeSalesMonthSummary{flex-shrink:0;min-height:20px;color:#777;font-size:13px;font-weight:700;padding:0 3px}
.storeSalesMonthSummary[hidden]{display:none}
.storeSalesWarning{flex-shrink:0;text-align:center}
.storeSalesWarning .salesHint{margin:6px 0 0;text-align:center}
#storeSalesResult{flex:1;min-height:0;overflow:auto}
.salesDayCard{margin-bottom:12px}
.salesDayCard summary{cursor:pointer;padding:12px;list-style:none}
.salesDayCard summary::-webkit-details-marker{display:none}
.salesDayHeading{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.salesDayTotals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.salesDayTotals>span{padding:0 10px;text-align:center;border-right:1px solid #ddd;font-size:13px}
.salesDayTotals>span:first-child{padding-left:0}
.salesDayTotals>span:last-child{border:0;padding-right:0}
.salesDayTotals b{display:block;font-size:18px;margin-top:4px}
.salesHint{font-size:12px;color:#888;margin:6px 0 10px}
.salesDetailRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #eee}
.salesTime{font-size:12px;color:#999;flex:0 0 38px;width:38px;white-space:nowrap;font-variant-numeric:tabular-nums}
.salesProduct{flex:1;min-width:0;overflow-wrap:anywhere}
.salesProduct small{display:block;color:#999;font-size:12px;margin-top:4px}
.salesHiddenFields{display:block;color:#999;font-size:10px;line-height:1.3;margin-top:2px;font-weight:400}
.salesDayCard{margin-bottom:0}
.salesCards{padding:0}
.salesCount{margin-left:auto;color:#999;font-size:12px}
.salesPurchase{border-bottom:1px solid #eee;padding:5px 0}
.salesPurchase:last-child{border-bottom:0}
.salesPurchaseMeta{display:flex;gap:8px;color:#999;font-size:11px;padding:2px 0}
.salesPurchaseMeta>span:last-child{margin-left:auto}
.salesDetailRow{padding:5px 0;border:0;font-size:13px;min-height:30px}
.salesFooter{display:block;padding:8px 10px}
.salesFooter .salesDayTotals{width:100%;font-size:11px}
.salesFooter .salesDayTotals>span{font-size:11px;padding:0 5px}
.salesFooter .salesDayTotals b{font-size:14px}
.salesCash{color:#F8C043!important}
.salesFooter .salesHint{margin:5px 0 0}
#storeSalesResult{display:block;min-height:0;overflow:auto}
#storeSalesResult>.salesHint{flex-shrink:0}
.salesCards{display:grid;min-height:0;height:auto;overflow:visible;align-content:start;align-items:start;grid-auto-rows:max-content;gap:12px}
.salesCards.salesSingle{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.salesCards.salesSingle>.salesDayCard{display:flex;flex-direction:column;flex:1 1 0;width:100%;height:100%;min-height:0;overflow:hidden}
.salesCards.salesSingle .salesDayItems{flex:1 1 0;min-height:0;overflow-y:auto}
.salesCards.salesSingle .salesFooter{flex:0 0 auto}
.salesCards .salesDayItems{display:block;height:auto;min-height:0;overflow:visible}
.salesCards.salesMulti{grid-auto-rows:max-content}
.salesCards .salesDayCard{display:block;height:auto;min-height:0;max-height:none}
.salesDayCard .groupCardCustomer{flex-wrap:wrap;gap:5px 8px}
.salesOther{font-size:11px;color:#999;font-weight:400}
.rainToggle{border:0;background:transparent;padding:0;margin-left:4px;font-size:19px;line-height:1;color:#E1DCE0;cursor:pointer}
.rainToggle[aria-pressed="true"]{color:#556890}
.shipDateCount{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.shipDateCount i{font-style:normal;color:#aaa}
.salesPurchase{border-bottom:1px solid #ddd;padding:0}

/* =========================================================
   API
========================================================= */
function api(action,params={}){
const retryable=[
'authWarmup',
'authLogin',
'authCheck',
'storeProduct',
'inventory',
'setInventoryPrice',
'updateInventoryProduct','deleteInventoryProduct',
'setInventoryImage',
'storeActiveSalesperson',
'online',
'appendOnlineOrder',
'editOnlineOrder','deleteOnlineOrder',
'onlineCustomer',
'group',
'ship',
'saveOnlinePayment',
'setOnlineFaceToFace',
'renameOnlineCustomer'
].includes(action);
const maxAttempts=action==='inventory'?3:2;
return new Promise((resolve,reject)=>{
let attempt=0;
let done=false;
const run=()=>{
attempt++;
const cb=
'cb_'+
Date.now()+
'_'+
Math.random().toString(36).slice(2);
const s=document.createElement('script');
let timer=null;
const cleanup=()=>{
if(timer)clearTimeout(timer);
delete window[cb];
if(s.parentNode){
s.parentNode.removeChild(s);
}
};
window[cb]=data=>{
if(done)return;
done=true;
cleanup();
if(data&&data.ok===false){
if(data.error==='登入已失效，請重新登入')showLogin();
reject(
new Error(
data.error||'GAS 錯誤'
)
);
return;
}
resolve(data);
};
s.onerror=()=>{
cleanup();
if(retryable&&attempt<maxAttempts){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('無法連線 GAS')
);
}
};
const q=new URLSearchParams({
action,
callback:cb,
_t:Date.now(),
...(authToken?{token:authToken}:{}),
...params
});
s.src=
API_URL+
'?'+
q.toString();
s.async=true;
(document.head||document.body)
.appendChild(s);
const timeoutMs=action==='reorderInventory'?60000:['authLogin','authCheck','checkInventoryAvailability','inventory'].includes(action)?30000:15000;
timer=setTimeout(()=>{
cleanup();
if(retryable&&attempt<maxAttempts){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('GAS 連線逾時')
);
}
},timeoutMs);
};
run();
});
}
/* =========================================================
   基本
========================================================= */
function esc(v){
return String(v??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'",'&#39;')
}
function money(v){
return numberValue(v).toLocaleString()
}
function numberValue(v){
const n=typeof v==='number'
?v
:Number(String(v??'').replace(/,/g,''));
return Number.isFinite(n)?n:0
}
function findHeader(headers,names){
for(const n of names){
const i=headers.indexOf(n);
if(i>=0)return headers[i];
}
return null
}
function getOnlineData(row,names){
const h=findHeader(
onlineHeaders,
names
);
return h?row.data[h]:''
}
function formatOnlineTime(v){
if(!v)return '';
const s=String(v).trim();
let m=s.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[2]).padStart(2,'0')+
'/'+
String(m[3]).padStart(2,'0')
}
m=s.match(
/(\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[1]).padStart(2,'0')+
'/'+
String(m[2]).padStart(2,'0')
}
return s
}
function timeValue(v){
if(!v)return 0;
const s=String(v).trim();
let m=s.match(
/(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
+m[1],
+m[2]-1,
+m[3],
+m[4],
+(m[5]||0)
).getTime()
}
m=s.match(
/(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2],
+(m[3]||0),
+(m[4]||0)
).getTime()
}
m=s.match(
/(\d{1,2})\/(\d{1,2})/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2]
).getTime()
}
return 0
}

function cartContentsKey(items){
return JSON.stringify(items.map(x=>({code:String(x.code||''),name:String(x.name||''),price:Number(x.price||0),qty:Number(x.qty||1),manual:!!x.manual,note:x.note||'',offerQty:x.offerQty,offerTotal:x.offerTotal})));
}
/*
 * 從 GAS 取得共用購物車
 */
async function loadStoreCart(){
if(!salesperson){
storeCart=[];
renderCart();
return;
}
if(storeCartLoading||cartPendingWrites||cartUnsaved||cartOperationBusy)return;
const requestUser=salesperson;
const requestRevision=cartRevision;
storeCartLoading=true;
try{
const d=await api(
'storeCart',
{salesperson:requestUser}
);
if(requestUser!==salesperson||requestRevision!==cartRevision||cartPendingWrites||cartUnsaved||cartOperationBusy)return;
const nextCart=Array.isArray(d.cart)?d.cart:[];
if(cartContentsKey(nextCart)!==cartContentsKey(storeCart)){
storeCart=nextCart;
renderCart();
}
}catch(e){
console.error('讀取購物車失敗',e);
}finally{
storeCartLoading=false;
if(requestUser!==salesperson&&salesperson)loadStoreCart();
}
}
/*
 * 將目前商品清單同步到 GAS
 */
async function saveStoreCart(){
if(!salesperson)return;
const user=salesperson;
const revision=++cartRevision;
const items=JSON.stringify(storeCart.map(x=>({code:x.code||'',name:x.name||'',price:Number(x.price||0),qty:Number(x.qty||1),manual:!!x.manual,note:x.note||''})));
cartPendingWrites++;
cartUnsaved=true;
const request=cartWriteQueue.then(()=>api('storeCartSet',{salesperson:user,items}));
cartWriteQueue=request.catch(()=>{});
try{
const result=await request;
if(revision===cartRevision){cartUnsaved=false;if(Array.isArray(result.cart)){storeCart=result.cart;renderCart();}}
}catch(e){
alert('購物車尚未儲存，暫停背景同步以保留你的修改。請確認網路後再修改商品重試：'+e.message);
}finally{cartPendingWrites--;}
}

function inventoryHeaderIndex(names){
if(names.includes('庫存'))names=[...names,'庫存量','商品庫存'];
if(names.includes('店面'))names=[...names,'店面數量','店面庫存量'];
const keys=names.map(x=>String(x).normalize('NFKC').replace(/[\s_　-]/g,'').toLowerCase());
return inventoryHeaders.findIndex(h=>keys.includes(String(h||'').normalize('NFKC').replace(/[\s_　-]/g,'').toLowerCase()));
}
function inventoryValue(item,names,preferDisplay=true){
const i=inventoryHeaderIndex(names);if(i<0)return '';
const display=item.display&&item.display[i];
return preferDisplay&&display!==''&&display!=null?display:(item.values?item.values[i]:'');
}
function inventoryImageUrl(item){
if(item.image&&/^https?:\/\//i.test(String(item.image)))return String(item.image);
const i=inventoryHeaderIndex(['圖片','商品圖片','圖片網址','圖片連結','商品圖','照片','photo','image','img']);
let value=i>=0?String(item.display?.[i]||item.values?.[i]||'').trim():'';
let formula=i>=0?String(item.formulas?.[i]||''):'';
if(!value){const match=formula.match(/(?:IMAGE|HYPERLINK)\s*\(\s*["']([^"']+)/i);if(match)value=match[1];}
if(/^https?:\/\//i.test(value))return value;
return '';
}
function openInventoryImageDialog(row){

inventoryLoadedAt=Date.now();saveInventorySessionCache();closeDialog();renderInventoryContent();
}catch(error){alert('圖片更新失敗：'+error.message);button.disabled=false;button.textContent='更新圖片';}
}
function inventoryProductUrl(item){
const i=inventoryHeaderIndex(['商品網址','官網網址','商品連結','官網連結','網址','URL','url','連結','商品頁面','商品URL','購買網址','官方連結','產品連結','產品網址','官網','商品官網','來源網址']);
if(i<0)return '';
let value=String(item.display?.[i]||item.values?.[i]||'').trim();
if(!/^https?:\/\//i.test(value)){const formula=String(item.formulas?.[i]||'');const match=formula.match(/HYPERLINK\s*\(\s*["'](https?:\/\/[^"']+)/i);if(match)value=match[1];}
return /^https?:\/\//i.test(value)?value:'';
}
function inventoryCellState(item,names){const value=String(inventoryValue(item,names,false)??'').trim().toLowerCase();if(value==='x')return 'x';const n=Number(value.replace(/,/g,''));return Number.isFinite(n)?n:null;}
function inventoryQty(item,names){const state=inventoryCellState(item,names);return typeof state==='number'?state:0;}
function inventoryAvailabilityState(item){const value=String(inventoryValue(item,['官網貨況','官網狀態','官網庫存狀態','網站貨況','商品官網狀態','官網在庫','在庫狀態','狀態','貨況'])||'').toLowerCase();if(/❌|缺貨|無庫存|無貨|売り切れ|在庫なし|sold.?out|^false$|^no$|^0$/.test(value))return 'no';if(/⭕|有庫存|有貨|在庫あり|販売中|in.?stock|^true$|^yes$|^1$/.test(value))return 'yes';if(/⚠️|無法判斷/.test(value))return 'unknown';return '';}
function inventoryIsShortage(item){return inventoryCellState(item,['庫存','總庫存','數量'])==='x'||/缺貨/.test(String(inventoryValue(item,['庫存狀態','商品狀態','狀態','貨況'])||''));}
function inventoryMatchesStatus(item){
const stock=inventoryCellState(item,['庫存','總庫存','數量']);
const store=inventoryCellState(item,['店面','店面庫存','店鋪庫存','店面數量']);
const hasStock=(typeof stock==='number'&&stock>0)||(typeof store==='number'&&store>0)||(stock==='x'&&inventoryAvailabilityState(item)==='yes');
const noStock=!inventoryIsShortage(item)&&!(typeof stock==='number'&&stock>0)&&!(typeof store==='number'&&store>0);
if(inventoryStatus==='目錄')return hasStock||noStock;
if(inventoryStatus==='有庫存')return hasStock;
if(inventoryStatus==='無庫存')return noStock;
if(inventoryStatus==='缺貨')return inventoryIsShortage(item);
return true;
}
function inventoryHasZeroOrX(item,names){const value=inventoryCellState(item,names);return value==='x'||value===0;}
function inventoryNoteHasUrl(item){return /(?:https?:\/\/|www\.)\S+/i.test(String(inventoryValue(item,['備註','備註欄','說明'])||'').trim());}
async function checkInventoryUrl(row){if(inventoryStatusCheckingRows.has(Number(row)))return;inventoryStatusCheckingRows.add(Number(row));renderInventoryContent();try{const result=await api('checkInventoryAvailability',{row});const statusCol=Number(result.statusCol);if(Number.isInteger(statusCol)&&statusCol>=0){while(inventoryHeaders.length<=statusCol)inventoryHeaders.push('');inventoryHeaders[statusCol]=result.statusHeader||'官網貨況';const item=inventoryRows.find(x=>Number(x.row)===Number(row));if(item){while(item.values.length<=statusCol)item.values.push('');item.values[statusCol]=result.status;if(item.display){while(item.display.length<=statusCol)item.display.push('');item.display[statusCol]=result.status;}if(result.stock==='x'){const stockCol=inventoryHeaderIndex(['庫存','總庫存','數量']);if(stockCol>=0){item.values[stockCol]='x';if(item.display)item.display[stockCol]='x';}}}}inventoryLoadedAt=Date.now();saveInventorySessionCache();if(result.available==null)alert(result.detail||'網站無法辨識貨況，已標示為待確認');}catch(e){alert('貨況更新失敗：'+e.message);}finally{inventoryStatusCheckingRows.delete(Number(row));renderInventoryContent();}}
function inventoryOriginalUnit(item){const row=(item.values||[]).map(x=>String(x??'')).join(' ');return /天貓|天猫|tmall/i.test(row)?'R':'¥';}
function inventoryOriginalDisplay(item,value){const text=String(value??'').trim();if(!text)return '';if(/[^0-9,.]/.test(text))return text;return inventoryOriginalUnit(item)+money(text);}

const start=input.selectionStart;
const before=input.value;
const value=toHalfWidthDigits(before).replace(/[．。]/g,'.').replace(/[－−]/g,'-');

}

function formatStoreSalesDate(date){
const match=String(date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(!match)return String(date||'');
const weekday=['日','一','二','三','四','五','六'][new Date(Number(match[1]),Number(match[2])-1,Number(match[3])).getDay()];
return match[2]+'/'+match[3]+'('+weekday+')';
}
function drawStoreSales(target=null){
const result=target||document.getElementById('storeSalesResult');
if(!result||!storeSalesData)return;
const summary=document.getElementById('storeSalesSummary');
const warningBox=document.getElementById('storeSalesWarning');
if(storeSalesDate===null)storeSalesDate=storeSalesData.today.slice(5).replace('-','');
const input=document.getElementById('storeSalesDate');
if(input&&input.value!==(storeSalesDate||''))input.value=storeSalesDate||'';
const searchText=(storeSalesDate||'').trim();
const isDateQuery=/^(\d{2}|\d{4})$/.test(searchText);
const query=isDateQuery?searchText:'';
const nameQuery=isDateQuery?'':searchText.normalize('NFKC').toLowerCase();
const year=storeSalesData.today.slice(0,4);
let days=[...(storeSalesData.days||[])].sort((a,b)=>a.date.localeCompare(b.date));
// Count each recorded work date once, before applying date or product filters.
const workDayAnchor='2026-09-25';
const workDates=[...new Set((storeSalesData.days||[]).filter(day=>day.items?.length).map(day=>day.date).concat(workDayAnchor))].sort();
const anchorIndex=workDates.indexOf(workDayAnchor);

function quantityOffer(item){
const price=Math.round(Number(item.price||0)*100),qty=Math.max(0,Math.floor(Number(item.qty)||0));
const size=Number(item.offerQty),offer=Math.round(Number(item.offerTotal)*100);
const enabled=!item.manual&&Number.isInteger(size)&&size>=2&&item.offerTotal!==''&&item.offerTotal!=null&&Number.isFinite(offer)&&offer>=0&&offer<price*size;
// Missing offerTotal must never enter arithmetic (0 * NaN is still NaN).
if(!enabled)return {total:qty*price/100,groups:0,size:0,offer:0,saving:0};
const groups=Math.floor(qty/size),remainder=qty-groups*size;
return {total:(groups*offer+remainder*price)/100,groups,size:enabled?size:0,offer:offer/100,saving:(qty*price-groups*offer-remainder*price)/100};
}

 note:x.note||''

async function loadOnline(force=false,background=false){
try{
// 手動重新整理等待既有請求結束，確保舊回應不會蓋掉新資料。
if(onlineLoadPromise){
  if(force){
    try{await onlineLoadPromise;}catch(_){}
    return loadOnline(true,background);
  }
  await onlineLoadPromise;
  return;
}
if(!force&&onlineLoadedAt&&Date.now()-onlineLoadedAt<ONLINE_CACHE_MS){
  return;
}
const request=(async()=>{
  const revision=onlineMutationRevision;
  const d=await api('online',{compact:'1',fresh:force?'1':'0'});
  if(revision!==onlineMutationRevision||pendingRestockRows.size)return;
  const headers=d.headers||[];
  const rows=d.format==='online-matrix-v1'
    ?(d.rows||[]).map((r,i)=>({row:r[0],data:Object.fromEntries(headers.map((h,i)=>[h,r[i+1]])),orderMergeKey:(d.mergeKeys||[])[i]||'',depositMergeKey:(d.mergeKeys||[])[i]||''}))
    :(d.rows||[]);
  onlineRows=rows;
  onlineHeaders=headers;
  onlineLoadedAt=Date.now();
  saveOnlineSessionCache();
  if(document.getElementById('onlineResult')){
    applyOnlineFilter();
  }
})();
onlineLoadPromise=request;
try{await request;}finally{
  if(onlineLoadPromise===request)onlineLoadPromise=null;
}
}catch(e){
const res=document.getElementById('onlineResult');
if(res&&!background){
  if(!onlineLoadedAt){
    res.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }else{
    alert('更新失敗，目前保留上次資料：'+e.message);
  }
}
}
}

const pendingFaceRows=new Map();
function isFaceToFace(row){
if(pendingFaceRows.has(Number(row.row)))return pendingFaceRows.get(Number(row.row));
const note=String(getOnlineData(row,['備註','備註欄'])||'');
return findHeader(onlineHeaders,['備註','備註欄'])?note.includes('面交'):getPaymentMethod(row)==='面交';
}
function syncFaceButtons(){
document.querySelectorAll('[data-face-rows]').forEach(button=>{
const ids=button.dataset.faceRows.split(',').map(Number);
const items=onlineRows.filter(row=>ids.includes(Number(row.row)));
button.classList.toggle('active',items.some(isFaceToFace));
button.disabled=ids.some(id=>pendingFaceRows.has(id));
button.setAttribute('aria-pressed',String(button.classList.contains('active')));
});
}
async function markFaceToFacePicked(input){
if(!input||!input.checked)return;
const sheetRow=Number(input.value);
if(!Number.isInteger(sheetRow)||sheetRow<2)return;
input.disabled=true;
try{
await api('setOnlineOpened',{rows:JSON.stringify([sheetRow])});
const header=findHeader(onlineHeaders,['已開單','開單']);
const row=onlineRows.find(item=>Number(item.row)===sheetRow);
if(row&&header)row.data[header]=true;
onlineLoadedAt=Date.now();saveOnlineSessionCache();
if(isFaceToFaceView)applyOnlineFilter();
}catch(e){
input.checked=false;
alert('取貨狀態更新失敗：'+e.message);
}finally{if(input.isConnected)input.disabled=false;}
}
async function toggleFaceToFace(button,rows){
const visibleRows=[...document.querySelectorAll('.shipCheck')].map(input=>Number(input.value));
rows=rows.map(Number);
if(rows.some(row=>pendingFaceRows.has(row)))return;
const enabled=!button.classList.contains('active');
rows.forEach(row=>pendingFaceRows.set(row,enabled));
button.classList.toggle('active',enabled);
button.disabled=true;
syncFaceButtons();
try{
await api('setOnlineFaceToFace',{
rows:JSON.stringify(rows),enabled:enabled?'true':'false'
});
const noteHeader=findHeader(onlineHeaders,['備註','備註欄']);
onlineRows.filter(row=>rows.includes(Number(row.row))).forEach(row=>{
if(noteHeader){
const current=String(row.data[noteHeader]||'').trim();
row.data[noteHeader]=enabled
?(current.includes('面交')?current:(current?current+'｜面交':'面交'))
:current.replace(/(^|｜)面交(?=｜|$)/,'').replace(/^｜|｜$/g,'');
}
});
onlineLoadedAt=Date.now();saveOnlineSessionCache();
}catch(e){
alert('面交設定失敗，已還原：'+e.message);
}finally{
rows.forEach(row=>pendingFaceRows.delete(row));
button.disabled=false;
if(isFaceToFaceView)applyOnlineFilter();
else if(visibleRows.length){
const visible=new Set(visibleRows);
showOrderCards(onlineRows.filter(row=>visible.has(Number(row.row))),onlineSummaryTitle());
}else syncFaceButtons();
}
}
const pendingReconcileRows=new Set();
async function toggleOnlineReconciled(button){
const meta=button.closest('.groupCardMeta');
if(!meta||button.disabled)return;
const rows=(meta.dataset.rows||'').split(',').map(Number).filter(row=>row>=2);
if(!rows.length||rows.some(row=>pendingReconcileRows.has(row)))return;
const enabled=!button.classList.contains('isDone');
rows.forEach(row=>pendingReconcileRows.add(row));
button.disabled=true;
button.textContent=enabled?'完成':'對帳';
button.classList.toggle('isDone',enabled);
try{
await api('setOnlineReconciled',{rows:JSON.stringify(rows),enabled:enabled?'true':'false'});
const header=findHeader(onlineHeaders,['對帳','已對帳']);
onlineRows.filter(row=>rows.includes(Number(row.row))).forEach(row=>{if(header)row.data[header]=enabled;});
onlineLoadedAt=Date.now();saveOnlineSessionCache();
}catch(e){
button.textContent=enabled?'對帳':'完成';
button.classList.toggle('isDone',!enabled);
alert('對帳狀態更新失敗：'+e.message);
}finally{
button.disabled=false;
rows.forEach(row=>pendingReconcileRows.delete(row));
}
}

.filter(Boolean);

});

const depositValue=meta.querySelector('.orderDepositInput')?.value||'';
onlineRows.filter(row=>rows.includes(Number(row.row))).forEach(row=>{if(paymentHeader)row.data[paymentHeader]=payment;if(last5Header)row.data[last5Header]=payment==='中信'?'中信'+last5:payment==='LB'?'LB '+last5:payment;if(depositHeader&&depositValue!=='')row.data[depositHeader]=depositValue;});

/* 複製目前這張訂單卡內的全部商品，不依賴勾選狀態。 */
async function copyShipText(button){
const card=button.closest('.shipOrderCard');
if(!card)return;
const customer=card.querySelector('.shipCardHead strong').textContent.trim();
const names=[...card.querySelectorAll('.shipItem')].map(item=>item.dataset.name||'');
const text=customer+'：'+names.join('+');
try{
if(navigator.clipboard&&navigator.clipboard.writeText){
try{await navigator.clipboard.writeText(text);alert('出貨文已複製');return;}catch(_){}
}
const ta=document.createElement('textarea');
ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();

async function toggleShipPacked(button){
if(button.disabled)return;
const card=button.closest('.shipOrderCard');
const previous=card.classList.contains('shipPacked');
const packed=!previous;
const update=value=>{
card.classList.toggle('shipPacked',value);
button.setAttribute('aria-pressed',String(value));
button.textContent=value?'已完成':'完成';
};
button.disabled=true;update(packed);
shipRevision++;shipPendingWrites++;
try{
const ids=card.dataset.rows.split(',').map(Number);
const result=await api('setShipPacked',{rows:JSON.stringify(ids),packed:String(packed)});
if(shipDataCache){
shipDataCache.rows.filter(row=>ids.includes(Number(row.row))).forEach(row=>{
row.data['已包貨']=packed;row.data['包貨完成時間']=result.completedAt||'';
});
if(!shipDataCache.headers.includes('已包貨'))shipDataCache.headers.push('已包貨');
}
shipLoadedAt=0;
}catch(e){update(previous);alert('包貨狀態儲存失敗，已還原：'+e.message);}
finally{button.disabled=false;shipPendingWrites--;}
}

/* =========================================================
   啟動
========================================================= */
function startApp(){
if(appStarted)return;
appStarted=true;
document.body.classList.add('isAuthenticated');
detectSalesperson();
const savedTab=sessionStorage.getItem('jiwu_current_tab')||'store';
const targetBtn=document.getElementById('btn-'+savedTab)||document.getElementById('btn-store');
tab(savedTab,targetBtn);
if(savedTab!=='online')setTimeout(()=>loadOnline(false,true),0);
}
function showLogin(){
authToken='';
appStarted=false;
sessionStorage.removeItem(AUTH_TOKEN_KEY);
document.body.classList.remove('isAuthenticated');
const input=document.getElementById('loginPassword');
const error=document.getElementById('loginError');
if(error)error.textContent='登入已失效，請重新登入';
if(input)setTimeout(()=>input.focus(),0);
}
function warmAuth(){
if(authToken||authWarmupPromise)return authWarmupPromise;
authWarmupPromise=api('authWarmup').catch(()=>null).finally(()=>{authWarmupPromise=null;});
return authWarmupPromise;
}
async function login(event){
event.preventDefault();
const input=document.getElementById('loginPassword');
const error=document.getElementById('loginError');
input.disabled=true;
error.textContent='驗證中…';
try{
const result=await api('authLogin',{password:input.value});
authToken=result.token;
sessionStorage.setItem(AUTH_TOKEN_KEY,authToken);
input.value='';
error.textContent='';
startApp();
}catch(e){
authToken='';
sessionStorage.removeItem(AUTH_TOKEN_KEY);
error.textContent=e.message==='密碼錯誤'?'密碼錯誤，請重新輸入':e.message;
input.select();
}finally{input.disabled=false;input.focus();}
}
async function restoreLogin(){
if(!authToken)return;
try{
await api('authCheck');
startApp();
}catch(_){
authToken='';
sessionStorage.removeItem(AUTH_TOKEN_KEY);
}
}
if(!authToken)setTimeout(warmAuth,0);
restoreLogin();
</script>
