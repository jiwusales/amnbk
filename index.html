<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JIWU吉物躺著賺後台</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#f3f3f3;
--card:#fff;
--soft:#f7f7f7;
--soft2:#eee;
--border:#e2e2e2;
--text:#555;
--muted:#999;
--main:#A68C73;
--main2:#A68C73;
--green:#8fa98b;
--red:#c9827d;
--blue:#8ca7b2
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden
}
body{
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
input[type=number]{
appearance:textfield;
-moz-appearance:textfield
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
-webkit-appearance:none;
margin:0
}
.top{
position:relative;
height:58px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:800;
color:#555
}
.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:62px;
background:rgba(255,255,255,.97);
display:flex;
border-top:1px solid var(--border);
z-index:1000
}
.nav button,
.nav a{
flex:1;
border:0;
background:none;
color:#999;
font-weight:700;
font-size:16px
}
.nav a{
display:flex;
align-items:center;
justify-content:center;
text-decoration:none
}
.nav button.active{
color:var(--main);
background:transparent;
box-shadow:inset 0 3px 0 var(--main)
}
.page{
width:100%;
max-width:1700px;
height:calc(100dvh - 120px);
margin:auto;
padding:14px
}
.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap
}
input,select{
border:1px solid #ddd;
background:#fff;
color:var(--text);
border-radius:9px;
padding:9px 11px;
outline:none
}
input:focus,select:focus{
border-color:#aaa
}
.btn{
border:0;
border-radius:9px;
padding:9px 14px;
background:var(--main);
color:#fff;
font-weight:700
}
.btn.light{
background:#e9e9e9;
color:#666
}
.btn.green{
background:var(--green)
}
.btn.red{
background:var(--red)
}
.mobileShortcut{
display:none
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
box-shadow:0 2px 9px rgba(0,0,0,.035);
overflow:hidden
}
.cardHead{
min-height:46px;
padding:11px 15px;
background:#f8f8f8;
border-bottom:1px solid var(--border);
font-weight:700;
display:flex;
justify-content:space-between;
align-items:center
}
.empty,.loading{
text-align:center;
padding:30px;
color:#aaa
}
.total{
font-size:25px;
font-weight:800
}
.tag{
display:inline-block;
padding:4px 8px;
border-radius:6px;
background:#eee;
color:#666;
font-size:12px;
font-weight:700
}
.tag.green{
background:#e0e9dd;
color:#62745d
}
.tag.red{
background:#f2dddd;
color:#9a625d
}
.tag.blue{
background:#e1e9ed;
color:#627983
}
.check{
width:17px;
height:17px;
accent-color:var(--main)
}
.customerLink,
.groupLink{
border:0;
background:none;
padding:0;
color:#A68C73;
font-weight:400;
text-decoration:none;
text-align:left
}
.customerLink{
font-size:13px
}
.groupLink{
font-size:14px
}
.tableWrap{
width:100%;
overflow:auto
}
table{
border-collapse:collapse;
width:100%;
table-layout:fixed
}
th,td{
padding:8px 7px;
border-bottom:1px solid #eee;
text-align:left;
vertical-align:middle;
word-break:break-word;
overflow-wrap:anywhere
}
th{
background:#f5f5f5;
color:#777;
font-weight:700
}
tr:hover td{
background:#fafafa
}
/* 店面 */
.storePage{
height:100%;
display:grid;
grid-template-columns:minmax(0,1.5fr) minmax(320px,.75fr);
grid-template-rows:auto minmax(0,1fr);
gap:12px
}
.storeManual{
grid-column:1;
grid-row:1
}
.storeMain{
min-height:0;
display:flex;
flex-direction:column;
grid-column:1;
grid-row:2
}
.storeCheckout{
min-height:0;
display:flex;
flex-direction:column;
grid-column:2;
grid-row:1/3
}
.storeMainBody{
padding:12px;
min-height:0;
display:flex;
flex-direction:column
}
.storeSearch{
display:flex;
gap:6px;
flex-shrink:0
}
.storeSearch input{
flex:1;
min-width:0
}
.cart{
flex:1;
min-height:0;
overflow-y:auto;
margin-top:8px;
padding-right:3px
}
.cartItem{
display:flex;
align-items:center;
gap:10px;
padding:9px 2px;
border-bottom:1px solid #eee
}
.cartName{
flex:1;
min-width:0
}
.cartSub{
color:#999;
font-size:12px;
margin-top:3px
}
.qty{
display:flex;
align-items:center;
gap:5px;
flex-shrink:0
}
.qty button{
width:28px;
height:28px;
border:0;
border-radius:6px;
background:#eee;
color:#666
}
.cartItem .removeCartButton{
background:#E78790!important;
color:#fff!important
}
.manualBox{
display:grid;
grid-template-columns:1fr 130px auto;
gap:8px;
padding:10px
}
.checkoutBody{
padding:14px;
min-height:0;
overflow:auto
}
.salesperson{
display:flex;
gap:7px
}
.salesperson button{
flex:1;
border:1px solid #ddd;
background:#fff;
color:#777;
border-radius:8px;
padding:8px
}
.salesperson button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.payment{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px
}
.payment button{
border:1px solid #ddd;
background:#fff;
color:#666;
border-radius:8px;
padding:8px 4px
}
.payment button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.checkoutTotalRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
min-height:32px
}
.checkoutTotalRow .total{min-width:0}
.changeText{
margin-top:0;
text-align:right;
white-space:nowrap;
font-size:16px;
font-weight:700
}
.checkoutActions{
margin-top:12px;
display:grid;
grid-template-columns:4fr 1fr;
gap:7px
}
.checkoutActions .btn.green,
.checkoutActions .acButton{width:100%;height:44px}
.acButton{
display:block;
background:#E78790!important
}
.checkoutQuick{
display:flex;
gap:7px;
align-items:stretch
}
.checkoutQuick input{min-width:0;flex:1}
.checkoutQuick .salesperson{flex:1;min-width:0}
.storeAddIcon{display:none}
/* 線上 */
.onlinePage{
height:100%;
display:flex;
flex-direction:column;
gap:10px
}
.onlineToolbar{
flex-shrink:0;
display:flex;
gap:8px
}
.onlineToolbar input,
.onlineToolbar select,
.onlineToolbar button{height:44px}
.onlineToolbar input{
flex:1;
min-width:0
}
.onlineResult{
min-height:0;
flex:1;
overflow:auto
}
.onlineTable{
min-width:900px
}
.onlineTable th:nth-child(1){width:5%}
.onlineTable th:nth-child(2){width:12%}
.onlineTable th:nth-child(3){width:9%}
.onlineTable th:nth-child(4){width:9%}
.onlineTable th:nth-child(5){width:20%}
.onlineTable th:nth-child(6){width:20%}
.onlineTable th:nth-child(7){width:8%}
.onlineTable th:nth-child(8){width:8%}
.onlineTable th:nth-child(9){width:8%}
.onlineTable th:nth-child(10){width:8%}
.groupSummary{
font-size:16px;
font-weight:400
}
.faceOrderHead{background:var(--green);color:#fff}
.faceOrderSection{margin:12px 0}
.faceOrderHead.faceStockHead{background:#D9C0FA}
.faceOrderHead.facePreorderHead{background:#FDD365}
.faceOrderHead.faceCargoHead{background:#9BB4A8}
.faceOrderHead.faceRestockHead{background:#7E88A0}
.groupCards{
padding:12px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
align-items:stretch
}
.groupCard{
height:240px;
min-width:0;
border:1px solid var(--border);
border-radius:12px;
background:#fff;
overflow:hidden;
display:flex;
flex-direction:column
}
.groupCardCustomer{
padding:10px 13px;
background:#f7f7f7;
border-bottom:1px solid #eee;
flex-shrink:0;
font-size:14px;
display:flex;
justify-content:flex-start;
gap:8px;
align-items:center
}
.groupCardCustomer .groupCardTotal{margin-left:auto}
.groupCardItems{
flex:1;
min-height:0;
overflow-y:auto;
padding:3px 13px
}
.groupCardItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:7px 0;
border-bottom:1px solid #f0f0f0;
font-size:13px
}
.groupCardItem.opened{background:#f1f1f1}
.groupCardItem .check{flex-shrink:0}
.groupCardItem:last-child{
border-bottom:0
}
.groupCardItemName{
flex:1;
min-width:0;
word-break:break-word
}
.groupCardItemPrice{
white-space:nowrap
}
.orderItemDate{white-space:nowrap}
.groupCardBottom{
padding:9px 13px;
border-top:1px solid #eee;
display:flex;
justify-content:space-between;
gap:10px;
font-size:12px;
color:#888;
flex-shrink:0
}
.groupCardBottom strong{
color:#555;
font-size:13px
}
.groupCardMeta{
padding:7px 13px;
border-top:1px solid #eee;
display:flex;
justify-content:flex-start;
align-items:center;
gap:8px;
font-size:12px;
color:#777;
flex-shrink:0
}
.groupCardMeta{container-type:inline-size;container-name:orderMeta}
.orderDeposit{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.orderDepositLabel{white-space:nowrap}
.orderDepositInput::placeholder{color:transparent}
@container orderMeta (max-width:520px){
.orderDeposit.hasDepositInput .orderDepositLabel{display:none}
.orderDeposit.hasDepositInput .orderDepositInput::placeholder{color:#999;opacity:1}
}
.groupCardMeta>*:first-child{margin-right:auto}
.orderMetaDate.isHidden{display:none}
.reconcileButton{padding:4px 9px;font-size:12px;white-space:nowrap}
.reconcileButton.isDone{background:#FFBCD5;color:#fff}
.groupCardMeta input{
width:66px;
padding:4px 6px;
border-radius:6px;
font-size:12px;
text-align:center
}
.orderLast5{white-space:nowrap}
.orderLast5 input:disabled{background:#f2f2f2;color:#aaa}
.groupCardTotal{white-space:nowrap;color:#555;font-size:13px}
.faceToFaceTag,.faceToggle{
border:1px dashed #CBC3BC;
border-radius:5px;
padding:2px 5px;
font-size:10px;
background:transparent;
color:#CBC3BC
}
.faceToFaceTag.active,.faceToggle.active{
background:var(--green);
color:#fff;
border-color:var(--green)
}
.orderPayment{
width:62px;
padding:4px 3px;
border-radius:6px;
font-size:12px
}
.onlineIconButton{
width:42px;
min-width:42px;
padding:0;
background-repeat:no-repeat!important;
background-position:center!important;
background-size:50%!important;
color:transparent!important
}
.onlineSearchButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922205838_23cab617.png')!important}
.onlineRefreshButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922204703_5dd34c41.png')!important}
.cargoTag{
width:18px;
height:18px;
padding:0!important;
border-radius:4px!important;
font-size:11px!important;
line-height:18px;
text-align:center;
color:#fff!important;
flex-shrink:0
}
/* 出貨 */
.shipPage{
height:100%;
overflow:auto
}
.shipItem{
padding:10px 15px;
border-top:1px solid #eee;
display:flex;
gap:12px;
align-items:center
}
.shipCardHead{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.shipCardHead strong{margin-right:auto}
.shipCopyButton{
width:1.2em;height:1.2em;min-width:1.2em;padding:0;
font-size:inherit;line-height:1;flex-shrink:0;border-radius:0;
background:transparent!important
}
.shipCopyButton img{display:block;width:100%;height:100%;object-fit:contain}
.shipPacked,.shipPacked .cardHead,.shipPacked .shipItem,.shipPacked .shipCardTotals{
background:#ededed
}
.shipPacked .shipProductName,.shipPacked .shipProductPrice,.shipPacked .shipCardTotals strong{color:#999}
.shipCompleteButton{padding:4px 10px;font-size:12px}
.shipCompleteButton[aria-pressed="true"]{background:#b9b9b9}
.shipOrderDate{width:48px;flex-shrink:0;color:#777}
.shipProductName{flex:1;min-width:0}
.shipProductPrice{white-space:nowrap}
.shipCardTotals{
display:flex;
gap:12px;
align-items:center;
justify-content:flex-end;
padding:10px 15px;
border-top:1px solid #eee;
font-size:13px;
flex-wrap:wrap
}
.shipCardTotals strong{color:#E24C60;font-size:15px}
.shipSummary{
margin-bottom:10px
}
.shipSelected{
padding:12px
}
.shipSelectedRow{
display:flex;
justify-content:space-between;
gap:10px;
padding:7px 0;
border-bottom:1px solid #eee
}
.shipSelectedName{
flex:1;
min-width:0
}
.shipSelectedPrice{
white-space:nowrap
}
.shipTotalBox{
padding:12px;
background:#fafafa;
border-top:1px solid #eee
}
.shipTotalLine{
display:flex;
justify-content:space-between;
padding:3px 0
}
.shipBalance{
font-size:20px;
font-weight:800;
margin-top:5px
}
.topActions{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
display:flex;
align-items:center;
gap:6px
}
.topActions .btn{
height:26px;
min-height:0;
padding:2px 9px;
font-size:13px;
line-height:20px;
border-radius:6px
}
.topHomeButton,.topFaceButton,.topRefreshButton,.topStoreToggle{display:none}
.topHomeButton{background:#E78790!important;color:#fff!important}
.topFaceButton{background:var(--green)!important;color:#fff!important}
body[data-page="store"] .topStoreToggle{display:block}
body[data-page="online"] .topHomeButton,body[data-page="online"] .topFaceButton{display:inline-flex;align-items:center}
body[data-page="ship"] .topRefreshButton{display:block}
.topActions .topRefreshButton{
width:26px;
min-width:26px;
padding:0;
background-size:75%!important
}
.storeSalesPage{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.storeSalesToolbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.storeSalesToolbar input{flex:1;min-width:0}
.storeSalesToolbar button{height:38px;flex-shrink:0}
.storeSalesToolbar>strong{margin-right:auto}
#storeSalesResult{flex:1;min-height:0;overflow:auto}
.salesDayCard{margin-bottom:12px}
.salesDayCard summary{cursor:pointer;padding:12px;list-style:none}
.salesDayCard summary::-webkit-details-marker{display:none}
.salesDayHeading{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.salesDayTotals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.salesDayTotals>span{padding:0 10px;text-align:center;border-right:1px solid #ddd;font-size:13px}
.salesDayTotals>span:first-child{padding-left:0}
.salesDayTotals>span:last-child{border:0;padding-right:0}
.salesDayTotals b{display:block;font-size:18px;margin-top:4px}
.salesHint{font-size:12px;color:#888;margin:6px 0 10px}
.salesDetailRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #eee}
.salesTime{font-size:12px;color:#999;flex:0 0 38px;width:38px;white-space:nowrap;font-variant-numeric:tabular-nums}
.salesProduct{flex:1;min-width:0;overflow-wrap:anywhere}
.salesProduct small{display:block;color:#999;font-size:12px;margin-top:4px}
.salesDayCard{margin-bottom:0}
.salesCards{padding:0}
.salesCount{margin-left:auto;color:#999;font-size:12px}
.salesPurchase{border-bottom:1px solid #eee;padding:5px 0}
.salesPurchase:last-child{border-bottom:0}
.salesPurchaseMeta{display:flex;gap:8px;color:#999;font-size:11px;padding:2px 0}
.salesPurchaseMeta>span:last-child{margin-left:auto}
.salesDetailRow{padding:5px 0;border:0;font-size:13px;min-height:30px}
.salesFooter{display:block;padding:8px 10px}
.salesFooter .salesDayTotals{width:100%;font-size:11px}
.salesFooter .salesDayTotals>span{font-size:11px;padding:0 5px}
.salesFooter .salesDayTotals b{font-size:14px}
.salesCash{color:#F8C043!important}
.salesFooter .salesHint{margin:5px 0 0}
#storeSalesResult{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#storeSalesResult>.salesHint{flex-shrink:0}
.salesCards{flex:1;min-height:0;height:100%;overflow:auto;align-content:start}
.salesCards.salesSingle{display:flex;flex-direction:column;overflow:hidden}
.salesCards.salesSingle>.salesDayCard{flex:1;min-height:0;height:auto;max-height:none}
.salesCards.salesSingle .salesDayItems{flex:1;min-height:0;overflow-y:auto}
.salesCards.salesMulti{grid-auto-rows:calc((100% - 12px)/2)}
.salesCards .salesDayCard{height:100%;min-height:0;max-height:none}
.salesDayCard .groupCardCustomer{flex-wrap:wrap;gap:5px 8px}
.salesOther{font-size:11px;color:#999;font-weight:400}
.rainToggle{border:0;background:transparent;padding:0;margin-left:4px;font-size:19px;line-height:1;color:#E1DCE0;cursor:pointer}
.rainToggle[aria-pressed="true"]{color:#556890}
.shipDateCount{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.shipDateCount i{font-style:normal;color:#aaa}
.salesPurchase{border-bottom:1px solid #ddd;padding:0}
.salesPurchase .salesDetailRow{display:flex;gap:10px;padding:3px 0;min-height:24px;line-height:18px;border:0;align-items:center}
.salesPurchase .salesDetailRow>b{color:var(--text);white-space:nowrap;font-weight:400}
.salesFooter .salesCash{color:#F8C043!important}
.salesProductCode{margin-left:8px;font-size:12px;color:#999;font-weight:400;overflow-wrap:anywhere}
.salesPurchaseInfo{display:flex;flex-wrap:wrap;gap:8px;color:#999;font-size:12px;padding:0 0 9px;font-weight:700}
.salesPurchaseInfo .salesCodeCTBC{color:#88CDB2}
.salesPurchaseInfo .salesCodeLB{color:#8ECEE2}
.salesPurchaseInfo.salesBankCTBC{gap:0}
/* 手機 */
@media(max-width:850px){
html,body{
overflow:hidden
}
.top{
height:52px;
font-size:20px;
justify-content:flex-start;
padding-left:12px
}
.top>span{
font-size:clamp(14px,4vw,18px);
max-width:calc(100% - 86px);
white-space:nowrap
}
body[data-page="online"] .top>span{max-width:calc(100% - 190px)}
.page{
height:calc(100dvh - 102px);
padding:8px
}
.nav{
height:50px
}
.nav button,
.nav a{
font-size:13px
}
.storePage{
grid-template-columns:1fr;
grid-template-rows:auto minmax(210px,1fr) auto;
gap:8px;
overflow:hidden
}
.storeManual,
.storeMain,
.storeCheckout{
grid-column:auto;
grid-row:auto
}
.storeManual .cardHead,
.storeMain .cardHead,
.storeCheckout .cardHead{display:none}
.storeMain{min-height:210px}
.storeMainBody{min-height:210px;padding:8px}
.cart{flex:1;min-height:0;overflow-y:auto}
.manualBox{
grid-template-columns:minmax(0,1fr) 85px 58px;
gap:6px;
padding:8px
}
.manualBox input{min-width:0;width:100%}
.manualBox button{grid-column:auto;padding:9px 6px}
.checkoutActions{
display:grid;
grid-template-columns:4fr 1fr;
gap:7px
}
.checkoutActions .btn.green,
.checkoutActions .acButton{width:100%;height:34px;padding:4px 10px}
.acButton{
display:block;
background:#E78790!important
}
.storeSearch{
display:grid;
grid-template-columns:minmax(0,3fr) repeat(2,minmax(0,1fr));
gap:6px;
align-items:stretch
}
.storeSearch input{
min-width:0;
width:100%
}
.storeSearch>.btn{
min-width:0;
width:100%;
padding:10px 0;
font-size:18px
}
.storeSearch .storeAddText{display:none}
.storeSearch .storeAddIcon{display:inline}
.mobileShortcut{
display:inline-block
}
.payment{
grid-template-columns:repeat(5,1fr)
}
.payment button{
font-size:12px;
padding:7px 2px
}
.checkoutBody{padding:8px;overflow:visible}
.checkoutActions{margin-top:8px}
.storeCheckout [style*="margin-top:12px"]{margin-top:8px!important}
.checkoutQuick{
display:grid;
grid-template-columns:minmax(0,1fr)
}
.checkoutQuick .salesperson{gap:5px}
.salesperson button{padding:8px 3px}
.onlineToolbar{
flex-wrap:nowrap;

/* =========================================================
   API
========================================================= */
function api(action,params={}){
const retryable=[
'storeProduct',
'storeActiveSalesperson',
'online',
'onlineCustomer',
'group',
'ship',
'saveOnlinePayment',
'setOnlineFaceToFace'
].includes(action);
return new Promise((resolve,reject)=>{
let attempt=0;
let done=false;
const run=()=>{
attempt++;
const cb=
'cb_'+
Date.now()+
'_'+
Math.random().toString(36).slice(2);
const s=document.createElement('script');
let timer=null;
const cleanup=()=>{
if(timer)clearTimeout(timer);
delete window[cb];
if(s.parentNode){
s.parentNode.removeChild(s);
}
};
window[cb]=data=>{
if(done)return;
done=true;
cleanup();
if(data&&data.ok===false){
reject(
new Error(
data.error||'GAS 錯誤'
)
);
return;
}
resolve(data);
};
s.onerror=()=>{
cleanup();
if(retryable&&attempt<2){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('無法連線 GAS')
);
}
};
const q=new URLSearchParams({
action,
callback:cb,
_t:Date.now(),
...params
});
s.src=
API_URL+
'?'+
q.toString();
s.async=true;
(document.head||document.body)
.appendChild(s);
timer=setTimeout(()=>{
cleanup();
if(retryable&&attempt<2){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('GAS 連線逾時')
);
}
},15000);
};
run();
});
}
/* =========================================================
   基本

function esc(v){
return String(v??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'",'&#39;')
}
function money(v){
return numberValue(v).toLocaleString()
}
function numberValue(v){
const n=typeof v==='number'
?v
:Number(String(v??'').replace(/,/g,''));
return Number.isFinite(n)?n:0
}
function findHeader(headers,names){
for(const n of names){
const i=headers.indexOf(n);
if(i>=0)return headers[i];
}
return null
}
function getOnlineData(row,names){
const h=findHeader(
onlineHeaders,
names
);
return h?row.data[h]:''
}
function formatOnlineTime(v){
if(!v)return '';
const s=String(v).trim();
let m=s.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[2]).padStart(2,'0')+
'/'+
String(m[3]).padStart(2,'0')
}
m=s.match(
/(\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[1]).padStart(2,'0')+
'/'+
String(m[2]).padStart(2,'0')
}
return s
}
function timeValue(v){
if(!v)return 0;
const s=String(v).trim();
let m=s.match(
/(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
+m[1],
+m[2]-1,
+m[3],
+m[4],
+(m[5]||0)
).getTime()
}
m=s.match(
/(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2],
+(m[3]||0),
+(m[4]||0)
).getTime()
}
m=s.match(
/(\d{1,2})\/(\d{1,2})/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2]
).getTime()
}
return 0
}

return JSON.stringify(items.map(x=>({code:String(x.code||''),name:String(x.name||''),price:Number(x.price||0),qty:Number(x.qty||1),manual:!!x.manual})));

/*
 * 從 GAS 取得共用購物車
 */
async function loadStoreCart(){
if(!salesperson){
storeCart=[];
renderCart();
return;
}
if(storeCartLoading||cartPendingWrites||cartUnsaved||cartOperationBusy)return;
const requestUser=salesperson;
const requestRevision=cartRevision;
storeCartLoading=true;
try{
const d=await api(
'storeCart',
{salesperson:requestUser}
);
if(requestUser!==salesperson||requestRevision!==cartRevision||cartPendingWrites||cartUnsaved||cartOperationBusy)return;
const nextCart=Array.isArray(d.cart)?d.cart:[];
if(cartContentsKey(nextCart)!==cartContentsKey(storeCart)){
storeCart=nextCart;
renderCart();
}
}catch(e){
console.error('讀取購物車失敗',e);
}finally{
storeCartLoading=false;
if(requestUser!==salesperson&&salesperson)loadStoreCart();
}
}
/*
 * 將目前商品清單同步到 GAS
 */
async function saveStoreCart(){
if(!salesperson)return;
const user=salesperson;
const revision=++cartRevision;
const items=JSON.stringify(storeCart.map(x=>({code:x.code||'',name:x.name||'',price:Number(x.price||0),qty:Number(x.qty||1),manual:!!x.manual})));
cartPendingWrites++;
cartUnsaved=true;
const request=cartWriteQueue.then(()=>api('storeCartSet',{salesperson:user,items}));
cartWriteQueue=request.catch(()=>{});
try{
await request;
if(revision===cartRevision)cartUnsaved=false;
}catch(e){
alert('購物車尚未儲存，暫停背景同步以保留你的修改。請確認網路後再修改商品重試：'+e.message);
}finally{cartPendingWrites--;}
}

function toHalfWidthDigits(value){return String(value==null?'':value).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));}

if(value!==before){input.value=value;if(start!=null)input.setSelectionRange(start+(value.length-before.length),start+(value.length-before.length));}
return value;
}

async function updateSalesAfterCheckout(delta){

const known=new Set(day.items.map(item=>item.row));
delta.items.forEach(item=>{if(known.has(item.row))return;day.items.push(item);day.total+=item.amount;if(item.payment==='💰'||item.payment==='現金')day.cash+=item.amount;else if(/^(中信|LB|LP|IPASS|轉帳|匯款)/i.test(item.payment||''))day.transfer+=item.amount;else day.other+=item.amount;});

function renderSalesPurchase(items){
const payment=String(items.find(item=>item.payment)?.payment||'').trim();
const bank=payment.match(/^(中信|LB)/i);
const cash=payment==='💰'||payment==='現金';
const method=bank?(bank[1].toUpperCase()==='LB'?'LB':'中信'):(payment||'未填付款方式');
const code=bank?(payment.match(/(\d{5})\s*$/)?.[1]||''):'';
const codeClass=bank?(bank[1].toUpperCase()==='LB'?'salesCodeLB':'salesCodeCTBC'):'';
const paymentClass=codeClass;
const paymentInfoClass=bank?(bank[1].toUpperCase()==='LB'?'salesBankLB':'salesBankCTBC'):'';
return `<div class="salesPurchase" data-sale-key="${esc(items.map(item=>item.row).join(','))}">${items.map(item=>`<div class="salesDetailRow"><span class="salesTime">${esc(item.time||'—')}</span><div class="salesProduct"><strong>${esc(item.name||'未填商品名稱')}</strong>${item.code?`<span class="salesProductCode">${esc(item.code)}</span>`:''}</div><b>$${money(item.amount)}${cash?' <span class="salesCashSymbol">💰</span>':''}</b></div>`).join('')}${cash?'':`<div class="salesPurchaseInfo ${paymentInfoClass}"><span class="${paymentClass}">${esc(method)}</span>${code?`<span class="${codeClass}">${esc(code)}</span>`:''}</div>`}</div>`;
}
function drawStoreSales(target=null){
const result=target||document.getElementById('storeSalesResult');
if(!result||!storeSalesData)return;
if(storeSalesDate===null)storeSalesDate=storeSalesData.today.slice(5).replace('-','');
const input=document.getElementById('storeSalesDate');
if(input&&input.value!==(storeSalesDate||''))input.value=storeSalesDate||'';
const query=(storeSalesDate||'').trim();
const year=storeSalesData.today.slice(0,4);
let days=[...(storeSalesData.days||[])].sort((a,b)=>a.date.localeCompare(b.date));
if(query){
if(!/^(\d{2}|\d{4})$/.test(query)){result.innerHTML='<div class="empty">輸入兩碼月份或四碼日期，例如 09、0911</div>';return;}
const month=Number(query.slice(0,2));
const day=query.length===4?Number(query.slice(2)):0;
const lastDay=new Date(Number(year),month,0).getDate();
if(month<1||month>12||(query.length===4&&(day<1||day>lastDay))){result.innerHTML='<div class="empty">請輸入有效的月份或日期</div>';return;}
days=days.filter(d=>d.date.startsWith(year+'-')&&(query.length===2?d.date.slice(5,7)===query:d.date.slice(5).replace('-','')===query));
if(!days.length&&query.length===4)days=[{date:year+'-'+query.slice(0,2)+'-'+query.slice(2),total:0,cash:0,transfer:0,other:0,items:[]}];
}
const deploymentWarning=storeSalesData.schema==='store-sales-v2'?'':'<p class="salesHint">目前後端尚未提供合併付款分組，請更新 Code.gs 並將網頁應用程式部署為新版本，再重新整理。</p>';
const warning=storeSalesData.undated?`<p class="salesHint">${storeSalesData.undated} 筆資料缺少可辨識的日期，未列入統計。</p>`:'';
result.innerHTML=deploymentWarning+warning+(days.length?'<div class="groupCards salesCards '+(query.length===4?'salesSingle':'salesMulti')+'">'+days.map(day=>{
const orders=new Map();
[...day.items].sort((a,b)=>a.time.localeCompare(b.time)||a.row-b.row).forEach(item=>{
const key=item.orderId||'row-'+item.row;
if(!orders.has(key))orders.set(key,[]);
orders.get(key).push(item);
});
return `<div class="groupCard salesDayCard" data-sales-date="${esc(day.date)}">
<div class="groupCardCustomer"><strong>${esc(day.date.slice(5).replace('-','/'))}</strong><button type="button" class="rainToggle" data-rain-date="${esc(day.date)}" aria-label="切換${esc(day.date)}下雨標記" aria-pressed="${isRainyDay(day.date)}" onclick="toggleRainDay('${esc(day.date)}')">⛆</button>${day.other?`<span class="salesOther">其他／未填：$${money(day.other)}（已含於總金額）</span>`:''}<span class="salesCount">${day.items.length} 筆商品</span></div>
<div class="groupCardItems salesDayItems">${orders.size?[...orders.values()].map(renderSalesPurchase).join(''):'<div class="empty">當日尚無銷售紀錄</div>'}</div>
<div class="groupCardMeta salesFooter"><div class="salesDayTotals"><span>總金額 <b>$${money(day.total)}</b></span><span>現金 <b class="salesCash">$${money(day.cash)}</b></span><span>轉帳 <b>$${money(day.transfer)}</b></span></div></div>
</div>`;
}).join('')+'</div>':'<div class="empty">沒有符合的銷售紀錄</div>');
}

const input=document.getElementById('barcode');
const code=input.value.trim();

input.focus();
return;
}
if(!salesperson){
alert('請先選擇銷售員');
return;
}
cartOperationBusy=true;
cartRevision++;
try{

barcode:code,
salesperson
});

input.focus();

function renderCart(){
const count=document.getElementById('storeCartCount');
if(count)count.textContent=storeCart.length+' 項';
const box=document.getElementById('storeCart');
if(!box)return;
if(!storeCart.length){
box.innerHTML='<div class="empty">尚未加入商品</div>';
const total=document.getElementById('storeTotal');
if(total)total.textContent='$0';
calcChange();
return
}
box.innerHTML=storeCart.map((x,i)=>`
<div class="cartItem">
<button class="btn removeCartButton" style="padding:4px 8px" onclick="removeCart(${i})" aria-label="刪除商品">×</button>
<div class="cartName">
<b>${esc(x.name)}</b>
<div class="cartSub">
${x.manual?'手動商品':esc(x.code)}
$${money(x.price)}
</div>
</div>
<div class="qty">
<button onclick="changeQty(${i},-1)">−</button>
<b>${x.qty}</b>
<button onclick="changeQty(${i},1)">＋</button>

</div>
</div>
`).join('');
const total=storeCart.reduce((s,x)=>s+x.price*x.qty,0);
const totalEl=document.getElementById('storeTotal');

calcChange()
}
async function changeQty(i,n){
if(cartOperationBusy)return;
if(!storeCart[i])return;
storeCart[i].qty+=n;
if(storeCart[i].qty<=0)storeCart.splice(i,1);
renderCart();
await saveStoreCart();
}
async function removeCart(i){
if(cartOperationBusy)return;
storeCart.splice(i,1);
renderCart();
await saveStoreCart();
}
function calcChange(){
const total=storeCart.reduce((s,x)=>s+x.price*x.qty,0);
const receivedEl=document.getElementById('received');
const el=document.getElementById('changeText');
if(!receivedEl||!el)return;
const value=receivedEl.value;
if(value===''){
el.textContent='';
return
}
const change=Number(value)-total;
el.textContent=
change>=0
?'找零：$'+money(change)
:'尚差：$'+money(Math.abs(change))
}
function setPayment(el,v){
payment=v;
document.querySelectorAll('.payment button').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
const box=document.getElementById('last5Box');
const input=document.getElementById('last5');
if(v==='中信'||v==='LB'){
box.style.display='block';
input.focus();

async function clearStoreCart(){
if(cartPendingWrites||cartUnsaved||cartOperationBusy){alert('請先等購物車儲存完成，再清空');return;}
if(!storeCart.length)return;
if(!confirm('確定清空全部商品？'))return;
cartOperationBusy=true;
cartRevision++;
try{
if(salesperson)await api('storeCartClear',{salesperson});
storeCart=[];
payment='';
renderStore();
}catch(e){
alert(e.message)
}finally{cartOperationBusy=false;cartRevision++;}
}
async function checkout(){
if(cartPendingWrites||cartUnsaved||cartOperationBusy){alert('請先等購物車儲存完成，再結帳');return;}
if(!storeCart.length){
alert('沒有商品');
return
}
if(!salesperson){
alert('請選擇銷售員');
return
}
if(!payment){
alert('請選擇付款方式');
return
}
const total=storeCart.reduce((s,x)=>s+x.price*x.qty,0);
const receivedInput=normalizeMoneyInput(document.getElementById('received'));
const received=receivedInput===''?'':Number(receivedInput);
const change=received===''?'':received-total;
let paymentValue=payment;
let note='';
if(payment==='中信'||payment==='LB'){
const last5Input=document.getElementById('last5');
last5Input.value=toHalfWidthDigits(last5Input.value);
const last5=last5Input.value.trim();
if(!/^\d{5}$/.test(last5)){
alert('請輸入 5 碼後五碼');
return
}
paymentValue=
payment==='中信'
?'中信'+last5
:'LB '+last5;
}else{
note=document.getElementById('storeNote').value.trim();
}
if(received!==''&&change<0&&!confirm('收到金額不足，仍要結帳嗎？')){
return
}
cartOperationBusy=true;
cartRevision++;
const checkoutButton=document.getElementById('storeCheckoutButton');
if(checkoutButton){checkoutButton.disabled=true;checkoutButton.textContent='記錄中⋯';}
try{
const d=await api(
'storeCheckout',
{
items:JSON.stringify(
storeCart.map(x=>({
code:x.code||'',
name:x.name||'',
price:Number(x.price||0),
qty:Number(x.qty||1),
manual:!!x.manual
}))
),
total,
received,
change,
payment:paymentValue,
note,
salesperson
}
);
alert(
'結帳完成'
);
storeCart=[];
payment='';
['received','last5','storeNote','barcode'].forEach(id=>{const input=document.getElementById(id);if(input)input.value='';});
const last5Box=document.getElementById('last5Box');
if(last5Box)last5Box.style.display='none';
document.querySelectorAll('.payment button').forEach(button=>button.classList.remove('active'));
renderCart();
// 已確認結帳成功；右側只加入新增紀錄，更新失敗不重送結帳。
updateSalesAfterCheckout(d.salesDelta);
const input=document.getElementById('barcode');
if(input)input.focus();
}catch(e){
alert(e.message)
}finally{
cartOperationBusy=false;cartRevision++;
if(checkoutButton){checkoutButton.disabled=false;checkoutButton.textContent='結帳';}
}
}

async function loadOnline(force=false,background=false){
try{
// 手動重新整理等待既有請求結束，確保舊回應不會蓋掉新資料。
if(onlineLoadPromise){
  if(force){
    try{await onlineLoadPromise;}catch(_){}
    return loadOnline(true,background);
  }
  await onlineLoadPromise;
  return;
}
if(!force&&onlineLoadedAt&&Date.now()-onlineLoadedAt<ONLINE_CACHE_MS){
  return;
}
const request=(async()=>{
  const revision=onlineMutationRevision;
  const d=await api('online',{compact:'1',fresh:force?'1':'0'});
  if(revision!==onlineMutationRevision||pendingRestockRows.size)return;
  const headers=d.headers||[];
  const rows=d.format==='online-matrix-v1'
    ?(d.rows||[]).map((r,i)=>({row:r[0],data:Object.fromEntries(headers.map((h,i)=>[h,r[i+1]])),depositMergeKey:(d.mergeKeys||[])[i]||''}))
    :(d.rows||[]);
  onlineRows=rows;
  onlineHeaders=headers;
  onlineLoadedAt=Date.now();
  if(document.getElementById('onlineResult')){
    isCustomerView=false;
    isGroupView=false;
    applyOnlineFilter();
  }
})();
onlineLoadPromise=request;
try{await request;}finally{
  if(onlineLoadPromise===request)onlineLoadPromise=null;
}
}catch(e){
const res=document.getElementById('onlineResult');
if(res&&!background){
  if(!onlineLoadedAt){
    res.innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }else{
    alert('更新失敗，目前保留上次資料：'+e.message);
  }
}
}
}

function faceToFaceOrderSection(order){
const categories=order.items.map(row=>{
const cargo=String(getOnlineData(row,['貨況','狀態'])||'').trim();
const category=cargoCategory(cargo);
if(category==='補貨登記')return '補貨登記';
if(category==='受注'||/^\d{1,2}月$/.test(cargo))return '受注';
if(category==='預訂'||category==='已訂購'||isOrderPurchased(row))return '預訂';
return '現貨';
});
// 混合狀態訂單放在尚未到貨的區域，避免被歸到現貨。
if(categories.includes('補貨登記'))return '補貨登記';
if(categories.includes('受注'))return '受注';
if(categories.includes('預訂'))return '預訂';
return '現貨';
}
function isOrderPurchased(row){
const value=getOnlineData(row,['已訂購','購買','訂購']);
return isTruthy(value)||getOrderStatus(row)==='已訂購';
}
function faceToFaceOrderIsOrdered(order){
return order.items.every(row=>{
const cargo=String(getOnlineData(row,['貨況','狀態'])||'').trim();
return cargoCategory(cargo)==='已訂購'||isOrderPurchased(row);
});
}
function orderNewestTime(order){
return Math.max(0,...order.items.map(row=>timeValue(getOnlineData(row,['時間','購買時間']))));
}
function cargoCategory(cargo){
cargo=String(cargo||'').trim();
if(
cargo==='補貨登記'||
cargo==='SOLD OUT'||
cargo==='S☹LD OUT'||
cargo==='補登'
)return '補貨登記';
if(/^\d{1,2}月$/.test(cargo))return '受注';
if(cargo==='現貨')return '現貨';
if(cargo==='已訂購')return '已訂購';
if(cargo==='預訂')return '預訂';
return cargo
}
function getOrderStatus(row){
return String(getOnlineData(row,['狀態','訂購狀態','已訂購','購買'])||'').trim()
}
function isOpenedRow(row){
const status=getOrderStatus(row);
const opened=getOnlineData(row,['已開單','開單']);
return status==='已開單'||isTruthy(opened)
}
function cargoDisplay(row){
const raw=String(getOnlineData(row,['貨況'])||'').trim();
const status=getOrderStatus(row);
const category=cargoCategory(raw);
if(category==='預訂'){
return isTruthy(status)||status==='已訂購'
?{text:'訂',color:'#FBB550'}
:{text:'未',color:'#E78790'}
}
if(/^\d{1,2}月$/.test(raw)){
return {text:raw.replace('月','').padStart(2,'0'),color:'#85C2D0'}
}
if(category==='補貨登記')return {text:'補',color:'#7E88A0'};
if(category==='現貨')return {text:'現',color:'#DABBD8'};
return {text:raw,color:'#8ca7b2'}
}
function getPaymentMethod(row){
const direct=String(
getOnlineData(row,['付款方式','支付方式','付款','收款方式'])||''
).trim();
if(direct)return direct;
const last5=String(getLast5(row)||'').trim();
if(last5.startsWith('中信'))return '中信';
if(last5.toUpperCase().startsWith('LB'))return 'LB';
if(last5.toUpperCase()==='LP')return 'LP';
if(last5.toLowerCase()==='ipass')return 'ipass';
const note=String(getOnlineData(row,['備註','備註欄'])||'').trim();
if(note.includes('面交'))return '面交';
return ''
}
function needsLast5(rows){
return rows.some(row=>{
const method=getPaymentMethod(row).toUpperCase();
return method.includes('中信')||method==='LB'
})
}
function normalizePayment(v){
const value=String(v||'').trim().toLowerCase();
if(value==='中信')return '中信';
if(value==='lb')return 'LB';
if(value==='lp')return 'LP';
if(value==='ipass')return 'ipass';
if(value==='面交')return '面交';
return ''
}
function paymentLast5Value(v){
return String(v||'').replace(/\D/g,'').slice(-5)
}
function onlineMonthNumber(v){
const s=String(v||'').trim();
let m=s.match(/^\d{4}[-\/](\d{1,2})[-\/]/);
if(m)return Number(m[1]);
m=s.match(/^(\d{1,2})[-\/](\d{1,2})/);
if(m)return Number(m[1]);
const d=new Date(s);
return Number.isNaN(d.getTime())?0:d.getMonth()+1
}
function onlineSummaryTitle(){
if(isFaceToFaceView)return '要面交';
if(onlineCargo==='現貨')return '待出貨';
if(onlineCargo)return onlineCargo;
if(onlineSearchText)return onlineSearchText;
return '全部'
}
function applyOnlineFilter(){
let rows=[...onlineRows];
if(isFaceToFaceView){showOrderCards(rows.filter(row=>isFaceToFace(row)&&!isOpenedRow(row)),'要面交');return;}
if(onlineSearchText){
const key=onlineSearchText.toLowerCase();
const monthMatch=key.match(/^(\d{1,2})月$/);
const wantedMonth=monthMatch?Number(monthMatch[1]):0;
rows=rows.filter(x=>{
const customer=
String(
getOnlineData(
x,
[
'顧客名稱',
'客戶名稱',
'客人名稱',
'姓名'
]
)||''
).toLowerCase();
const group=
String(
getOnlineData(
x,
[
'團名',
'團組',
'團'
]
)||''
).toLowerCase();
const time=String(
getOnlineData(x,['時間','購買時間'])||''
);
if(wantedMonth){
return onlineMonthNumber(time)===wantedMonth;
}
const dateKey=time.replace(/\D/g,'');
const searchDate=key.replace(/\D/g,'');
const last5Source=String(getLast5(x)||getPaymentMethod(x)||'');
const last5=toHalfWidthDigits(last5Source).replace(/\D/g,'');
const searchDigits=toHalfWidthDigits(onlineSearchText).replace(/\D/g,'');
return(
customer.includes(key)||
group.includes(key)||
(searchDate.length>=3&&dateKey.includes(searchDate))||
(searchDigits.length>0&&last5.includes(searchDigits))
);
});
}
if(onlineCargo){
rows=rows.filter(x=>{
const rawCargo=
String(
getOnlineData(
x,
[
'貨況',
'狀態'
]
)||''
).trim();
const category=cargoCategory(rawCargo);
const ordered=
getOnlineData(
x,
[
'已訂購',
'購買'
]
);
const opened=
getOnlineData(
x,
[
'已開單',
'開單'
]
);
if(onlineCargo==='現貨'){
return(
category==='現貨'&&
!isTruthy(opened)
);
}
if(onlineCargo==='已訂購'){
return isTruthy(ordered);
}
if(onlineCargo==='已開單'){
return isTruthy(opened);
}
if(onlineCargo==='受注'){
return /^\d{1,2}月$/.test(rawCargo);
}
return category===onlineCargo;
});
}
showOnlineRows(rows)
}
function isTruthy(v){
if(v===true)return true;
return[
'true',
'1',
'y',
'yes',
'是',
'已',
'已訂購',
'已開單',
'已出貨'
].includes(
String(v??'')
.trim()
.toLowerCase()
)
}

return [
'顧客名稱',
'時間',
'貨況',
'團名',
'名稱',

async function toggleFaceToFace(button,rows){

const enabled=!button.classList.contains('active');

button.classList.toggle('active',enabled);
button.disabled=true;
syncFaceButtons();
try{
await api('setOnlineFaceToFace',{
rows:JSON.stringify(rows),enabled:enabled?'true':'false'
});
const noteHeader=findHeader(onlineHeaders,['備註','備註欄']);
onlineRows.filter(row=>rows.includes(Number(row.row))).forEach(row=>{
if(noteHeader){
const current=String(row.data[noteHeader]||'').trim();
row.data[noteHeader]=enabled
?(current.includes('面交')?current:(current?current+'｜面交':'面交'))
:current.replace(/(^|｜)面交(?=｜|$)/,'').replace(/^｜|｜$/g,'');
}
});

rows.forEach(row=>pendingFaceRows.delete(row));

const customer=
g[0].data[ci]||
'未填姓名';
const packed=!!packedHeader&&g.every(x=>isTruthy(x.data[packedHeader]));
const orderTotal=g.reduce((sum,x)=>sum+numberValue(x.data[pi]),0);
const depositTotal=g.reduce((sum,x)=>sum+numberValue(x.data[di]),0);
const shippingSeen=new Set();
const shippingTotal=g.reduce((sum,x)=>{
const shipping=numberValue(x.data[shi]);
const key=String(x.data[ti]||'')+'|'+shipping;
if(!shipping||shippingSeen.has(key))return sum;
shippingSeen.add(key);
return sum+shipping;
},0);
const balance=orderTotal+shippingTotal-depositTotal;
const now=new Date();
const shipDate=String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
return `
<div
class="card shipOrderCard ${packed?'shipPacked':''}"
data-rows="${g.map(x=>x.row).join(',')}"
style="margin-bottom:10px">
<div class="cardHead shipCardHead">
<button class="btn light shipCopyButton" onclick="copyShipText(this)" aria-label="複製整筆訂單出貨文" title="複製出貨文"><img src="https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260923191208_45eb9f40.png" alt=""></button>
<strong>${esc(customer)}</strong>
<span class="shipDateCount">${esc(shipDate)}<i>|</i>${g.length} 件</span>
</div>
${g.map(x=>`
<div class="shipItem" data-name="${esc(x.data[ni]||'')}" data-price="${esc(x.data[pi]||0)}" data-deposit="${esc(x.data[di]||0)}">
<span class="shipOrderDate">
${esc(formatOnlineTime(x.data[ti]||''))}
</span>
<span class="shipProductName">
${esc(x.data[ni]||'')}
</span>
<span class="shipProductPrice">
$${money(x.data[pi]||0)}
</span>
</div>
`).join('')}
<div class="shipCardTotals">
<span>總金額 $${money(orderTotal)}</span>
${shippingTotal?`<span>運費 $${money(shippingTotal)}</span>`:''}
<span>訂金 $${money(depositTotal)}</span>
<strong>尾款 $${money(balance)}</strong>
<button class="btn green shipCompleteButton" onclick="toggleShipPacked(this)" aria-pressed="${packed}">${packed?'已完成':'完成'}</button>
</div>
</div>
`;
}).join('');
}
}
setInterval(()=>{
if(document.body.dataset.page==='ship'&&shipDataCache&&!shipPendingWrites){
const visible=[...document.querySelectorAll('.shipOrderCard')].flatMap(card=>card.dataset.rows.split(',').map(Number));
if(shipDataCache.rows.some(row=>visible.includes(Number(row.row))&&shipRowExpired(row)))drawShip(shipDataCache);

/* =========================================================

========================================================= */
/* 複製目前這張訂單卡內的全部商品，不依賴勾選狀態。 */
async function copyShipText(button){
const card=button.closest('.shipOrderCard');
if(!card)return;
const customer=card.querySelector('.shipCardHead strong').textContent.trim();
const names=[...card.querySelectorAll('.shipItem')].map(item=>item.dataset.name||'');
const text=customer+'：'+names.join('+');
try{
if(navigator.clipboard&&navigator.clipboard.writeText){
try{await navigator.clipboard.writeText(text);alert('出貨文已複製');return;}catch(_){}
}
const ta=document.createElement('textarea');
ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();
let copied=false;
try{copied=document.execCommand('copy');}finally{ta.remove();}
if(!copied)throw new Error('瀏覽器未允許複製');
alert('出貨文已複製');
}catch(e){alert('複製失敗：'+e.message);}
}
async function toggleShipPacked(button){
if(button.disabled)return;
const card=button.closest('.shipOrderCard');
const previous=card.classList.contains('shipPacked');
const packed=!previous;
const update=value=>{
card.classList.toggle('shipPacked',value);
button.setAttribute('aria-pressed',String(value));
button.textContent=value?'已完成':'完成';
};
button.disabled=true;update(packed);
shipRevision++;shipPendingWrites++;
try{
const ids=card.dataset.rows.split(',').map(Number);
const result=await api('setShipPacked',{rows:JSON.stringify(ids),packed:String(packed)});
if(shipDataCache){
shipDataCache.rows.filter(row=>ids.includes(Number(row.row))).forEach(row=>{
row.data['已包貨']=packed;row.data['包貨完成時間']=result.completedAt||'';
});
if(!shipDataCache.headers.includes('已包貨'))shipDataCache.headers.push('已包貨');
}
shipLoadedAt=0;
}catch(e){update(previous);alert('包貨狀態儲存失敗，已還原：'+e.message);}
finally{button.disabled=false;shipPendingWrites--;}
}

try{
await api(
'setShip',
{
row,
status:checked
?'已出貨'
:'待出貨'
}
);
}catch(e){
alert(e.message)
}
}
