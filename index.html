<style>
*{box-sizing:border-box}
:root{
--bg:#f3f3f3;
--card:#fff;
--soft:#f7f7f7;
--soft2:#eee;
--border:#e2e2e2;
--text:#555;
--muted:#999;
--main:#A68C73;
--main2:#A68C73;
--green:#8fa98b;
--red:#c9827d;
--blue:#8ca7b2
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden
}
body{
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif
}
.loginScreen{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:#fff
}
.loginCard{
width:min(440px,100%);
text-align:center
}
.loginLogo{
display:block;
width:50%;
height:auto;
margin:0 auto 24px
}
.loginForm{
width:min(360px,100%);
margin:auto
}
.loginForm input:not([type="checkbox"]){
display:block;
width:100%;
min-width:0;
padding:12px 20px;
border-radius:999px;
text-align:center
}
.loginRemember{display:flex;align-items:center;justify-content:center;gap:7px;margin:12px 0 0;color:#666;font-size:14px;cursor:pointer}.loginRemember input{width:16px;height:16px;margin:0}
.loginError{
min-height:22px;
margin:10px 0 0;
color:var(--red);
font-size:14px
}
.protectedShell{display:none}
body.isAuthenticated .loginScreen{display:none}
body.isAuthenticated .protectedShell{display:block}
button,input,select{font:inherit}
button{cursor:pointer}
input[type=number]{
appearance:textfield;
-moz-appearance:textfield
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
-webkit-appearance:none;
margin:0
}
.top{
position:relative;
height:58px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:800;
color:#555
}
.nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:62px;
background:rgba(255,255,255,.97);
display:flex;
border-top:1px solid var(--border);
z-index:1000
}
.nav button,
.nav a{
flex:1;
border:0;
background:none;
color:#999;
font-weight:700;
font-size:16px
}
.nav a{
display:flex;
align-items:center;
justify-content:center;
text-decoration:none
}
.nav button.active{
color:var(--main);
background:transparent;
box-shadow:inset 0 3px 0 var(--main)
}
.nav button.isRefreshing{opacity:.55}
.page{
width:100%;
max-width:1700px;
height:calc(100dvh - 120px);
margin:auto;
padding:14px
}
.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap
}
input,select{
border:1px solid #ddd;
background:#fff;
color:var(--text);
border-radius:9px;
padding:9px 11px;
outline:none
}
input:focus,select:focus{
border-color:#aaa
}
select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;
background-image:none!important;
field-sizing:content;
width:auto;
text-align:center;
text-align-last:center;
padding-left:10px;
padding-right:10px
}
.btn{
border:0;
border-radius:9px;
padding:9px 14px;
background:var(--main);
color:#fff;
font-weight:700
}
.btn.light{
background:#e9e9e9;
color:#666
}
.btn.green{
background:var(--green)
}
.btn.red{
background:var(--red)
}
.mobileShortcut{
display:none
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
box-shadow:0 2px 9px rgba(0,0,0,.035);
overflow:hidden
}
.cardHead{
min-height:46px;
padding:11px 15px;
background:#f8f8f8;
border-bottom:1px solid var(--border);
font-weight:700;
display:flex;
justify-content:space-between;
align-items:center
}
.empty,.loading{
text-align:center;
padding:30px;
color:#aaa
}
.total{
font-size:25px;
font-weight:800
}
.tag{
display:inline-block;
padding:4px 8px;
border-radius:6px;
background:#eee;
color:#666;
font-size:12px;
font-weight:700
}
.tag.green{
background:#e0e9dd;
color:#62745d
}
.tag.red{
background:#f2dddd;
color:#9a625d
}
.tag.blue{
background:#e1e9ed;
color:#627983
}
.check{
width:17px;
height:17px;
accent-color:var(--main)
}
.customerLink,
.groupLink{
border:0;
background:none;
padding:0;
color:#A68C73;
font-weight:400;
text-decoration:none;
text-align:left
}
.customerLink{
font-size:13px
}
.groupLink{
font-size:14px
}
.tableWrap{
width:100%;
overflow:auto
}
table{
border-collapse:collapse;
width:100%;
table-layout:fixed
}
th,td{
padding:8px 7px;
border-bottom:1px solid #eee;
text-align:left;
vertical-align:middle;
word-break:break-word;
overflow-wrap:anywhere
}
th{
background:#f5f5f5;
color:#777;
font-weight:700
}
tr:hover td{
background:#fafafa
}
/* 店面 */
.storePage{
height:100%;
display:grid;
grid-template-columns:minmax(0,1.5fr) minmax(320px,.75fr);
grid-template-rows:auto minmax(0,1fr);
gap:12px
}
.storeManual{
grid-column:1;
grid-row:1
}
.storeMain{
min-height:0;
display:flex;
flex-direction:column;
grid-column:1;
grid-row:2
}
.storeCheckout{
min-height:0;
display:flex;
flex-direction:column;
grid-column:2;
grid-row:1/3
}
.storeMainBody{
padding:12px;
min-height:0;
display:flex;
flex-direction:column
}
.storeSearch{
display:flex;
gap:6px;
flex-shrink:0
}
.storeSearch input{
flex:1;
min-width:0
}
.cart{
flex:1;
min-height:0;
overflow-y:auto;
margin-top:8px;
padding-right:3px
}
.cartItem{
display:flex;
align-items:center;
gap:10px;
padding:9px 2px;
border-bottom:1px solid #eee
}
.cartName{
flex:1;
min-width:0
}
.cartSub{
color:#999;
font-size:12px;
margin-top:3px
}
.qty{
display:flex;
align-items:center;
gap:5px;
flex-shrink:0
}
.qty button{
width:28px;
height:28px;
border:0;
border-radius:6px;
background:#eee;
color:#666
}
.cartItem .removeCartButton{
background:#E78790!important;
color:#fff!important
}
.manualBox{
display:grid;
grid-template-columns:1fr 130px auto;
gap:8px;
padding:10px
}
.checkoutBody{
padding:14px;
min-height:0;
overflow:auto
}
.salesperson{
display:flex;
gap:7px
}
.salesperson button{
flex:1;
border:1px solid #ddd;
background:#fff;
color:#777;
border-radius:8px;
padding:8px
}
.salesperson button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.payment{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:6px
}
.payment button{
border:1px solid #ddd;
background:#fff;
color:#666;
border-radius:8px;
padding:8px 4px
}
.payment button.active{
background:var(--main);
color:#fff;
border-color:var(--main)
}
.checkoutTotalRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
min-height:32px
}
.checkoutTotalRow .total{min-width:0}
.changeText{
margin-top:0;
text-align:right;
white-space:nowrap;
font-size:16px;
font-weight:700
}
.checkoutActions{
margin-top:12px;
display:grid;
grid-template-columns:4fr 1fr;
gap:7px
}
.checkoutActions .btn.green,
.checkoutActions .acButton{width:100%;height:44px}
.acButton{
display:block;
background:#E78790!important
}
.checkoutQuick{
display:flex;
gap:7px;
align-items:stretch
}
.checkoutQuick input{min-width:0;flex:1}
.checkoutQuick input{text-align:left}
.manualBox input[data-money-input]{text-align:center}
.checkoutQuick .salesperson{flex:1;min-width:0}
.storeAddIcon{display:none}
/* 線上 */
.onlinePage{
height:100%;
display:flex;
flex-direction:column;
gap:10px
}
.onlineToolbar{
flex-shrink:0;
display:flex;
margin:0;
gap:8px
}
.onlineToolbar input,
.onlineToolbar select,
.onlineToolbar button{height:44px}
.onlineToolbar input{
flex:1;
min-width:0
}
.onlineResult{
min-height:0;
flex:1;
overflow:auto
}
.onlineResult .orderCards .groupCard,.onlineCardSlot{contain:layout style paint}
.onlineCardSlot{min-width:0}
.onlineTable{
min-width:900px
}
.onlineTable th:nth-child(1){width:5%}
.onlineTable th:nth-child(2){width:12%}
.onlineTable th:nth-child(3){width:9%}
.onlineTable th:nth-child(4){width:9%}
.onlineTable th:nth-child(5){width:20%}
.onlineTable th:nth-child(6){width:20%}
.onlineTable th:nth-child(7){width:8%}
.onlineTable th:nth-child(8){width:8%}
.onlineTable th:nth-child(9){width:8%}
.onlineTable th:nth-child(10){width:8%}
.groupSummary{
font-size:16px;
font-weight:400
}
.customerNameTitle{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;border:0;padding:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.customerMessageButton{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;background:transparent;padding:2px 4px;font-size:14pt;cursor:pointer;line-height:1.2;color:#ccc;font-weight:700;-webkit-text-stroke:.3px currentColor}
.customerMessageButton.bound{color:var(--green)}
.customerMessageButton:disabled{opacity:.5;cursor:wait}
.customerNameEditIcon{display:block;width:1em;height:1em;object-fit:contain;align-self:center;flex:0 0 1em}
.orderNameEditButton{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;background:transparent;color:inherit;padding:3px;cursor:pointer;opacity:.7}
.orderNameEditButton img{width:14px;height:14px;object-fit:contain}
.faceOrderHead{background:var(--green);color:#fff}
.faceOrderSection{margin:12px 0}
.faceOrderHead.faceStockHead{background:#D9C0FA}
.faceOrderHead.facePreorderHead{background:#FDD365}
.faceOrderHead.faceCargoHead{background:#9BB4A8}
.faceOrderHead.faceRestockHead{background:#7E88A0}
.groupCards{
padding:12px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
align-items:stretch
}
.orderCards,.onlineResult .orderCards{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.groupCard{
height:240px;
min-width:0;
border:1px solid var(--border);
border-radius:12px;
background:#fff;
overflow:hidden;
display:flex;
flex-direction:column;
position:relative
}
.groupCardCustomer{
padding:10px 13px;
background:#f7f7f7;
border-bottom:1px solid #eee;
flex-shrink:0;
font-size:14px;
display:flex;
justify-content:flex-start;
gap:8px;
align-items:center
}
.groupCardCustomer .groupCardTotal{margin-left:auto}
.groupCardItems{
flex:1;
min-height:0;
overflow-y:auto;
padding:3px 13px
}
.groupCardItem{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:7px 0;
border-bottom:1px solid #f0f0f0;
font-size:13px
}
.groupCardItem.opened{background:#f1f1f1}
.groupCardItem .check{flex-shrink:0}
.groupCardItem:last-child{
border-bottom:0
}
.groupCardItemName{
flex:1;
min-width:0;
word-break:break-word
}
.groupCardItemDeposit{color:#e53935}
.groupCardItemPrice{
white-space:nowrap
}
.groupCardNote{padding:7px 0;color:#8b8077;font-size:12px;line-height:1.4;word-break:break-word}
.orderAddButton{position:static;z-index:2;width:18px;height:18px;flex:0 0 18px;border:0;padding:0;background:transparent;color:var(--main);font-size:20px;line-height:18px;font-weight:400}
.orderAddButton:hover{filter:brightness(.94)}
.orderItemDate{white-space:nowrap}
.groupCardBottom{
padding:9px 13px;
border-top:1px solid #eee;
display:flex;
justify-content:space-between;
gap:10px;
font-size:12px;
color:#888;
flex-shrink:0
}
.groupCardBottom strong{
color:#555;
font-size:13px
}
.groupCardMeta{
padding:7px 13px;
border-top:1px solid #eee;
display:flex;
flex-wrap:nowrap;
white-space:nowrap;
justify-content:flex-start;
align-items:center;
gap:8px;
font-size:12px;
color:#777;
flex-shrink:0
}
.groupCardMeta>*{flex-shrink:0}
.groupCardMeta{container-type:inline-size;container-name:orderMeta}
.orderDeposit{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.orderDepositLabel{white-space:nowrap}
.orderAddRemittance{border:0;background:#eee;color:#666;border-radius:7px;padding:3px 6px;font:inherit;cursor:pointer;white-space:nowrap}
.remittanceFormRows{display:grid;gap:12px}.remittanceFirstRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.remittanceFormRows input,.remittanceFormRows select{display:block;width:100%;min-width:0;box-sizing:border-box}
.orderDepositInput::placeholder{color:transparent}
@container orderMeta (max-width:520px){
.orderDeposit.hasDepositInput .orderDepositLabel{display:none}
.orderDeposit.hasDepositInput .orderDepositInput::placeholder{color:#999;opacity:1}
}
.groupCardMeta>*:first-child{margin-right:auto}
.orderMetaDate.isHidden+*{margin-left:auto}
.orderMetaDate.isHidden{display:none}
.reconcileButton{padding:4px 9px;font-size:12px;white-space:nowrap}
.reconcileButton.isDone{background:#FFBCD5;color:#fff}
.groupCardMeta input{
width:66px;
flex:0 0 66px;
padding:4px 6px;
border-radius:6px;
font-size:12px;
text-align:center
}
.orderLast5{white-space:nowrap}
.orderLast5 input:disabled{background:#f2f2f2;color:#aaa}
.groupCardTotal{white-space:nowrap;color:#555;font-size:13px}
.faceToFaceTag,.faceToggle{
white-space:nowrap;
flex-shrink:0;
border:1px dashed #CBC3BC;
border-radius:5px;
padding:2px 5px;
font-size:10px;
background:transparent;
color:#CBC3BC
}
.faceToFaceTag.active,.faceToggle.active{
background:var(--green);
color:#fff;
border-color:var(--green)
}
.orderPayment{
width:62px;
flex:0 0 62px;
padding:4px 3px;
border-radius:6px;
font-size:12px
}
.onlineIconButton{
width:42px;
min-width:42px;
padding:0;
background-repeat:no-repeat!important;
background-position:center!important;
background-size:50%!important;
color:transparent!important
}
.onlineSearchButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922205838_23cab617.png')!important}
.onlineRefreshButton{background-image:url('https://raw.githubusercontent.com/jiwusales/imgh/main/images/img_20260922204703_5dd34c41.png')!important}
.onlineAddButton{width:42px;min-width:42px;padding:0;font-size:24px}
.cargoTag{
width:18px;
height:18px;
padding:0!important;
border-radius:4px!important;
font-size:11px!important;
line-height:18px;
text-align:center;
color:#fff!important;
flex-shrink:0;cursor:pointer;border:0;width:auto;min-width:18px;padding:0 3px!important;font-size:10px!important
}
/* 出貨 */
.shipMarketActions{display:none}
body[data-page="ship"] .shipMarketActions{display:flex;gap:6px}
body[data-page="ship"] .top>span{max-width:calc(100% - 225px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shipOrderCard{cursor:pointer}
.shipOrderCard.shipMarketSelected{border-color:var(--main)}
.shipMarketCheck{width:17px;height:17px;margin:0 3px 0 0;align-self:center;accent-color:var(--main);cursor:pointer;flex-shrink:0}
.shipMarketTruck{margin-right:auto;color:#ccc;font-size:22px;line-height:1;background:none;border:0;padding:0;flex-shrink:0;cursor:pointer}
.shipMarketTruck:focus-visible{outline:2px solid var(--main);outline-offset:3px}
.shipMarketTruck.isListed{color:#2673C0}
.shipMarketTruck svg{display:block;width:24px;height:24px;fill:currentColor}
.shipMarketForm{display:grid;gap:12px}
.shipMarketForm input{width:100%}
.shipMarketForm p{margin:0;font-size:13px;color:#888;line-height:1.6}
.shipMarketForm .dialogActions{display:flex;justify-content:flex-end;gap:8px}
.shipPage{
height:100%;
overflow:auto
}
.shipItem{
padding:10px 15px;
border-top:1px solid #eee;
display:flex;
gap:12px;
align-items:center
}
.shipCardHead{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.shipCardHead strong{margin-right:auto}
.shipCopyActions{display:inline-flex;gap:4px;flex-shrink:0}
.shipCopyActions .shipCopyButton{padding:3px 6px;font-size:12px;line-height:1.2;border-radius:5px;min-width:26px}
.shipPacked,.shipPacked .cardHead,.shipPacked .shipItem,.shipPacked .shipCardTotals{
background:#ededed
}
.shipPacked .shipProductName,.shipPacked .shipProductPrice,.shipPacked .shipCardTotals strong{color:#999}
.shipCompleteButton,.shipDeleteButton{padding:4px 10px;font-size:12px}
.shipCompleteButton[aria-pressed="true"]{background:#b9b9b9}
.shipItemDelete{flex:0 0 24px;width:24px;height:24px;border:0;background:transparent!important;box-shadow:none;color:var(--red);padding:0;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}.shipItemDelete:disabled{opacity:.45;cursor:wait}
.shipOrderDate{width:48px;flex-shrink:0;color:#777}
.shipProductName{flex:1;min-width:0}
.shipProductPrice{white-space:nowrap}
.shipCardTotals{
display:flex;
gap:12px;
align-items:center;
justify-content:flex-end;
padding:10px 15px;
border-top:1px solid #eee;
font-size:13px;
flex-wrap:wrap
}
.shipCardTotals strong{color:#E24C60;font-size:15px}
.shipOrderCard{position:relative}
.shipDeleteButton{background:#E24C60;color:#fff}
.shipSwipeDelete{display:none}
@media(max-width:850px){
.shipCardTotals .shipDeleteButton{display:none}
.shipOrderCard.showShipDelete{padding-right:76px}
.shipOrderCard.showShipDelete>.shipSwipeDelete{display:block;position:absolute;right:0;top:0;bottom:0;width:70px;border:0;border-radius:0;background:#E24C60;color:#fff;font-weight:bold}
}
.shipSummary{
margin-bottom:10px
}
.shipSelected{
padding:12px
}
.shipSelectedRow{
display:flex;
justify-content:space-between;
gap:10px;
padding:7px 0;
border-bottom:1px solid #eee
}
.shipSelectedName{
flex:1;
min-width:0
}
.shipSelectedPrice{
white-space:nowrap
}
.shipTotalBox{
padding:12px;
background:#fafafa;
border-top:1px solid #eee
}
.shipTotalLine{
display:flex;
justify-content:space-between;
padding:3px 0
}
.shipBalance{
font-size:20px;
font-weight:800;
margin-top:5px
}
.topActions{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
display:flex;
align-items:center;
gap:6px
}
.topActions .btn{
height:26px;
min-height:0;
padding:2px 9px;
font-size:13px;
line-height:20px;
border-radius:6px
}
.topHomeButton,.topFaceButton,.topRefreshButton,.topStoreToggle,.topDetailsButton{display:none}
.topHomeButton{background:#E78790!important;color:#fff!important}
.topFaceButton{background:var(--green)!important;color:#fff!important}
body[data-page="store"] .topStoreToggle{display:block}
body[data-page="online"] .topHomeButton,body[data-page="online"] .topFaceButton,body[data-page="online"] .topDetailsButton{display:inline-flex;align-items:center}
.topDetailsButton{background:#8b8077!important;color:#fff!important}
body[data-page="ship"] .topRefreshButton{display:block}
.topActions .topRefreshButton{
width:26px;
min-width:26px;
padding:0;
background-size:75%!important
}
.storeSalesPage{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.storeSalesToolbar{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.storeSalesToolbar input{flex:1;min-width:0}
.storeSalesToolbar button{height:38px;flex-shrink:0}
.storeSalesToolbar>strong{margin-right:auto}
.storeSalesMonthSummary{flex-shrink:0;min-height:20px;color:#777;font-size:13px;font-weight:700;padding:0 3px}
.storeSalesMonthSummary[hidden]{display:none}
.storeSalesWarning{flex-shrink:0;text-align:center}
.storeSalesWarning .salesHint{margin:6px 0 0;text-align:center}
#storeSalesResult{flex:1;min-height:0;overflow:auto}
.salesDayCard{margin-bottom:12px}

function jiwuClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  // Convert each measurement separately so slash-separated sizes keep their pairing.
  return text.replace(/(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?(?:\s*[×xX、,]\s*(?:着丈|身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm|公分))?)*/gi, block => block.replace(/着丈/g,'長').replace(/身幅|身巾/g,'寬').replace(/肩幅/g,'肩').replace(/袖丈/g,'袖').replace(/cm|公分|[×xX、,:：\s]/gi,''));
}
function jiwuExtractClothingSize(value) {
  const text = String(value || '').normalize('NFKC');
  const rows = [...text.matchAll(/(?:^|[\s【\[(])((?:XX|X)?[SML]|\dXL)(?:サイズ)?[\s】\]):：]*(着丈\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*(?:cm))?(?:\s*[×xX、,]?\s*(?:身幅|身巾|肩幅|袖丈)\s*[:：]?\s*\d+(?:\.\d+)?(?:\s*cm)?)+)/g)];
  return rows.length ? rows.map(r=>r[1]).join('/')+'/'+rows.map(r=>jiwuClothingSize(r[2]).replace(/\s+/g,'')).join('/') : '';
}

// Returns complete physical groups only; [] means ambiguous/nonphysical text.
// Axis-internal spaces are not option separators (H400 × W390 × D180 is one group).
function jiwuPhysicalSizeGroups(sizeValue) {
  const text=String(sizeValue??'').normalize('NFKC').trim();if(!text)return [];
  const axes='(?:長|寬|肩|袖|高|深|厚|着丈|身幅|身巾|肩幅|袖丈)',amount='\\d+(?:\\.\\d+)?',unit='(?:cm|mm|公分)?';
  const axisToken=new RegExp('('+axes+')\\s*[:：]?\\s*'+amount+'\\s*'+unit,'gi');
  const xBody='(?:[HWD]?\\s*'+amount+'\\s*'+unit+'\\s*[x×]\\s*){1,2}[HWD]?\\s*'+amount+'\\s*'+unit;
  const singleX=new RegExp('^'+xBody+'$','i'),singleScalar=new RegExp('^'+amount+'\\s*(?:cm|mm|公分)$','i');
  const one=value=>singleX.test(value)||singleScalar.test(value);
  if(text.includes('/')){const parts=text.split('/').map(value=>value.trim());if(parts.every(Boolean)){const groups=parts.flatMap(value=>jiwuPhysicalSizeGroups(value));if(groups.length===parts.length)return groups;}return [];}
  if(one(text))return [text];
  const tokens=[...text.matchAll(axisToken)];
  if(tokens.length&&tokens.map(token=>token[0]).join('').replace(/\s+/g,'')===text.replace(/\s+/g,'')){
    const first=tokens[0][1],groups=[],seen=new Set();let current='';
    for(const token of tokens){const axis=token[1];if(axis===first&&current){groups.push(current);current='';seen.clear();}if(seen.has(axis))return [];seen.add(axis);current+=token[0].replace(/\s+/g,'');}
    if(current)groups.push(current);return groups;
  }
  const groupPattern=new RegExp('^(?:'+xBody+'|'+amount+'\\s*(?:cm|mm|公分))(?=$|\\s)','i');
  const groups=[];let rest=text;
  while(rest){const match=rest.match(groupPattern);if(!match)return [];groups.push(match[0].trim());rest=rest.slice(match[0].length).trim();}
  return groups;
}

// Shared conservative projection; never changes name/role/SKU/ID/price.
// inferFormat=false permits a client explicitly sending format:'' to clear it.
function jiwuSplitProductSpec(sizeValue, formatValue, inferFormat = true) {
  const normalizeFormat=value=>String(value??'').normalize('NFKC').trim().replace(/\bBOX\s+([1-9]\d*(?:入|款)?)(?=$|[\s/])/gi,'BOX$1').replace(/(單抽|单抽|抱盒)\s+([1-9]\d*(?:入|款))(?=$|[\s/])/g,'$1$2').replace(/[\s/]+/g,' ').trim();
  const originalSize=String(sizeValue??'').trim(),explicitFormat=normalizeFormat(formatValue);
  const normalized=originalSize.normalize('NFKC'),parts=normalized.split('/').map(value=>value.trim()),optionParts=normalizeFormat(originalSize).split(' ');
  const clothing=value=>/^(?:XXXS|XXS|XS|S|M|L|XL|XXL|XXXL|[2-5]XL|F|FREE|SML)$/i.test(value);
  const option=value=>clothing(value)||/^(?:(?:單抽|单抽|抱盒)(?:\s*[1-9]\d*(?:入|款))?|BOX(?:\s*[1-9]\d*(?:入|款)?)?|針式|针式|夾式|夹式|針|针|夾|夹)$/i.test(value);
  if(optionParts.length&&optionParts.every(value=>value&&option(value))){
    return {format:explicitFormat||(inferFormat?optionParts.join(' '):''),size:''};
  }
  let labels=0;while(labels<parts.length&&clothing(parts[labels]))labels++;
  const measures=jiwuPhysicalSizeGroups(parts.slice(labels).join('/'));
  if(labels>0&&measures.length===labels){
    return {format:explicitFormat||(inferFormat?parts.slice(0,labels).join(' '):''),size:measures.join(' ')};
  }
  const physicalGroups=jiwuPhysicalSizeGroups(originalSize);
  return {format:explicitFormat,size:physicalGroups.length?physicalGroups.join(' '):originalSize};
}

 while(offset<source.length){const view=new DataView(source.buffer,source.byteOffset+offset),length=view.getUint32(0),type=String.fromCharCode(...source.subarray(offset+4,offset+8));if(type!=='pHYs')parts.push(source.subarray(offset,offset+length+12));if(type==='IHDR'){parts.push(chunk);inserted=true;}offset+=length+12;}
 if(!inserted)throw new Error('PNG 格式錯誤');return new Blob(parts,{type:'image/png'});
}

function numberValue(v){
if(typeof v==='number')return Number.isFinite(v)?v:0;

if(!text)return 0;
const lines=text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
if(lines.length>1){
const values=lines.map(Number);
if(values.every(Number.isFinite))return values.reduce((sum,value)=>sum+value,0)
}
const n=Number(text);
return Number.isFinite(n)?n:0
}

function onlineSerialDate(value){
const text=String(value??'').trim();
if(!/^[0-9]+(?:\.[0-9]+)?$/.test(text))return null;
const serial=Number(text);
return serial>=1&&serial<=2958465?new Date(Date.UTC(1899,11,30)+Math.round(serial*86400000)):null;
}
function formatOnlineTime(v){
const serialDate=onlineSerialDate(v);
if(serialDate)return String(serialDate.getUTCMonth()+1).padStart(2,'0')+'/'+String(serialDate.getUTCDate()).padStart(2,'0');
if(!v)return '';
const s=String(v).trim();
if(/^\d{4}-\d{2}-\d{2}T.*(?:Z|[+-]\d{2}:?\d{2})$/i.test(s)){
const timestamp=Date.parse(s);
if(Number.isFinite(timestamp)){
const taiwanDate=new Date(timestamp+8*60*60*1000);
return String(taiwanDate.getUTCMonth()+1).padStart(2,'0')+'/'+String(taiwanDate.getUTCDate()).padStart(2,'0');
}
}
let m=s.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[2]).padStart(2,'0')+
'/'+
String(m[3]).padStart(2,'0')
}
m=s.match(
/(\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[1]).padStart(2,'0')+
'/'+
String(m[2]).padStart(2,'0')
}
return s
}
function timeValue(v){
const serialDate=onlineSerialDate(v);
if(serialDate)return serialDate.getTime();
if(!v)return 0;
const s=String(v).trim();
// Compare every format on the same Taiwan calendar clock. Spreadsheet serials
// and yearless LINE dates represent local calendar values, not UTC instants.
if(/^\d{4}-\d{2}-\d{2}T.*(?:Z|[+-]\d{2}:?\d{2})$/i.test(s)){
const timestamp=Date.parse(s);
return Number.isFinite(timestamp)?timestamp+8*60*60*1000:0;
}
const m=s.match(/^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2})(?::(\d{2}))?(?::(\d{2})(?:\.(\d{1,3}))?)?)?$/);
if(!m)return 0;
const year=Number(m[1]||new Date(Date.now()+8*60*60*1000).getUTCFullYear()),month=Number(m[2]),day=Number(m[3]);
const hour=Number(m[4]||0),minute=Number(m[5]||0),second=Number(m[6]||0),millisecond=Number((m[7]||'').padEnd(3,'0'));
const date=new Date(Date.UTC(year,month-1,day,hour,minute,second,millisecond));
return date.getUTCFullYear()===year&&date.getUTCMonth()===month-1&&date.getUTCDate()===day&&hour<24&&minute<60&&second<60?date.getTime():0;
}

}

function purchasePackingPlan(orders){
 // 輸入與輸出均為 kg；內部乘以 1000 以整數運算，避免小數誤差。
 const weighted=orders.map(o=>({order:o,grams:Math.round(Number(o.weight)*1000)})).filter(x=>String(x.order.weight??'').trim()!==''&&Number.isFinite(x.grams)&&x.grams>0);
 const total=weighted.reduce((sum,x)=>sum+x.grams,0);let states=new Map([[0,{sum:0,indexes:[]}]]);
 weighted.forEach((x,index)=>{const next=new Map(states);states.forEach(state=>{const sum=state.sum+x.grams,remainder=sum%1000,prior=next.get(remainder);if(!prior||sum>prior.sum)next.set(remainder,{sum,indexes:[...state.indexes,index]});});states=next;});
 let best=null;states.forEach(state=>{if(!state.indexes.length)return;const remainder=state.sum%1000,left=(total-state.sum)%1000,gap=remainder===0?0:1000-remainder;const score=gap+(left>=900?1000:0);if(!best||score<best.score||(score===best.score&&state.sum>best.sum))best={...state,score};});
 const selected=new Set((best?.indexes||[]).map(i=>weighted[i].order.number));return {included:orders.filter(o=>selected.has(o.number)),remaining:orders.filter(o=>!selected.has(o.number)),weight:(best?.sum||0)/1000,remainingWeight:(total-(best?.sum||0))/1000,unknown:orders.filter(o=>!weighted.some(x=>x.order===o))};
}

function purchaseDateParts(date){

 if(/^[0-9]+(?:\.[0-9]+)?$/.test(text)){
  const serial=Number(text);
  if(serial>=1&&serial<=2958465){
   const value=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);
   return {year:value.getUTCFullYear(),month:value.getUTCMonth()+1,day:value.getUTCDate()};
  }
 }
 const m=text.match(/^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})(?:$|[T\s])/);
 if(!m)return null;
 const year=Number(m[1])||Number(new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'Asia/Taipei'}).format(new Date())),month=Number(m[2]),day=Number(m[3]),value=new Date(Date.UTC(year,month-1,day));

}

function purchaseSharedNameUpdates(orders,blocked=new Set()){
 const norm=value=>String(value||'').normalize('NFKC').replace(/\s+/g,'').trim();
 const site=order=>{try{return new URL(order.orderURL).hostname.replace(/^www\./,'');}catch{return order.channel||'';}};
 const key=(order,item)=>JSON.stringify([site(order),norm(item.originalName)]);
 const mappings=new Map();
 for(const order of orders){if(blocked.has(order.number)||order.status==='砍單'||!site(order))continue;
  for(const item of order.items||[]){if(!norm(item.originalName)||!norm(item.name)||norm(item.name)===norm(item.originalName))continue;
   const k=key(order,item);if(!mappings.has(k))mappings.set(k,[]);mappings.get(k).push(item);
  }
 }
 const updates=[];
 for(const order of orders){if(blocked.has(order.number)||order.status==='砍單'||!site(order))continue;
  const quantities=[];
  (order.items||[]).forEach((item,index)=>{
   if(!norm(item.originalName)||(norm(item.name)&&norm(item.name)!==norm(item.originalName)))return;
   const matches=(mappings.get(key(order,item))||[]).filter(source=>!norm(source.code)||!norm(item.code)||norm(source.code)===norm(item.code));
   if(!matches.length||new Set(matches.map(source=>JSON.stringify([source.name,source.role||'']))).size!==1)return;
   const source=matches[0],candidate=Object.fromEntries(['name','role','group','source','url','image'].map(field=>[field,source[field]||'']));
   quantities.push({indexes:[index],quantity:Number(item.quantity)||0,name:source.name,candidate});
  });
  if(quantities.length)updates.push({order,quantities});
 }
 return updates;
}

}
function purchaseRecordedName(item,previous){
 const key=value=>String(value||'').normalize('NFKC').replace(/\s+/g,'').replace(/^0+(?=\d)/,'');
 const code=key(item.code);if(!code)return null;
 const matches=previous.filter(x=>key(x.code)===code&&String(x.name||'').trim());
 const names=[...new Set(matches.map(x=>JSON.stringify([String(x.name).trim(),String(x.role||'').trim()])))];
 if(names.length!==1)return null;
 const selected=matches[matches.length-1];return {name:String(selected.name).trim(),role:selected.role||'',group:selected.group||'',source:selected.source||'',url:selected.url||'',image:selected.image||''};
}
function purchasePreviousImageIndex(previous){

function purchasePreviousImage(item,previous,index){

 if(!name)return '';
 let matches=index?index.get(name)||[]:previous.filter(x=>String(x.name||x.originalName||'').normalize('NFKC').trim()===name&&/^https?:\/\//i.test(x.image||''));
 for(const key of ['code','url','group','role']){
  const value=String(item[key]||'').trim();if(!value)continue;
  matches=matches.filter(x=>!String(x[key]||'').trim()||String(x[key]).trim()===value);
  const exact=matches.filter(x=>String(x[key]||'').trim()===value);if(exact.length)matches=exact;
 }
 const images=[...new Set(matches.map(x=>x.image.trim()))];return images.length===1?images[0]:'';
}
function purchaseDailyTotals(orders,mergeMonth=false){
 const previous=purchaseOrders.flatMap(o=>o.items||[]);
 const imageIndex=purchasePreviousImageIndex(previous);
 const days=new Map();
 orders.forEach(order=>{
  if(!days.has(order.date))days.set(order.date,{date:order.date,numbers:new Set(),products:new Map()});
  const day=days.get(order.date);day.numbers.add(order.number);
  if(order.status==='砍單')return;
  (order.items||[]).forEach((item,itemIndex)=>{
   const code=String(item.code||'').normalize('NFKC').replace(/\s+/g,'');
   // 無貨號的舊資料逐項保留，避免把不同商品合在一起。
   const key=mergeMonth?JSON.stringify([code||String(item.url||'').trim(),String(item.group||'').trim(),purchaseProductName(item),String(item.role||'').trim()]):purchaseOrderRegion(order)==='cn'&&order.tracking?'tracking:'+order.tracking+'|'+purchaseProductName(item):code||Symbol();
   if(!day.products.has(key))day.products.set(key,{code,names:new Set(),quantity:0,total:0,image:'',numbers:new Set(),refs:[]});
   const product=day.products.get(key);product.refs.push({number:order.number,index:itemIndex});product.names.add(purchaseProductName(item));if(!product.image){const image=item.image||purchasePreviousImage(item,previous,imageIndex);if(/^https?:\/\//i.test(image||''))product.image=image;}
   product.quantity+=Number(item.quantity)||0;product.total+=Number(item.total)||0;product.numbers.add(order.number);
  });
 });
 return [...days.values()].sort((a,b)=>purchaseDateSortKey(a.date)-purchaseDateSortKey(b.date)).map(day=>({date:day.date,orderCount:day.numbers.size,items:[...day.products.values()].map(x=>({...x,names:[...x.names],numbers:[...x.numbers]}))}));
}

function purchaseNameSearch(candidates,query){
 const norm=value=>String(value||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
 const words=norm(query).split(' ').filter(Boolean);
 return candidates.filter(candidate=>words.every(word=>norm([candidate.name,candidate.role,candidate.group,candidate.code].join(' ')).includes(word)));
}
async function purchaseLoadNameSuggestions(dialog){
 const result=await api('helperSnapshot',{sheets:['最新開團','商品庫存']});
 if(!dialog.isConnected)return;
 const products=[];
 for(const sheet of ['最新開團','商品庫存']){
  const table=result.tables?.[sheet]?.table,headers=(table?.cols||[]).map(col=>col.label);let group='';
  for(const row of table?.rows||[]){
   const item=Object.fromEntries(headers.map((header,index)=>[header,row.c?.[index]?.v??'']));group=String(item['團名']||group).trim();
   const name=String(item['名稱']||item['商品名稱']||item['品名']||'').trim();if(!name)continue;
   products.push({name,role:String(item['角色']||''),group,code:String(item['貨號']||''),url:String(item['商品網址']||item['網址']||''),image:String(item['圖片']||''),source:sheet});
  }
 }
 const unique=[...new Map(products.map(item=>[JSON.stringify([item.name,item.role,item.group]),item])).values()];
 dialog.querySelectorAll('.purchaseEditItem').forEach((row,index)=>{
  const input=row.querySelector('.purchaseEditName'),select=row.querySelector('.purchaseEditChoice');if(!select)return;
  const list=document.createElement('datalist');list.id='purchaseNameSuggestions-'+index;input.setAttribute('list',list.id);input.autocomplete='off';row.append(list);
  const matched=row.purchaseNameCandidates||[];
  const pool=[...new Map([...matched,...unique].map(item=>[JSON.stringify([item.name,item.role,item.group]),item])).values()];
  function suggest(){
   const matches=purchaseNameSearch(pool,input.value).slice(0,150);
   list.innerHTML=matches.map(item=>`<option value="${esc(purchaseProductName(item))}">${esc(item.group||item.source||'')}</option>`).join('');
   select.disabled=false;select.innerHTML='<option value="">'+(matches.length?'選擇對應名稱':'沒有符合的名稱，可繼續輸入')+'</option>'+matches.map((item,index)=>`<option value="${index}">${esc([purchaseProductName(item),item.group,item.source].filter(Boolean).join(' · '))}</option>`).join('');
   select.onchange=()=>{if(select.value==='')return;const item=matches[Number(select.value)];input.value=item.name;row.purchaseCandidate=item;};
  }
  input.addEventListener('input',event=>{if(event.isComposing)return;const exact=pool.filter(item=>purchaseProductName(item)===input.value);row.purchaseCandidate=exact.length===1?exact[0]:null;suggest();});
  input.addEventListener('compositionend',suggest);
 });
}

function purchaseQueueEdit(order,changed,defer=false){
 if(purchaseSplitPending.has(order.number)){purchaseEditToast('訂單正在拆分，請稍後');return;}
 const prior=purchaseEditQueue.get(order.number),previous=prior?.fields||{};
 const delta=Object.fromEntries(Object.entries(changed).filter(([key,value])=>['quantities','autoShipTracking','autoTransitWeight'].includes(key)||String(value??'')!==String(order[key]??'')));
 if(!Object.keys(delta).length)return;
 const fields={...previous,...delta};if(previous.quantities!==undefined&&previous.expectedItems!==undefined&&delta.quantities!==undefined)fields.expectedItems=previous.expectedItems;
 Object.assign(order,fields);if(purchaseOrderRegion(order)!=='cn'&&!purchaseKindsComplete(order))order.items.forEach(item=>item.checkedAt=0);const progressId=prior?.progressId&&launchMoveProgressJobs.get(prior.progressId)?.state==='排隊中'?prior.progressId:'purchase-edit-'+launchId();purchaseEditQueue.set(order.number,{fields,version:++purchaseQueueVersion,progressId});launchMoveProgress(progressId,'訂購','排隊中','','儲存訂單');if(defer)return;purchaseKeepPending();

async function purchaseDrainEdits(){
 if(purchaseQueueRunning)return;purchaseQueueRunning=true;
 try{while(purchaseEditQueue.size){const [number,pending]=purchaseEditQueue.entries().next().value;if(purchaseRegistrationQueue.has(number))break;
  pending.progressId||='purchase-edit-'+launchId();launchMoveProgress(pending.progressId,'訂購','傳送中','','儲存訂單');
  try{const result=await api('purchaseEdit',{number,...pending.fields},pending.progressId);launchMoveProgress(pending.progressId,'訂購','完成','','儲存訂單');if(purchaseEditQueue.get(number)?.version===pending.version)purchaseEditQueue.delete(number);purchaseKeepPending();purchaseEditToast('訂單已儲存至資料庫');purchaseSyncSharedNames();if(document.body.dataset.page==='purchase'&&!document.getElementById('appDialog'))renderPurchase();if(result.merged)await purchaseLoad();}
  catch(e){launchMoveProgress(pending.progressId,'訂購','失敗',e.message,'儲存訂單');purchaseEditToast('訂單 '+number+' 未送出修改已保留：'+e.message,true);
   const toast=document.getElementById('purchaseEditToast');if(toast){const discard=document.createElement('button');discard.type='button';discard.textContent='放棄這筆修改';discard.style.marginLeft='10px';discard.onclick=async()=>{
    if(purchaseQueueRunning){purchaseEditToast('正在儲存，請稍後再試',true);return;}
    const current=purchaseEditQueue.get(number);if(!current||current.version!==pending.version){purchaseEditToast('這筆修改已更新，請先重試',true);return;}
    purchaseEditQueue.delete(number);if(current.progressId){launchMoveProgressJobs.delete(current.progressId);launchPaintMoveProgress();}purchaseKeepPending();toast.remove();
    if(document.querySelector('#appDialog form')?.dataset.orderNumber===number)closeDialog();
    await purchaseLoad();
   };toast.appendChild(discard);}break;}
 }}finally{purchaseQueueRunning=false;}
}

function purchaseParseContents(value,kinds=purchaseContentsKinds){

 String(value||'').split(/[、,，;；\n]+/).map(v=>v.trim()).filter(Boolean).forEach(part=>{
  const m=part.match(/^(.*?)\s*[x×*]\s*(\d+)$/i)||part.match(/^(.*?\D)\s*(\d+)$/);
  if(m&&kinds.includes(m[1].trim())){const type=m[1].trim();counts[type]=(counts[type]||0)+Number(m[2]);}

 });return {counts,other:other.join('、')};
}

let inventoryDisplayedRows=[];
function setInventoryOrderPosition(row,input){
const current=inventoryDisplayedRows.findIndex(item=>Number(item.row)===Number(row));
const raw=input.value.trim(),position=Number(raw);
if(current<0)return;
if(inventoryOrderSaving){input.value=current+1;return;}
if(!/^\d+$/.test(raw)||!Number.isSafeInteger(position)||position<1||position>inventoryDisplayedRows.length){input.value=current+1;return;}
if(position===current+1)return;
const target=inventoryDisplayedRows[position-1];
reorderInventoryRows(Number(row),Number(target.row),position-1<current?'before':'after');
}
function reorderInventoryRows(source,target,side='after'){if(inventoryOrderSaving)return;if([source,target].some(row=>inventoryIsPinned(inventoryRows.find(item=>Number(item.row)===Number(row))||{})))return;const from=inventoryRows.findIndex(item=>Number(item.row)===Number(source));if(from<0||source===target)return;const [moved]=inventoryRows.splice(from,1);const targetIndex=inventoryRows.findIndex(item=>Number(item.row)===Number(target));if(targetIndex<0){inventoryRows.splice(from,0,moved);return;}const insertIndex=targetIndex+(side==='after'?1:0);inventoryRows.splice(insertIndex,0,moved);if(insertIndex===from)return;inventoryPendingMoves.push([Number(source),Number(target),side==='before'?'b':'a']);inventoryOrderDirty=true;const button=document.getElementById('inventorySaveOrderButton');if(button)button.classList.add('isVisible');renderInventoryContent();}
async function saveInventoryOrder(){
 if(inventoryOrderSaving||!inventoryOrderDirty||!inventoryPendingMoves.length)return;
 inventoryOrderSaving=true;
 const button=document.getElementById('inventorySaveOrderButton');if(button){button.disabled=true;button.textContent='SAVE…';}
 try{
  if(inventoryProductSaves.size)await Promise.allSettled([...inventoryProductSaves.values()]);
  const moves=inventoryPendingMoves.map(([source,target,side])=>source.toString(36)+'_'+target.toString(36)+'_'+side).join(',');
  if(inventoryOrderSaveRequest?.moves!==moves)inventoryOrderSaveRequest=backendPrepareWrite('reorderInventory',{moves,requestId:crypto.randomUUID()});
  const result=await api('reorderInventory',inventoryOrderSaveRequest);
  if(result.orderMode!=='rank'||!Array.isArray(result.orderIds))throw new Error('排序回應不完整，請重新載入確認儲存結果');
  const positions=new Map(result.orderIds.map((id,index)=>[String(id),index]));
  inventoryRows.sort((a,b)=>(positions.get(String(a.itemId))??Infinity)-(positions.get(String(b.itemId))??Infinity));
  inventoryOrderDirty=false;inventoryPendingMoves=[];inventoryOrderSaveRequest=null;inventoryLoadedAt=Date.now();
  prepareInventoryRows();saveInventorySessionCache();renderInventoryContent();
  document.getElementById('inventorySaveOrderButton')?.classList.remove('isVisible');
 }catch(e){alert('排序儲存失敗：'+e.message);}
 finally{inventoryOrderSaving=false;const current=document.getElementById('inventorySaveOrderButton');if(current){current.disabled=false;current.textContent='儲存排序';}}
}

function normalizeMoneyInput(input){

const start=input.selectionStart;

const value=toHalfWidthDigits(before).replace(/[．。]/g,'.').replace(/[－−]/g,'-');

return value;
}

function quantityOffer(item){
const price=Math.round(Number(item.price||0)*100),qty=Math.max(0,Math.floor(Number(item.qty)||0));
const size=Number(item.offerQty),offer=Math.round(Number(item.offerTotal)*100);
const enabled=!item.manual&&Number.isInteger(size)&&size>=2&&item.offerTotal!==''&&item.offerTotal!=null&&Number.isFinite(offer)&&offer>=0&&offer<price*size;
// Missing offerTotal must never enter arithmetic (0 * NaN is still NaN).
if(!enabled)return {total:qty*price/100,groups:0,size:0,offer:0,saving:0};
const groups=Math.floor(qty/size),remainder=qty-groups*size;
return {total:(groups*offer+remainder*price)/100,groups,size:enabled?size:0,offer:offer/100,saving:(qty*price-groups*offer-remainder*price)/100};
}
function cartQuantityOffers(items){
 const pools=new Map();
 const results=items.map(item=>{const offer=quantityOffer(item),qty=Math.max(0,Math.floor(Number(item.qty)||0));
  if(!offer.size)return {...offer,offset:0,pooledQty:qty};
  const key=JSON.stringify([Math.round(Number(item.price)*100),offer.size,Math.round(offer.offer*100)]);
  if(!pools.has(key))pools.set(key,{qty:0,entries:[],item});
  const pool=pools.get(key),result={...offer,offset:pool.qty,pooledQty:0};pool.entries.push({result,qty});pool.qty+=qty;return result;
 });
 pools.forEach(pool=>{const offer=quantityOffer({...pool.item,qty:pool.qty}),price=Math.round(Number(pool.item.price)*100),cents=Math.round(offer.offer*100),base=Math.floor(cents/offer.size),extra=cents%offer.size,discounted=offer.groups*offer.size;
  const prefix=n=>{const d=Math.min(n,discounted);return Math.floor(d/offer.size)*cents+(d%offer.size)*base+Math.min(d%offer.size,extra)+(n-d)*price;};
  pool.entries.forEach(({result,qty})=>{const total=prefix(result.offset+qty)-prefix(result.offset);Object.assign(result,{total:total/100,saving:(qty*price-total)/100,groups:offer.groups,pooledQty:pool.qty});});
 });return results;
}
function cartOfferTotal(items){return cartQuantityOffers(items).reduce((sum,offer)=>sum+Math.round(offer.total*100),0)/100;}

function allocateOrderEditDeposit(items,originalDeposits,originalFirstRow){
const amount=value=>String(value??'').replace(/,/g,'').split(/\r?\n/).reduce((sum,line)=>sum+(Number(line.trim())||0),0);
const first=items.find(item=>Number(item.row)===Number(originalFirstRow));
if(items.length<2||!first||first.deposit==null||String(first.deposit).trim()===''||amount(first.deposit)===amount(originalDeposits[0]))return;
const originalTotal=originalDeposits.reduce((sum,value)=>sum+amount(value),0);
const remaining=Math.round((originalTotal-items.reduce((sum,item)=>sum+amount(item.deposit),0))*100)/100;
if(remaining<=0)return;
const empty=items.find(item=>item!==first&&item.deposit!=null&&String(item.deposit).trim()==='');
if(!empty)throw new Error('剩餘訂金 $'+remaining+' 需要一個訂金空白的商品列');
empty.deposit=String(remaining);
}

  }

  return;

  return;
}
const request=(async()=>{
  const revision=onlineMutationRevision,epoch=backendSyncPageEpochs.get('online')||0;
  const d=await api('online',{compact:'1',fresh:force?'1':'0'});

  }
})();

  if(onlineLoadPromise===request)onlineLoadPromise=null;

const res=document.getElementById('onlineResult');
if(res&&!background){
  if(!onlineLoadedAt){
    res.innerHTML=`<div class="empty">${esc(e.message)}</div>`;

rows.forEach((row,index)=>{
 const customer=String(getCustomerName(row)||'').trim();

 if(!customer)return;

 const tokens=[...(manual?[JSON.stringify([customer,'manual',manual])]:[]),...(day?[JSON.stringify([customer,'day',day])]:[]),...(merge?[JSON.stringify([customer,'merge',merge])]:[])];
 tokens.forEach(token=>{if(identities.has(token))parent.set(root(key),root(identities.get(token)));else identities.set(token,key);});
});
const orders=new Map();
rows.forEach(row=>{
 const key=root(keys.get(row));
 if(!orders.has(key))orders.set(key,{customer:String(getCustomerName(row)||'未填姓名').trim(),time:String(getOnlineData(row,['時間','購買時間'])||'').trim(),items:[],depositMergeKey:''});

function onlineMonthNumber(v){
const s=String(v||'').trim();
let m=s.match(/^\d{4}[-\/](\d{1,2})[-\/]/);
if(m)return Number(m[1]);
m=s.match(/^(\d{1,2})[-\/](\d{1,2})/);

const d=new Date(s);

function onlineSourceMatches(row,query){

}

let onlineCardLayoutObserver=null,onlineCardVisibilityObserver=null,onlineCardLayoutRoot=null;
const onlineCardSlots=new Map(),onlineCardRecords=new Map();
function resetOnlineCardLayout(){

onlineCardLayoutObserver=null;onlineCardVisibilityObserver=null;onlineCardLayoutRoot=null;onlineCardSlots.clear();onlineCardRecords.clear();
}
function onlineScrollPosition(node){

return !node.isConnected&&item&&node.matches('.groupCardItems')?{top:item.top,left:item.left}:{top:node.scrollTop,left:node.scrollLeft};
}
function onlineRestoreScroll(node,top,left){
const item=onlineCardRecords.get(node.closest?.('.groupCard'));
if(item&&node.matches('.groupCardItems')){item.top=top;item.left=left;}
node.scrollTop=top;node.scrollLeft=left;

// 離開畫面的整張卡保留原節點；勾選、背景作業及卡內捲動仍使用同一筆資料。
function onlineQueryAll(selector,root=document){
const found=[...root.querySelectorAll(selector)];
if(onlineCardLayoutRoot?.isConnected&&(root===document||root===onlineCardLayoutRoot||root.contains(onlineCardLayoutRoot))){
 const nodes=new Set(found.filter(node=>!onlineCardRecords.has(node.closest('.groupCard'))));
 for(const item of onlineCardSlots.values()){
  if(item.card.matches(selector))nodes.add(item.card);
  item.card.querySelectorAll(selector).forEach(node=>nodes.add(node));
 }
 return [...nodes];
}
return found;
}
function prepareOnlineCardLayout(root){
resetOnlineCardLayout();
const cards=[...root.querySelectorAll('.orderCards>.groupCard')];
if(cards.length<=80||typeof ResizeObserver!=='function'||typeof IntersectionObserver!=='function')return;
onlineCardLayoutRoot=root;
const byCard=new Map();
const mount=item=>{
 if(item.card.parentElement===item.slot)return;
 item.slot.style.height='';item.slot.append(item.card);
 const list=item.card.querySelector('.groupCardItems');if(list){list.scrollTop=item.top;list.scrollLeft=item.left;}
};
const update=item=>{
 if(item.visible){mount(item);return;}
 if(!item.height||item.card.contains(document.activeElement)||item.card.parentElement!==item.slot)return;
 const list=item.card.querySelector('.groupCardItems');if(list){item.top=list.scrollTop;item.left=list.scrollLeft;}
 item.slot.style.height=item.height+'px';item.card.remove();
};
let width=0;
const observer=new ResizeObserver(entries=>{
 if(onlineCardLayoutObserver!==observer||!root.isConnected)return;
 for(const entry of entries){
  if(entry.target===root){
   const next=entry.contentRect.width;
   if(width&&next>0&&Math.abs(next-width)>1){for(const item of onlineCardSlots.values()){item.height=0;mount(item);}}
   if(next>0)width=next;
   continue;
  }
  const item=byCard.get(entry.target);
  if(!item||!item.card.isConnected||entry.contentRect.height<=0)continue;

 try{
