<body>
<div class="top">JIWU吉物販售</div>
<div class="nav">
<button id="btn-store" class="active" onclick="tab('store',this)">店面</button>
<button id="btn-online" onclick="tab('online',this)">線上</button>
<button id="btn-ship" onclick="tab('ship',this)">出貨</button>

<div id="app" class="page"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbydO3PzBMzM-kkYqhq-sJOsp6eJOKhpR2PJYV9_NvyfzIBMn6n4il8Mz4_iQj2EWgg5/exec';
let onlineRows=[];
let onlineHeaders=[];
let storeCart=[];
let payment='';
let salesperson='';
let onlineSearchText='';
let onlineCargo='現貨';
let isCustomerView=false;
let isGroupView=false;
/* =========================================================
   API
========================================================= */
function api(action,params={}){
const retryable=[
'storeProduct',
'online',
'onlineCustomer',
'group',
'ship',
'saveOnlinePayment'
].includes(action);
return new Promise((resolve,reject)=>{
let attempt=0;
let done=false;
const run=()=>{
attempt++;
const cb=
'cb_'+
Date.now()+
'_'+
Math.random().toString(36).slice(2);
const s=document.createElement('script');
let timer=null;
const cleanup=()=>{
if(timer)clearTimeout(timer);
delete window[cb];
if(s.parentNode){
s.parentNode.removeChild(s);
}
};
window[cb]=data=>{
if(done)return;
done=true;
cleanup();
if(data&&data.ok===false){
reject(
new Error(
data.error||'GAS 錯誤'
)
);
return;
}
resolve(data);
};
s.onerror=()=>{
cleanup();
if(retryable&&attempt<2){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('無法連線 GAS')
);
}
};
const q=new URLSearchParams({
action,
callback:cb,
_t:Date.now(),
...params
});
s.src=
API_URL+
'?'+
q.toString();
s.async=true;
(document.head||document.body)
.appendChild(s);
timer=setTimeout(()=>{
cleanup();
if(retryable&&attempt<2){
setTimeout(run,300);
return;
}
if(!done){
done=true;
reject(
new Error('GAS 連線逾時')
);
}
},15000);
};
run();
});
}
/* =========================================================
   基本
========================================================= */
function esc(v){
return String(v??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'",'&#39;')
}
function money(v){
return Number(v||0).toLocaleString()
}
function findHeader(headers,names){
for(const n of names){
const i=headers.indexOf(n);
if(i>=0)return headers[i];
}
return null
}
function getOnlineData(row,names){
const h=findHeader(
onlineHeaders,
names
);
return h?row.data[h]:''
}
function formatOnlineTime(v){
if(!v)return '';
const s=String(v).trim();
let m=s.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[2]).padStart(2,'0')+
'/'+
String(m[3]).padStart(2,'0')
}
m=s.match(
/(\d{1,2})[-\/](\d{1,2})/
);
if(m){
return String(m[1]).padStart(2,'0')+
'/'+
String(m[2]).padStart(2,'0')
}
return s
}
function timeValue(v){
if(!v)return 0;
const s=String(v).trim();
let m=s.match(
/(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
+m[1],
+m[2]-1,
+m[3],
+m[4],
+(m[5]||0)
).getTime()
}
m=s.match(
/(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{2})(?::(\d{2}))?/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2],
+(m[3]||0),
+(m[4]||0)
).getTime()
}
m=s.match(
/(\d{1,2})\/(\d{1,2})/
);
if(m){
return new Date(
2000,
+m[1]-1,
+m[2]
).getTime()
}
return 0
}
/* =========================================================
   TAB
========================================================= */
function tab(name,el){
document
.querySelectorAll('.nav button')
.forEach(x=>x.classList.remove('active'));
if(el)el.classList.add('active');
sessionStorage.setItem(
'jiwu_current_tab',
name
);
if(name==='store'){
renderStore();
}
if(name==='online'){
/*
 * 每次點擊「線上」
 * 都回到預設頁面
 */
onlineSearchText='';
onlineCargo='現貨';
isCustomerView=false;
isGroupView=false;
renderOnline();
}
if(name==='ship'){
renderShip();
}
}
let storeCartSyncTimer=null;
let storeCartLoading=false;
/*
 * 從 GAS 取得共用購物車
 */
async function loadStoreCart(){
if(!salesperson){
storeCart=[];
renderCart();
return;
}
if(storeCartLoading)return;
storeCartLoading=true;
try{
const d=await api(
'storeCart',
{salesperson}
);
storeCart=Array.isArray(d.cart)?d.cart:[];
renderCart();
}catch(e){
console.error('讀取購物車失敗',e);
}finally{
storeCartLoading=false;
}
}
/*
 * 將目前商品清單同步到 GAS
 */
async function saveStoreCart(){
if(!salesperson)return;
try{
await api(
'storeCartSet',
{
salesperson,
items:JSON.stringify(
storeCart.map(x=>({
code:x.code||'',
name:x.name||'',
price:Number(x.price||0),
qty:Number(x.qty||1),
manual:!!x.manual
}))
)
}
);
}catch(e){
console.error('儲存購物車失敗',e);
}
}
/*
 * 自動同步
 */
function startStoreCartSync(){
stopStoreCartSync();
storeCartSyncTimer=setInterval(()=>{
const current=sessionStorage.getItem('jiwu_current_tab');
if(current==='store'&&salesperson){
loadStoreCart();
}
},1500);
}
function stopStoreCartSync(){
if(storeCartSyncTimer){
clearInterval(storeCartSyncTimer);
storeCartSyncTimer=null;
}
}
/* =========================================================
   店面
========================================================= */
function detectSalesperson(){
const q=new URLSearchParams(location.search);
const user=
q.get('user')||
q.get('salesperson')||
localStorage.getItem('jiwu_salesperson')||
'';
if(user==='花花'||user==='小法師'){
salesperson=user;
localStorage.setItem('jiwu_salesperson',user);
}
return salesperson;
}
async function setSalesperson(el,v){
salesperson=v;
document
.querySelectorAll('.salesperson button')
.forEach(x=>x.classList.remove('active'));
if(el)el.classList.add('active');
localStorage.setItem('jiwu_salesperson',salesperson);
await loadStoreCart();
startStoreCartSync();
}

async function scan(){
const input=document.getElementById('barcode');
const code=input.value.trim();
if(!code){
input.focus();
return;
}
if(!salesperson){
alert('請先選擇銷售員');
return;
}
try{
const d=await api('storeScan',{
barcode:code,
salesperson
});
storeCart=Array.isArray(d.cart)?d.cart:[];
input.value='';
input.focus();
renderCart();
}catch(e){
alert(e.message);
input.focus();
}
}
async function addManualProduct(){
if(!salesperson){
alert('請先選擇銷售員');
return;
}
const name=document.getElementById('manualName').value.trim();
const price=Number(document.getElementById('manualPrice').value||0);
if(!name){
alert('請輸入商品名稱');
return;
}
if(price<0){
alert('金額不能小於 0');
return;
}
storeCart.push({
code:'',
name,
price,
qty:1,
manual:true
});
document.getElementById('manualName').value='';
document.getElementById('manualPrice').value='';
renderCart();
await saveStoreCart();
}
function renderCart(){
const box=document.getElementById('storeCart');
if(!box)return;
if(!storeCart.length){
box.innerHTML='<div class="empty">尚未加入商品</div>';
const total=document.getElementById('storeTotal');
if(total)total.textContent='$0';
return
}
box.innerHTML=storeCart.map((x,i)=>`

<div class="cartName">

${x.manual?'手動商品':esc(x.code)}

</div>
<div class="qty">

<b>${x.qty}</b>
<button onclick="changeQty(${i},1)">＋</button>
<button class="btn red" style="padding:4px 8px" onclick="removeCart(${i})">×</button>
</div>
</div>
`).join('');

async function changeQty(i,n){
if(!storeCart[i])return;
storeCart[i].qty+=n;
if(storeCart[i].qty<=0)storeCart.splice(i,1);
renderCart();
await saveStoreCart();
}
async function removeCart(i){
storeCart.splice(i,1);
renderCart();
await saveStoreCart();
}
function calcChange(){
const total=storeCart.reduce((s,x)=>s+x.price*x.qty,0);
const receivedEl=document.getElementById('received');
const el=document.getElementById('changeText');
if(!receivedEl||!el)return;
const value=receivedEl.value;
if(value===''){
el.textContent='';
return
}
const change=Number(value)-total;
el.textContent=
change>=0
?'找零：$'+money(change)
:'尚差：$'+money(Math.abs(change))
}
function setPayment(el,v){
payment=v;
document.querySelectorAll('.payment button').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
const box=document.getElementById('last5Box');
const input=document.getElementById('last5');
if(v==='中信'||v==='LB'){
box.style.display='block';
input.focus();
}else{
box.style.display='none';
input.value='';
}
}

return
}

payment==='中信'

function cargoCategory(cargo){
cargo=String(cargo||'').trim();
if(
cargo==='補貨登記'||
cargo==='SOLD OUT'||
cargo==='S☹LD OUT'||
cargo==='補登'
)return '補貨登記';
if(/^\d{1,2}月$/.test(cargo))return '受注';
if(cargo==='現貨')return '現貨';
if(cargo==='已訂購')return '已訂購';
if(cargo==='預訂')return '預訂';
return cargo
}
function getOrderStatus(row){
return String(getOnlineData(row,['狀態','訂購狀態','已訂購','購買'])||'').trim()
}
function isOpenedRow(row){
const status=getOrderStatus(row);
const opened=getOnlineData(row,['已開單','開單']);
return status==='已開單'||isTruthy(opened)
}
function cargoDisplay(row){
const raw=String(getOnlineData(row,['貨況'])||'').trim();
const status=getOrderStatus(row);
const category=cargoCategory(raw);
if(category==='預訂'){
return isTruthy(status)||status==='已訂購'
?{text:'訂',color:'#FBB550'}
:{text:'未',color:'#E78790'}
}
if(/^\d{1,2}月$/.test(raw))return {text:raw,color:'#85C2D0'};
if(category==='補貨登記')return {text:'補',color:'#7E88A0'};
if(category==='現貨')return {text:'現',color:'#DABBD8'};
return {text:raw,color:'#8ca7b2'}
}
function getPaymentMethod(row){
const direct=String(
getOnlineData(row,['付款方式','支付方式','付款','收款方式'])||''
).trim();
if(direct)return direct;
const last5=String(getLast5(row)||'').trim();
if(last5.startsWith('中信'))return '中信';
if(last5.toUpperCase().startsWith('LB'))return 'LB';
if(last5.toUpperCase()==='LP')return 'LP';
if(last5.toLowerCase()==='ipass')return 'ipass';
return ''
}
function needsLast5(rows){
return rows.some(row=>{
const method=getPaymentMethod(row).toUpperCase();
return method.includes('中信')||method==='LB'
})
}
function normalizePayment(v){
const value=String(v||'').trim().toLowerCase();
if(value==='中信')return '中信';
if(value==='lb')return 'LB';
if(value==='lp')return 'LP';
if(value==='ipass')return 'ipass';
return ''
}
function paymentLast5Value(v){
return String(v||'').replace(/\D/g,'').slice(-5)
}
function applyOnlineFilter(){
let rows=[...onlineRows];
if(onlineSearchText){
const key=onlineSearchText.toLowerCase();
rows=rows.filter(x=>{

String(
getOnlineData(
x,

]
)||''
).toLowerCase();

getOnlineData(x,['時間','購買時間'])||''
);

customer.includes(key)||
group.includes(key)||
(searchDate.length>=3&&dateKey.includes(searchDate))
);
});
}
if(onlineCargo){

String(
getOnlineData(
x,

'狀態'
]

getOnlineData(

);

getOnlineData(

);

}

}
return category===onlineCargo;
});

return[

'1',
'y',
'yes',
'是',
'已',
'已訂購',
'已開單',
'已出貨'
].includes(
String(v??'')
.trim()
.toLowerCase()
)
}

function showOrderCards(rows,summary){

rows.forEach(row=>{
const customer=String(getCustomerName(row)||'未填姓名').trim();
const time=String(getOnlineData(row,['時間','購買時間'])||'').trim();
const key=customer+'\u0000'+time;
if(!orders.has(key))orders.set(key,{customer,time,items:[]});
orders.get(key).items.push(row);
});
let totalAmount=0;
orders.forEach(order=>order.items.forEach(row=>{
totalAmount+=Number(getOnlineData(row,['售價','價格'])||0);
}));
let html=`

`;
orders.forEach(order=>{
let orderTotal=0;
order.items.forEach(row=>{
orderTotal+=Number(getOnlineData(row,['售價','價格'])||0);
});
const deposit=order.items.map(row=>getOnlineData(row,['訂金'])).find(v=>v!==''&&v!=null)||'';
const last5=order.items.map(row=>getLast5(row)).find(v=>v!==''&&v!=null)||'';

function updateShipSelection(){
const checked=
[
...document
.querySelectorAll(
'.shipRecordCheck:checked'
)
];
const area=
document.getElementById(
'shipSelectedArea'
);
if(!area)return;
if(!checked.length){
area.innerHTML='';
return
}
let total=0;
let deposit=0;
const items=[];
checked.forEach(ch=>{
const item=ch.closest('.shipItem');
if(!item)return;
const spans=
item.querySelectorAll('span');
const name=
spans[0]
?spans[0].textContent.trim()
:'';
const priceText=
spans[3]
?spans[3].textContent
:'';
const depositText=
spans[4]
?spans[4].textContent
:'';
const price=
Number(
priceText
.replace(/[^\d.-]/g,'')
)||0;
const dep=
Number(
depositText
.replace(/[^\d.-]/g,'')
)||0;
total+=price;
deposit+=dep;
items.push({
name,
price,
deposit
});
});
const balance=
Math.max(
0,
total-deposit
);
area.innerHTML=`
<div class="card shipSummary">
<div class="cardHead">
<span>
已選 ${items.length} 件
</span>
<button
class="btn"
onclick="copyShipText()">
複製出貨文
</button>
</div>
<div class="shipSelected">
${items.map(x=>`
<div class="shipSelectedRow">
<span class="shipSelectedName">
${esc(x.name)}
</span>
<span class="shipSelectedPrice">
$${money(x.price)}
</span>
</div>
`).join('')}
</div>
<div class="shipTotalBox">
<div class="shipTotalLine">
<span>總金額</span>
<strong>$${money(total)}</strong>
</div>
<div class="shipTotalLine">
<span>已付訂金</span>
<strong>-$${money(deposit)}</strong>
</div>
<div class="shipTotalLine shipBalance">
<span>尾款</span>
<strong>$${money(balance)}</strong>
</div>
</div>
</div>
`;
}
/* =========================================================

========================================================= */
function copyShipText(){
const checked=
[
...document
.querySelectorAll(
'.shipRecordCheck:checked'
)
];
if(!checked.length){
alert('請先勾選商品');
return
}
const groups={};
checked.forEach(ch=>{
const item=ch.closest('.shipItem');
if(!item)return;
const card=
item.closest('.card');
const head=
card
?card.querySelector('.cardHead')
:null;
let customer='';
if(head){
const first=head.querySelector('div');
if(first){
customer=
first.textContent.trim();
}
}
const spans=
item.querySelectorAll('span');
const name=
spans[0]
?spans[0].textContent.trim()
:'';
if(!groups[customer]){
groups[customer]=[];
}
groups[customer].push(name);
});
const text=
Object.keys(groups)
.map(customer=>
customer+
'：'+
groups[customer].join('+')+
'。'
)
.join('\n');
navigator.clipboard
.writeText(text)
.then(()=>{
alert('出貨文已複製');
})
.catch(()=>{
const ta=
document.createElement('textarea');
ta.value=text;
document.body.appendChild(ta);
ta.select();
document.execCommand('copy');
ta.remove();
alert('出貨文已複製');
});
}
